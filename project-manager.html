<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager | Photo & Video Album</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080809;
            --surface: #0f0f12;
            --surface2: #16161b;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f2;
            --text-muted: #5a5a68;
            --text-dim: #8e8ea0;
            --accent: #a855f7;
            --green: #22d3a5;
            --red: #ef4444;
            --mono: 'DM Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--sans);
            padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; }

        .subtitle {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .controls { display: flex; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }

        .btn {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            font-family: var(--mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.05); border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
        .btn.primary:hover { background: #9333ea; }
        .btn.danger { background: rgba(239,68,68,0.1); border-color: var(--red); color: var(--red); }
        .btn.danger:hover { background: rgba(239,68,68,0.2); }
        .btn-small { padding: 8px 12px; font-size: 9px; }

        /* ===== PROJECT CARDS ===== */
        .projects-section { display: grid; gap: 0; margin-bottom: 40px; }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 16px;
            align-items: center;
            transition: transform 0.15s, opacity 0.15s, border-color 0.15s;
            margin-bottom: 10px;
        }
        .project-card.dragging { opacity: 0.35; transform: scale(0.97); border-color: var(--accent); }

        .drop-line {
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin: -5px 0;
            box-shadow: 0 0 8px rgba(168,85,247,0.5);
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-muted);
            font-size: 18px;
            padding: 6px 4px;
            border-radius: 4px;
            transition: color 0.2s, background 0.2s;
            user-select: none;
        }
        .drag-handle:hover { color: var(--accent); background: rgba(168,85,247,0.08); }
        .drag-handle:active { cursor: grabbing; }

        .project-info { display: grid; gap: 6px; }
        .project-num { font-family: var(--mono); font-size: 10px; color: var(--accent); }
        .project-title { font-size: 18px; font-weight: 700; }
        .project-meta { font-family: var(--mono); font-size: 10px; color: var(--text-muted); display: grid; gap: 4px; }
        .project-media { font-family: var(--mono); font-size: 9px; color: var(--text-dim); word-break: break-all; }
        .project-actions { display: flex; gap: 8px; }

        /* ===== FORM ===== */
        .form-section {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 6px;
            margin-bottom: 30px;
            display: none;
        }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 20px; display: grid; gap: 8px; }

        label {
            font-family: var(--mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        input, textarea, select {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            font-family: var(--mono);
            font-size: 11px;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }
        input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(168,85,247,0.1); }
        textarea { resize: vertical; min-height: 80px; }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-actions { display: flex; gap: 10px; margin-top: 20px; }

        /* File picker buttons row */
        .file-picker-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .file-picker-row .btn {
            font-size: 9px;
            padding: 8px 14px;
        }

        /* File status display */
        .file-status {
            font-family: var(--mono);
            font-size: 10px;
            color: var(--green);
            padding: 8px 12px;
            background: rgba(34,211,165,0.05);
            border: 1px solid rgba(34,211,165,0.15);
            border-radius: 4px;
            word-break: break-all;
            display: none;
        }
        .file-status.visible { display: block; }

        .message {
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: var(--mono);
            font-size: 11px;
            display: none;
        }
        .message.show { display: block; }
        .message.success { background: rgba(34,211,165,0.1); border: 1px solid var(--green); color: var(--green); }
        .message.error { background: rgba(239,68,68,0.1); border: 1px solid var(--red); color: var(--red); }

        .hidden-input { display: none; }

        .stats {
            background: var(--surface2);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-muted);
        }
        .stats span { color: var(--accent); font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>PROJECT MANAGER</h1>
        <p class="subtitle">Správa foto & video alba — přidávej, řaď přetažením, upravuj projekty</p>

        <div class="controls">
            <button class="btn primary" id="btn-add-project">+ Přidat projekt</button>
            <button class="btn" id="btn-export-json">⬇ Exportovat JSON</button>
            <button class="btn" id="btn-import-json">⬆ Importovat JSON</button>
            <button class="btn danger" id="btn-reset-defaults" style="margin-left: auto;">⚠ Resetovat do výchozího stavu</button>
            <input type="file" id="import-input" class="hidden-input" accept=".json">
        </div>

        <div id="message" class="message"></div>

        <div class="stats">
            Počet projektů: <span id="project-count">0</span>
            · <small>čísla se přepočítávají automaticky · přetáhni ☰ pro změnu pořadí</small>
        </div>

        <div id="form-section" class="form-section">
            <h2 style="margin-bottom: 20px; font-size: 18px;">Nový projekt</h2>

            <div class="form-row">
                <div class="form-group">
                    <label>Název projektu</label>
                    <input type="text" id="form-title" placeholder="Např. AutoPortret">
                </div>
                <div class="form-group">
                    <label>Typ obsahu</label>
                    <select id="form-type">
                        <option value="video">📹 Video</option>
                        <option value="photo">📸 Photo</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Tagy (oddělené /)</label>
                <input type="text" id="form-tags" placeholder="Experimental / Fine Art / Cinematography">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Kamera (Technika)</label>
                    <input type="text" id="form-camera" placeholder="Např. Sony FX3, RED Komodo">
                </div>
                <div class="form-group">
                    <label>Optika / Objektiv</label>
                    <input type="text" id="form-lens" placeholder="Např. Sigma 24-70mm f/2.8">
                </div>
            </div>

            <div class="form-group">
                <label>Software</label>
                <input type="text" id="form-software" placeholder="Např. DaVinci Resolve, Premiere Pro">
            </div>

            <div class="form-group" id="media-group">
                <label>Video soubory</label>
                <div class="file-picker-row">
                    <button type="button" class="btn" id="btn-pick-video">📂 Vybrat video soubory</button>
                </div>
                <input type="file" id="video-file-input" class="hidden-input" accept="video/*" multiple>
                <div class="file-status" id="video-status"></div>
                <textarea id="form-media" placeholder="Nebo napiš ručně: video1.mp4, video2.mp4"></textarea>
            </div>

            <div class="form-group" id="photos-group" style="display:none;">
                <label>Fotografie</label>
                <div class="file-picker-row">
                    <button type="button" class="btn" id="btn-pick-photos">📂 Vybrat soubory</button>
                    <button type="button" class="btn" id="btn-pick-folder">📁 Vybrat celou složku</button>
                    <button type="button" class="btn danger" id="btn-clear-photos" style="margin-left:auto;">✕ Vymazat vše</button>
                </div>
                <input type="file" id="photos-file-input" class="hidden-input" accept="image/*" multiple>
                <input type="file" id="folder-file-input" class="hidden-input" webkitdirectory>
                <div class="file-status" id="photos-status"></div>
                <textarea id="form-photos" placeholder="Nebo napiš ručně: foto1.jpg, foto2.jpg"></textarea>
            </div>

            <div class="form-group">
                <label>Popis</label>
                <textarea id="form-desc" placeholder="Hluboká introspektivní sonda..."></textarea>
            </div>

            <div class="form-actions">
                <button class="btn primary" id="btn-save-project">Uložit projekt</button>
                <button class="btn" id="btn-cancel">Zrušit</button>
            </div>
        </div>

        <div class="projects-section" id="projects-list"></div>
    </div>

    <script>
    (() => {
        let projects = [];
        let editingId = null;

        const messageEl = document.getElementById('message');
        const formSection = document.getElementById('form-section');
        const projectsList = document.getElementById('projects-list');
        const projectCountEl = document.getElementById('project-count');
        const importInput = document.getElementById('import-input');

        // ==========================================
        //  HELPERS
        // ==========================================
        function fmt(idx) { return String(idx + 1).padStart(2, '0'); }

        function renumber() {
            projects.forEach((p, i) => { p.num = fmt(i); });
        }

        function esc(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function showMessage(text, type = 'success') {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
            setTimeout(() => messageEl.classList.remove('show'), 3500);
        }

        // ==========================================
        //  LOAD / SAVE
        // ==========================================
        function loadProjects() {
            const stored = localStorage.getItem('portfolio_projects');
            if (stored) {
                try { projects = JSON.parse(stored); } catch (e) { projects = []; }
            } else {
                projects = [
                    { id:1, num:'01', title:'AutoPortret',              tags:'Experimental / Fine Art / Cinematography',      type:'video', media:'1.AutoPortret.mp4', photos:['photo/1.JPG', 'photo/2.jpg', 'photo/3.JPG', 'photo/4.jpg'], camera:'Sony FX3', lens:'Sigma 24-70mm f/2.8', software:'DaVinci Resolve', description:'Hluboká introspektivní sonda do duše tvůrce. Práce s kontrastem, stíny a minimalistickým zvukovým designem.' },
                    { id:2, num:'02', title:'Reklama',                  tags:'Commercial / Brand Identity / Direction',  type:'video', media:'2.Reklama.mov', description:'Komerční projekt s důrazem na špičkový color grading a dynamický střih.' },
                    { id:3, num:'03', title:'AP-Trailer',               tags:'Promo / Fast Pace / Sound Design',             type:'video', media:'3.AP-Trailer.mp4', description:'Úderný, kinetický trailer navržený tak, aby okamžitě upoutal pozornost.' },
                    { id:4, num:'04', title:'AP-Hodinář',               tags:'Documentary / Narrative / Macro Detail',       type:'video', media:'4.AP-Hodinář.mp4', description:'Dokumentární esej zachycující preciznost lidského řemesla.' },
                    { id:5, num:'05', title:'AP-Zubní Technik',         tags:'Professional Profile / Industrial / Precision',      type:'video', media:'5.AP-Zubní_Technik.mp4', description:'Vizuální studie profesní preciznosti.' },
                    { id:6, num:'06', title:'Semifinále Zlatého Ámose', tags:'Event / Reportage / Live Action',             type:'video', media:'6.Semifinále Zlatého Ámose 2025.mp4', videos:['6.Semifinále Zlatého Ámose 2025.mp4', 'Animace.mp4'], description:'Reportážní zachycení prestižní události roku 2025.' },
                    { id:7, num:'07', title:'Svačinka',                 tags:'Short Fiction / Comedy / Narrative',        type:'video', media:'7.Svačinka.mp4', description:'Krátkometrážní narativní projekt s odlehčenou atmosférou.' },
                    { id:8, num:'08', title:'ZaOkny',                   tags:'Atmospheric / Mood Film / Ambient',       type:'video', media:'8.ZaOkny.mov', description:'Vizuální báseň a lo-fi atmosférická studie okolního světa.' },
                    { id:9, num:'09', title:'Noční galerie',            tags:'Photography / Night / Street',            type:'photo', photos:['9.Galerie_1.jpg','9.Galerie_2.jpg','9.Galerie_3.jpg','9.Galerie_4.jpg'], description:'Galerie nočních snímků s atmosférou pouličních světel a tichých momentů.' }
                ];
                localStorage.setItem('portfolio_projects', JSON.stringify(projects));
            }
            renumber();
            render();
        }

        function saveProjects() {
            renumber();
            localStorage.setItem('portfolio_projects', JSON.stringify(projects));
            render();
        }

        // ==========================================
        //  FORM VISIBILITY
        // ==========================================
        function updateFormVisibility() {
            const type = document.getElementById('form-type').value;
            document.getElementById('media-group').style.display = type === 'video' ? 'block' : 'none';
            document.getElementById('photos-group').style.display = 'block';

            const label = document.querySelector('#photos-group label');
            if (type === 'video') {
                label.textContent = 'BTS / Doplňující fotografie (nepovinné)';
            } else {
                label.textContent = 'Fotografie (povinné)';
            }
        }

        // ==========================================
        //  RENDER
        // ==========================================
        function render() {
            renumber();
            projectCountEl.textContent = projects.length;
            const totalStr = String(projects.length).padStart(2, '0');

            if (projects.length === 0) {
                projectsList.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:30px;font-family:var(--mono);font-size:12px;">ŽÁDNÉ PROJEKTY — PŘIDEJ PRVNÍ NEBO IMPORTUJ JSON.</div>';
                return;
            }

            projectsList.innerHTML = projects.map((p, idx) => `
                <div class="project-card" data-index="${idx}">
                    <div class="drag-handle" draggable="true" data-index="${idx}">☰</div>
                    <div class="project-info">
                        <div class="project-num">[${p.num} / ${totalStr}]</div>
                        <div class="project-title">${esc(p.title)}</div>
                        <div class="project-meta">
                             <div><strong>Typ:</strong> ${p.type}</div>
                             <div><strong>Tagy:</strong> ${esc(p.tags)}</div>
                             ${p.camera ? `<div><strong>Kamera:</strong> ${esc(p.camera)}</div>` : ''}
                             ${p.lens ? `<div><strong>Optika:</strong> ${esc(p.lens)}</div>` : ''}
                             ${p.software ? `<div><strong>SW:</strong> ${esc(p.software)}</div>` : ''}
                             ${p.type === 'video'
                                 ? `<div class="project-media"><strong>Videa:</strong> ${Array.isArray(p.videos) ? p.videos.length : 1} soub. ${Array.isArray(p.photos) && p.photos.length ? ` (BTS: ${p.photos.length})` : ''}</div>`
                                 : `<div class="project-media"><strong>Fotky:</strong> ${Array.isArray(p.photos) ? p.photos.length : 0} položek</div>`
                             }
                        </div>
                    </div>
                    <div class="project-actions">
                        <button class="btn btn-small" data-action="edit" data-idx="${idx}">Upravit</button>
                        <button class="btn btn-small danger" data-action="delete" data-idx="${idx}">Smazat</button>
                    </div>
                </div>
            `).join('');
        }

        // ==========================================
        //  DRAG & DROP — PROJECT REORDERING
        // ==========================================
        let dragSrcIdx = null;
        let dropLineEl = null;
        let dropTargetIdx = null;
        let dropPos = null;

        projectsList.addEventListener('dragstart', (e) => {
            const handle = e.target.closest('.drag-handle');
            if (!handle) { e.preventDefault(); return; }
            dragSrcIdx = parseInt(handle.dataset.index);
            handle.closest('.project-card').classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(dragSrcIdx));
            dropLineEl = document.createElement('div');
            dropLineEl.className = 'drop-line';
            dropLineEl.style.display = 'none';
        });

        projectsList.addEventListener('dragover', (e) => {
            if (dragSrcIdx === null) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            const card = e.target.closest('.project-card');
            if (!card) return;
            const idx = parseInt(card.dataset.index);
            if (idx === dragSrcIdx) { removeLine(); return; }
            const rect = card.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            if (e.clientY < mid) {
                dropPos = 'before'; dropTargetIdx = idx;
                card.parentNode.insertBefore(dropLineEl, card);
            } else {
                dropPos = 'after'; dropTargetIdx = idx;
                card.parentNode.insertBefore(dropLineEl, card.nextSibling);
            }
            dropLineEl.style.display = 'block';
        });

        projectsList.addEventListener('dragleave', (e) => {
            if (!projectsList.contains(e.relatedTarget)) removeLine();
        });

        projectsList.addEventListener('dragend', () => {
            const d = projectsList.querySelector('.dragging');
            if (d) d.classList.remove('dragging');
            removeLine();
            dragSrcIdx = null; dropTargetIdx = null; dropPos = null;
        });

        projectsList.addEventListener('drop', (e) => {
            e.preventDefault();
            if (dragSrcIdx === null || dropTargetIdx === null) return;
            let newIdx = dropPos === 'before' ? dropTargetIdx : dropTargetIdx + 1;
            const [moved] = projects.splice(dragSrcIdx, 1);
            if (dragSrcIdx < newIdx) newIdx--;
            projects.splice(newIdx, 0, moved);
            removeLine();
            dragSrcIdx = null; dropTargetIdx = null; dropPos = null;
            saveProjects();
            showMessage(`"${moved.title}" → pozice ${newIdx + 1}`, 'success');
        });

        function removeLine() {
            if (dropLineEl && dropLineEl.parentNode) dropLineEl.parentNode.removeChild(dropLineEl);
            if (dropLineEl) dropLineEl.style.display = 'none';
        }

        // ==========================================
        //  EDIT / DELETE — event delegation
        // ==========================================
        projectsList.addEventListener('click', (e) => {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const idx = parseInt(btn.dataset.idx);
            if (btn.dataset.action === 'edit') editProject(idx);
            if (btn.dataset.action === 'delete') deleteProject(idx);
        });

        function editProject(idx) {
            editingId = idx;
            const p = projects[idx];
            document.getElementById('form-title').value = p.title;
            document.getElementById('form-tags').value = p.tags;
            document.getElementById('form-type').value = p.type;
            document.getElementById('form-camera').value = p.camera || '';
            document.getElementById('form-lens').value = p.lens || '';
            document.getElementById('form-software').value = p.software || '';
            document.getElementById('form-media').value = Array.isArray(p.videos) ? p.videos.join(', ') : (p.media || '');
            document.getElementById('form-photos').value = Array.isArray(p.photos) ? p.photos.join(', ') : '';
            updateFormVisibility();
            document.getElementById('form-desc').value = p.description || '';
            document.querySelector('#form-section h2').textContent = 'Upravit projekt';

            if (p.type === 'video' && (p.media || (Array.isArray(p.videos) && p.videos.length))) {
                setVideoStatus(Array.isArray(p.videos) ? p.videos : [p.media]);
            } else {
                clearVideoStatus();
            }
            if (p.type === 'photo' && Array.isArray(p.photos) && p.photos.length) {
                setPhotosStatus(p.photos);
            } else {
                clearPhotosStatus();
            }

            formSection.classList.add('active');
            formSection.scrollIntoView({ behavior: 'smooth' });
        }

        function deleteProject(idx) {
            if (confirm('Opravdu smazat tento projekt?')) {
                projects.splice(idx, 1);
                saveProjects();
                showMessage('Projekt smazán');
            }
        }

        // ==========================================
        //  FILE PICKERS — VIDEO
        // ==========================================
        const videoInput = document.getElementById('video-file-input');
        const videoStatusEl = document.getElementById('video-status');
        const formMedia = document.getElementById('form-media');

        document.getElementById('btn-pick-video').addEventListener('click', () => videoInput.click());

        videoInput.addEventListener('change', () => {
            if (videoInput.files.length > 0) {
                const names = [];
                for (let i = 0; i < videoInput.files.length; i++) {
                    names.push(videoInput.files[i].name);
                }
                appendVideos(names);
                showMessage(`Vybráno ${names.length} video souborů`);
            }
            videoInput.value = '';
        });

        formMedia.addEventListener('input', () => {
            const v = formMedia.value.trim();
            if (v) {
                const arr = v.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
                setVideoStatus(arr);
            } else {
                clearVideoStatus();
            }
        });

        function appendVideos(newNames) {
            const existing = formMedia.value.trim()
                .split(/\r?\n|,/)
                .map(n => n.trim())
                .filter(Boolean);

            newNames.forEach(n => {
                if (!existing.includes(n)) existing.push(n);
            });

            formMedia.value = existing.join(', ');
            setVideoStatus(existing);
        }

        function setVideoStatus(val) {
            const arr = Array.isArray(val) ? val : [val];
            const preview = arr.slice(0, 3).join(', ') + (arr.length > 3 ? ` … (+${arr.length - 3})` : '');
            videoStatusEl.textContent = `✓ ${arr.length} videí: ${preview}`;
            videoStatusEl.classList.add('visible');
        }
        function clearVideoStatus() {
            videoStatusEl.textContent = '';
            videoStatusEl.classList.remove('visible');
        }

        // ==========================================
        //  FILE PICKERS — PHOTOS
        // ==========================================
        const photosInput = document.getElementById('photos-file-input');
        const folderInput = document.getElementById('folder-file-input');
        const photosStatusEl = document.getElementById('photos-status');
        const formPhotos = document.getElementById('form-photos');

        document.getElementById('btn-pick-photos').addEventListener('click', () => photosInput.click());
        document.getElementById('btn-pick-folder').addEventListener('click', () => folderInput.click());
        document.getElementById('btn-clear-photos').addEventListener('click', () => {
            formPhotos.value = '';
            clearPhotosStatus();
            showMessage('Fotky vymazány');
        });

        photosInput.addEventListener('change', () => {
            if (photosInput.files.length > 0) {
                const names = [];
                for (let i = 0; i < photosInput.files.length; i++) {
                    names.push(photosInput.files[i].name);
                }
                appendPhotos(names);
                showMessage(`Vybráno ${names.length} souborů`);
            }
            photosInput.value = '';
        });

        folderInput.addEventListener('change', () => {
            if (folderInput.files.length > 0) {
                const paths = [];
                for (let i = 0; i < folderInput.files.length; i++) {
                    const f = folderInput.files[i];
                    const relPath = f.webkitRelativePath || f.name;
                    paths.push(relPath);
                }
                paths.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
                appendPhotos(paths);
                showMessage(`Vybráno ${paths.length} souborů ze složky`);
            }
            folderInput.value = '';
        });

        function appendPhotos(newNames) {
            const existing = formPhotos.value.trim()
                .split(/\r?\n|,/)
                .map(n => n.trim())
                .filter(Boolean);

            newNames.forEach(n => {
                if (!existing.includes(n)) existing.push(n);
            });

            formPhotos.value = existing.join(', ');
            setPhotosStatus(existing);
        }

        function setPhotosStatus(arr) {
            const preview = arr.slice(0, 5).join(', ') + (arr.length > 5 ? ` … (+${arr.length - 5})` : '');
            photosStatusEl.textContent = `✓ ${arr.length} fotek: ${preview}`;
            photosStatusEl.classList.add('visible');
        }
        function clearPhotosStatus() {
            photosStatusEl.textContent = '';
            photosStatusEl.classList.remove('visible');
        }

        // ==========================================
        //  ADD / SAVE / CANCEL
        // ==========================================
        document.getElementById('btn-add-project').addEventListener('click', () => {
            editingId = null;
            document.getElementById('form-title').value = '';
            document.getElementById('form-tags').value = '';
            document.getElementById('form-type').value = 'video';
            document.getElementById('form-camera').value = '';
            document.getElementById('form-lens').value = '';
            document.getElementById('form-software').value = '';
            document.getElementById('form-media').value = '';
            document.getElementById('form-photos').value = '';
            updateFormVisibility();
            document.getElementById('form-desc').value = '';
            document.querySelector('#form-section h2').textContent = 'Nový projekt';
            clearVideoStatus();
            clearPhotosStatus();
            formSection.classList.add('active');
            formSection.scrollIntoView({ behavior: 'smooth' });
        });

        document.getElementById('btn-cancel').addEventListener('click', () => {
            formSection.classList.remove('active');
        });

        document.getElementById('btn-save-project').addEventListener('click', () => {
            const title = document.getElementById('form-title').value.trim();
            const tags = document.getElementById('form-tags').value.trim();
            const type = document.getElementById('form-type').value;
            const camera = document.getElementById('form-camera').value.trim();
            const lens = document.getElementById('form-lens').value.trim();
            const software = document.getElementById('form-software').value.trim();
            const mediaRaw = document.getElementById('form-media').value.trim();
            const photosRaw = document.getElementById('form-photos').value.trim();
            const desc = document.getElementById('form-desc').value.trim();

            if (!title) { showMessage('Vyplň název projektu', 'error'); return; }

            let photos = photosRaw.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
            if (type === 'photo') {
                if (!photos.length) { showMessage('Přidej alespoň jednu fotku', 'error'); return; }
            }

            let videos = [];
            if (type === 'video') {
                videos = mediaRaw.split(/\r?\n|,/).map(s => s.trim()).filter(Boolean);
                if (!videos.length) { showMessage('Přidej video soubor', 'error'); return; }
            }

            // Fix for Math.max on empty array
            const maxId = projects.length > 0 ? Math.max(...projects.map(p => p.id)) : 0;

            const project = {
                id: editingId !== null ? projects[editingId].id : maxId + 1,
                num: '00',
                title,
                tags,
                type,
                description: desc,
                camera,
                lens,
                software,
                media: type === 'video' ? (videos[0] || '') : (photos[0] || ''),
                videos: type === 'video' ? videos : [],
                photos: photos
            };

            if (editingId !== null) {
                projects[editingId] = project;
                showMessage('Projekt aktualizován');
            } else {
                projects.push(project);
                showMessage('Projekt přidán');
            }

            saveProjects();
            formSection.classList.remove('active');
        });

        // ==========================================
        //  EXPORT / IMPORT
        // ==========================================
        document.getElementById('btn-export-json').addEventListener('click', () => {
            renumber();
            const json = { projects };
            const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `projects_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showMessage('JSON exportován');
        });

        document.getElementById('btn-import-json').addEventListener('click', () => importInput.click());
        document.getElementById('form-type').addEventListener('change', updateFormVisibility);

        importInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (!data.projects || !Array.isArray(data.projects)) throw new Error('Neplatný formát');
                    projects = data.projects;
                    saveProjects();
                    showMessage(`Importováno ${projects.length} projektů`);
                } catch (err) {
                    showMessage(`Chyba: ${err.message}`, 'error');
                }
            };
            reader.readAsText(file);
        });

        // ==========================================
        //  RESET TO DEFAULTS
        // ==========================================
        document.getElementById('btn-reset-defaults').addEventListener('click', () => {
            if (confirm('Opravdu resetovat projekty do výchozího stavu? Tímto se smažou všechny tvé lokální změny!')) {
                localStorage.removeItem('portfolio_projects');
                loadProjects();
                showMessage('Projekty byly resetovány do výchozího stavu', 'success');
            }
        });

        // ==========================================
        //  INIT
        // ==========================================
        loadProjects();
    })();
    </script>
</body>
</html>
