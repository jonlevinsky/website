<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project — Jan Levínský</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0ed;
  --bg2:#e8e5e0;
  --muted:#9a9590;
  --accent:#1a1814;
  --accent2:#5c4f3a;
  --card-radius:16px;
  --gap:14px;
  --ease-out-expo:cubic-bezier(0.16,1,0.3,1);
  --ease-in-out:cubic-bezier(0.4,0,0.2,1);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}

body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--accent);
  padding:24px;
  min-height:100vh;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
  opacity:0.5;
}

.wrap{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:32px;
  max-width:1420px;
  width:100%;
  margin:0 auto;
}

/* ── SIDEBAR ── */
.brand{
  padding:4px 0 0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:24px;
  height:fit-content;
}

.kicker{
  font-size:10px;font-weight:500;color:var(--muted);
  letter-spacing:0.18em;text-transform:uppercase;
  margin-bottom:30px;
  opacity:0;animation:fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;
}

h1{
  margin:0;font-family:'DM Serif Display',Georgia,serif;
  font-weight:400;font-size:60px;line-height:0.9;letter-spacing:-0.015em;
  opacity:0;animation:fadeUp 0.8s 0.15s var(--ease-out-expo) forwards;
}

h1 .last{display:block;font-style:italic;color:var(--accent2);}

.divider{
  width:28px;height:1.5px;background:var(--accent2);margin:26px 0;
  opacity:0;animation:fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}

.back-link{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--accent2);text-decoration:none;
  font-size:12.5px;font-weight:500;letter-spacing:0.03em;
  transition:color 0.25s,gap 0.3s var(--ease-out-expo);
  opacity:0;animation:fadeUp 0.7s 0.3s var(--ease-out-expo) forwards;
  width:fit-content;
}

.back-link .arr{
  display:inline-block;
  transition:transform 0.3s var(--ease-out-expo);
}

.back-link:hover{color:var(--accent);gap:10px;}
.back-link:hover .arr{transform:translateX(-3px);}

/* ── MAIN ── */
main{opacity:0;animation:fadeIn 0.8s 0.25s var(--ease-out-expo) forwards;}

.project-header{margin-bottom:22px;}

.project-title{
  margin:0 0 6px;font-family:'DM Serif Display',Georgia,serif;
  font-weight:400;font-size:38px;line-height:1.08;letter-spacing:-0.015em;
}

.project-meta{
  display:inline-flex;align-items:center;gap:7px;
  color:var(--muted);font-size:11px;font-weight:500;
  letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;
}

.dot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:0.5;}

.project-bio{
  font-size:13.5px;line-height:1.8;color:#4a4540;
  font-weight:300;max-width:680px;margin:0 0 26px;
}

/* ── GALLERY ── */
.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:var(--gap);
  width:100%;
}

.tile{
  position:relative;border-radius:var(--card-radius);overflow:hidden;
  background:var(--bg2);aspect-ratio:3/2;cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.07),0 0 0 1px rgba(0,0,0,0.04);
  transition:box-shadow 0.35s ease,transform 0.35s var(--ease-out-expo);
}

.tile img,.tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.6s var(--ease-out-expo);
  pointer-events:none;
}

.tile:hover{
  box-shadow:0 10px 40px rgba(0,0,0,0.18),0 2px 8px rgba(0,0,0,0.08),0 0 0 1px rgba(0,0,0,0.06);
  z-index:2;
}

.tile:hover img,.tile:hover video{transform:scale(1.07);}

.tile::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(12,9,6,0.78) 0%,rgba(12,9,6,0.22) 38%,transparent 62%);
  opacity:0;transition:opacity 0.4s var(--ease-in-out);pointer-events:none;
}

.tile:hover::after{opacity:1;}

.flyout{
  position:absolute;z-index:3;bottom:13px;left:14px;right:14px;
  color:#fff;font-size:12.5px;font-weight:400;
  opacity:0;transform:translateY(6px);
  transition:opacity 0.35s var(--ease-in-out),transform 0.4s var(--ease-out-expo);
  pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.tile:hover .flyout{opacity:1;transform:translateY(0);}

/* Video play icon */
.tile-video-icon{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:46px;height:46px;border-radius:50%;
  background:rgba(255,255,255,0.16);
  backdrop-filter:blur(10px) saturate(160%);
  -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:1px solid rgba(255,255,255,0.32);
  display:flex;align-items:center;justify-content:center;
  color:white;font-size:14px;pointer-events:none;
  transition:transform 0.4s var(--ease-out-expo),opacity 0.35s ease;z-index:3;
}

.tile:hover .tile-video-icon{transform:translate(-50%,-50%) scale(1.12);opacity:0.85;}

/* Loading */
.loading-state{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:8px 0;}
.loading-ring{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--bg2);border-top-color:var(--accent2);
  animation:spin 0.85s linear infinite;
}
.loading-label{color:var(--muted);font-size:11.5px;letter-spacing:0.06em;}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
.modal{
  position:fixed;z-index:1000;inset:0;
  background:rgba(8,6,4,0);
  display:flex;align-items:center;justify-content:center;
  padding:0;
  visibility:hidden;
  transition:background 0.4s var(--ease-in-out),visibility 0s 0.4s;
}

.modal.open{
  background:rgba(8,6,4,0.97);
  visibility:visible;
  transition:background 0.4s var(--ease-in-out),visibility 0s 0s;
}

.modal-inner{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:72px 80px 48px;
}

/* Content area */
.modal-content{
  position:relative;
  max-width:100%;
  max-height:calc(100vh - 160px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transform:scale(0.95) translateY(10px);
  transition:opacity 0.45s var(--ease-out-expo),transform 0.45s var(--ease-out-expo);
}

.modal.open .modal-content{
  opacity:1;
  transform:scale(1) translateY(0);
}

.modal-content img{
  max-width:100%;
  max-height:calc(100vh - 170px);
  border-radius:14px;
  display:block;
  height:auto;
  box-shadow:0 40px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.05);
}

/* Caption */
.modal-caption{
  color:rgba(255,255,255,0.55);
  font-size:12.5px;
  font-weight:300;
  margin-top:16px;
  text-align:center;
  letter-spacing:0.04em;
  height:18px;
  transition:opacity 0.3s ease;
  opacity:0;
  transform:translateY(4px);
  transition:opacity 0.4s 0.15s var(--ease-out-expo),transform 0.4s 0.15s var(--ease-out-expo);
}

.modal.open .modal-caption{
  opacity:1;
  transform:translateY(0);
}

/* Top bar: close + counter + shortcuts */
.modal-topbar{
  position:absolute;
  top:0;left:0;right:0;
  height:64px;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:10px;
}

.modal-counter{
  color:rgba(255,255,255,0.35);
  font-size:11.5px;
  font-weight:500;
  letter-spacing:0.1em;
  margin-left:auto;
  margin-right:auto;
  transition:opacity 0.25s;
}

.modal-close,.modal-shortcuts-btn{
  width:40px;height:40px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.6);
  cursor:pointer;
  transition:background 0.25s,color 0.25s,transform 0.25s var(--ease-out-expo),border-color 0.25s;
  flex-shrink:0;
}

.modal-close:hover,.modal-shortcuts-btn:hover{
  background:rgba(255,255,255,0.14);
  color:#fff;
  border-color:rgba(255,255,255,0.22);
}

.modal-close svg,.modal-shortcuts-btn svg{
  width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.modal-close:active,.modal-shortcuts-btn:active{transform:scale(0.9);}

/* Nav arrows */
.modal-nav{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:50px;height:50px;
  border-radius:50%;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.65);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:background 0.25s,color 0.25s,transform 0.3s var(--ease-out-expo),border-color 0.25s,opacity 0.25s;
  z-index:5;
  user-select:none;
}

.modal-nav svg{
  width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
}

.modal-nav:hover{
  background:rgba(255,255,255,0.14);
  color:#fff;
  border-color:rgba(255,255,255,0.22);
}

.modal-prev{left:16px;}
.modal-prev:hover{transform:translateY(-50%) translateX(-2px);}
.modal-next{right:16px;}
.modal-next:hover{transform:translateY(-50%) translateX(2px);}
.modal-nav.disabled{opacity:0.2;pointer-events:none;}

/* Shortcuts panel */
.shortcuts-panel{
  position:absolute;
  top:72px;
  right:20px;
  background:rgba(12,9,6,0.9);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:14px;
  padding:18px 22px;
  color:rgba(255,255,255,0.7);
  font-size:12px;
  z-index:20;
  min-width:230px;
  opacity:0;
  transform:translateY(-8px) scale(0.97);
  pointer-events:none;
  transition:opacity 0.3s var(--ease-out-expo),transform 0.3s var(--ease-out-expo);
}

.shortcuts-panel.show{
  opacity:1;transform:translateY(0) scale(1);pointer-events:auto;
}

.shortcuts-panel h3{
  margin:0 0 14px;font-size:10px;font-weight:600;
  color:rgba(255,255,255,0.3);letter-spacing:0.14em;text-transform:uppercase;
}

.sc-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:9px;gap:24px;
}
.sc-row:last-child{margin-bottom:0;}

.sc-label{color:rgba(255,255,255,0.65);}

.sc-keys{display:flex;gap:4px;}

.key{
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:5px;
  padding:2px 7px;
  font-family:monospace;font-size:10.5px;
  color:rgba(255,255,255,0.5);
  white-space:nowrap;
}

/* ══════════════════════════════════════
   VIDEO PLAYER — YouTube classic style
══════════════════════════════════════ */
.player{
  position:relative;
  border-radius:12px;
  overflow:hidden;
  background:#000;
  max-width:min(92vw, calc((100vh - 160px) * 16/9));
  width:100%;
  box-shadow:0 40px 80px rgba(0,0,0,0.7);
  cursor:pointer;
  /* Hide native controls */
  -webkit-user-select:none;user-select:none;
}

.player video{
  width:100%;
  height:auto;
  max-height:calc(100vh - 160px);
  display:block;
}

/* YT-style big play button on pause (center) */
.yt-big-play{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:68px;height:68px;
  border-radius:50%;
  background:rgba(0,0,0,0.72);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  z-index:4;
  opacity:0;
  transition:opacity 0.15s ease, transform 0.15s ease;
}

.yt-big-play svg{width:28px;height:28px;fill:#fff;margin-left:3px;}
.player.paused .yt-big-play{opacity:1;}
.player:hover.paused .yt-big-play{transform:translate(-50%,-50%) scale(1.08);}

/* Flash animation on click */
.play-flash{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:68px;height:68px;
  border-radius:50%;
  background:rgba(0,0,0,0.65);
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  z-index:5;
  opacity:0;
}
.play-flash svg{width:28px;height:28px;fill:#fff;margin-left:3px;}
.play-flash.pause-icon svg{margin-left:0;}
.play-flash.show{animation:ytFlash 0.4s ease forwards;}

@keyframes ytFlash{
  0%  {opacity:0.9;transform:translate(-50%,-50%) scale(0.85);}
  60% {opacity:0.6;transform:translate(-50%,-50%) scale(1.05);}
  100%{opacity:0;  transform:translate(-50%,-50%) scale(1.15);}
}

/* Bottom gradient + controls */
.controls{
  position:absolute;
  bottom:0;left:0;right:0;
  padding:48px 12px 8px;
  background:linear-gradient(to top,rgba(0,0,0,0.9) 0%,rgba(0,0,0,0.55) 40%,transparent 100%);
  display:flex;
  flex-direction:column;
  gap:4px;
  opacity:1;
  transition:opacity 0.25s ease;
  z-index:5;
}
.controls.hidden{opacity:0;pointer-events:none;}

/* ── PROGRESS ── */
.yt-progress{
  width:100%;
  height:16px; /* hit area */
  display:flex;
  align-items:center;
  cursor:pointer;
  position:relative;
  margin-bottom:2px;
}

.yt-track{
  position:absolute;
  left:0;right:0;
  height:3px;
  background:rgba(255,255,255,0.3);
  border-radius:2px;
  transition:height 0.15s ease;
  overflow:hidden;
}

.yt-progress:hover .yt-track{height:5px;}

.yt-buf{
  position:absolute;top:0;left:0;bottom:0;
  background:rgba(255,255,255,0.4);
  border-radius:2px;
  width:0%;pointer-events:none;
}

.yt-fill{
  position:absolute;top:0;left:0;bottom:0;
  background:#ff0000;
  border-radius:2px;
  width:0%;pointer-events:none;
}

/* Red circle thumb */
.yt-thumb{
  position:absolute;top:50%;
  width:13px;height:13px;
  background:#ff0000;
  border-radius:50%;
  transform:translate(-50%,-50%) scale(0);
  pointer-events:none;
  transition:transform 0.12s ease;
  z-index:2;
  box-shadow:0 0 3px rgba(0,0,0,0.5);
}
.yt-progress:hover .yt-thumb{transform:translate(-50%,-50%) scale(1);}

.yt-input{
  position:absolute;inset:0;
  width:100%;height:100%;
  opacity:0;cursor:pointer;
  margin:0;
}

/* ── CONTROLS ROW ── */
.controls-row{
  display:flex;align-items:center;gap:2px;
}

/* YT-style icon buttons */
.ctrl-btn{
  width:40px;height:40px;
  border:none;border-radius:4px;
  background:transparent;
  cursor:pointer;
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  transition:opacity 0.15s;
  padding:0;
  opacity:0.9;
}
.ctrl-btn svg{display:block;}
.ctrl-btn:hover{opacity:1;}
.ctrl-btn:active{opacity:0.7;}

/* Time display */
.time-wrap{
  display:flex;align-items:center;gap:0;
  font-size:13px;font-weight:400;color:#fff;
  font-variant-numeric:tabular-nums;
  letter-spacing:0.01em;
  flex-shrink:0;user-select:none;
  margin-left:2px;
  white-space:nowrap;
}
.time-cur{color:#fff;}
.time-sep{color:rgba(255,255,255,0.6);margin:0 3px;}
.time-dur{color:rgba(255,255,255,0.6);}

/* Volume section */
.vol-wrap{
  display:flex;align-items:center;gap:0;
}

/* YT volume slider — horizontal, appears on hover */
.vol-slider-wrap{
  width:0;
  overflow:hidden;
  transition:width 0.2s ease;
  display:flex;align-items:center;
}
.vol-wrap:hover .vol-slider-wrap,
.vol-wrap:focus-within .vol-slider-wrap{
  width:72px;
}

.vol-slider{
  -webkit-appearance:none;appearance:none;
  width:52px;height:3px;border-radius:4px;
  background:rgba(255,255,255,0.3);
  cursor:pointer;outline:none;
  margin:0 10px;
  flex-shrink:0;
}
.vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer;
}
.vol-slider::-moz-range-thumb{
  width:12px;height:12px;border:none;border-radius:50%;background:#fff;cursor:pointer;
}

/* Right side spacer */
.controls-right{margin-left:auto;display:flex;align-items:center;gap:2px;}

/* Fullscreen */
.player.is-fs{
  position:fixed;inset:0;
  width:100vw;height:100vh;
  max-width:none;max-height:none;
  border-radius:0;z-index:2000;
}
.player.is-fs video{max-height:100vh;height:100%;object-fit:contain;}

/* Seek tooltip */
.seek-tooltip{
  position:absolute;
  bottom:calc(100% + 8px);
  transform:translateX(-50%);
  background:rgba(0,0,0,0.9);
  color:#fff;
  font-size:12px;
  font-weight:500;
  padding:3px 8px;
  border-radius:3px;
  pointer-events:none;
  white-space:nowrap;
  opacity:0;
  transition:opacity 0.1s;
}
.yt-progress:hover .seek-tooltip{opacity:1;}

/* ── KEYFRAMES ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .wrap{grid-template-columns:210px 1fr;}
  h1{font-size:50px;}
}

@media(max-width:880px){
  body{padding:16px;}
  .wrap{grid-template-columns:1fr;gap:24px;}
  .brand{position:static;}
  h1{font-size:44px;}
  .gallery{grid-template-columns:repeat(2,1fr);}
}

@media(max-width:640px){
  body{padding:12px;}
  h1{font-size:36px;}
  .project-title{font-size:26px;}
  .gallery{grid-template-columns:repeat(2,1fr);gap:8px;}
  .project-bio{font-size:13px;}
}

@media(max-width:480px){
  .gallery{grid-template-columns:1fr;}
}

/* ══════════════════════════════════════
   MOBILE VIDEO — plays inside tile thumb
══════════════════════════════════════ */

.tile-inline-player{ display:none; } /* never used */
.tile-caption{ display:none; }
.mob-play-hint{ display:none; }

@media(max-width:640px){
  .gallery{ grid-template-columns:1fr; gap:10px; }

  .flyout{ display:none; }
  .tile-video-icon{ display:none; }
  .modal{ display:none !important; }

  /* Photo tiles — normal 3:2 card */
  .tile:not(.video-tile){ aspect-ratio:3/2; cursor:pointer; }

  /* Video tile — 16:9 thumb, static size always */
  .tile.video-tile{
    aspect-ratio:unset;
    height:auto;
    cursor:pointer;
    overflow:visible; /* let caption sit outside */
    background:transparent;
    box-shadow:none;
  }

  .tile.video-tile .tile-thumb{
    position:relative;
    aspect-ratio:16/9;
    overflow:hidden;
    border-radius:var(--card-radius);
    background:#111;
    box-shadow:0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
  }

  /* Thumbnail image if present */
  .tile.video-tile .tile-thumb img{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    border-radius:0;
    transform:none !important;
    transition:none;
  }

  /* The actual video — fills thumb, hidden until playing */
  .tile.video-tile .tile-thumb video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    border-radius:0;
    transform:none !important;
    transition:none;
    display:block;
    background:#000;
  }

  /* Player injected into thumb — must fill it exactly */
  .tile.video-tile .tile-thumb .player{
    position:absolute;
    inset:0;
    width:100% !important;
    max-width:100% !important;
    height:100% !important;
    border-radius:var(--card-radius) !important;
    box-shadow:none !important;
  }

  .tile.video-tile .tile-thumb .player video{
    position:absolute;
    inset:0;
    width:100% !important;
    height:100% !important;
    max-height:none !important;
    object-fit:cover;
    aspect-ratio:unset;
  }

  /* Play hint overlay — shown before playing */
  .mob-play-hint{
    display:flex;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:3;
    transition:opacity 0.2s;
  }

  .mob-play-hint .play-circle{
    width:52px;height:52px;
    border-radius:50%;
    background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
  }

  .mob-play-hint svg{ width:22px;height:22px;fill:#fff;margin-left:3px; }

  .tile.video-tile.playing .mob-play-hint{ opacity:0; }

  /* Gradient on thumb before playing */
  .tile.video-tile .tile-thumb::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(to top,rgba(0,0,0,0.45) 0%,transparent 50%);
    pointer-events:none;
    z-index:2;
  }

  .tile.video-tile.playing .tile-thumb::after{ display:none; }

  /* Caption below thumb — always visible */
  .tile-caption{
    display:block;
    padding:8px 2px 0;
    font-size:12px;
    color:var(--muted);
    font-weight:400;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Controls inside thumb — bigger touch targets */
  .tile.video-tile .yt-progress{ height:22px; }
  .tile.video-tile .yt-thumb{
    width:14px;height:14px;
    transform:translate(-50%,-50%) scale(1) !important;
  }
  .tile.video-tile .ctrl-btn{ width:44px;height:44px; }
  .tile.video-tile .vol-wrap{ display:none; }
  .tile.video-tile .time-wrap{ font-size:12px; }
}

</style>

<body>
<div class="wrap">
  <aside class="brand">
    <div class="kicker">Portfolio // 2025</div>
    <h1>Jan<br/><span class="last">Levínský</span></h1>
    <div class="divider"></div>
    <a href="index.html" class="back-link"><span class="arr">←</span> Back to portfolio</a>
  </aside>
  <main id="project-container">
    <div class="loading-state">
      <div class="loading-ring"></div>
      <div class="loading-label">Loading project…</div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="modal-inner">
    <!-- Top bar -->
    <div class="modal-topbar">
      <div class="modal-close" id="modal-close" title="Close (Esc)" role="button" tabindex="0" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </div>
      <div class="modal-counter" id="modal-counter"></div>
      <div class="modal-shortcuts-btn" id="shortcuts-btn" title="Keyboard shortcuts (?)" role="button" tabindex="0" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
      </div>
    </div>

    <!-- Shortcuts panel -->
    <div class="shortcuts-panel" id="shortcuts-panel" role="tooltip">
      <h3>Keyboard shortcuts</h3>
      <div class="sc-row"><span class="sc-label">Play / Pause</span><div class="sc-keys"><span class="key">Space</span><span class="key">K</span></div></div>
      <div class="sc-row"><span class="sc-label">Seek ±5s</span><div class="sc-keys"><span class="key">←</span><span class="key">→</span></div></div>
      <div class="sc-row"><span class="sc-label">Seek ±10s</span><div class="sc-keys"><span class="key">J</span><span class="key">L</span></div></div>
      <div class="sc-row"><span class="sc-label">Volume</span><div class="sc-keys"><span class="key">↑</span><span class="key">↓</span></div></div>
      <div class="sc-row"><span class="sc-label">Mute</span><div class="sc-keys"><span class="key">M</span></div></div>
      <div class="sc-row"><span class="sc-label">Fullscreen</span><div class="sc-keys"><span class="key">F</span></div></div>
      <div class="sc-row"><span class="sc-label">Prev / Next</span><div class="sc-keys"><span class="key">Shift ←</span><span class="key">Shift →</span></div></div>
      <div class="sc-row"><span class="sc-label">Close</span><div class="sc-keys"><span class="key">Esc</span></div></div>
    </div>

    <!-- Media content -->
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-caption" id="modal-caption"></div>
  </div>

  <!-- Nav arrows -->
  <div class="modal-nav modal-prev" id="modal-prev" role="button" tabindex="0" aria-label="Previous">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </div>
  <div class="modal-nav modal-next" id="modal-next" role="button" tabindex="0" aria-label="Next">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </div>
</div>

<script>
// ── PROJECT LOADER ──────────────────────────────────────
function getProjectId() {
  return parseInt(new URLSearchParams(window.location.search).get('id'));
}

async function loadProject() {
  const id = getProjectId();
  const container = document.getElementById('project-container');
  if (!id) { container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Missing project ID.</p>'; return; }

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('network');
    const projects = await res.json();
    const project = projects.find(p => p.id === id);
    if (!project) { container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Project not found.</p>'; return; }
    displayProject(project);
    document.title = `${project.title} — Jan Levínský`;
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Failed to load project.</p>';
  }
}

function isMobile(){ return window.innerWidth <= 640; }

function displayProject(project) {
  const container = document.getElementById('project-container');
  const typeLabel = project.type === 'video' ? 'Video' : 'Photography';
  const year = project.year || '2025';

  let gallery = '';
  project.media.forEach((m, i) => {
    const cap = [m.title, m.caption].filter(Boolean).join(' — ');
    const flyout = cap ? `<div class="flyout">${cap}</div>` : '';

    if (m.type === 'photo') {
      gallery += `
        <div class="tile" data-index="${i}" data-type="photo">
          <img src="${m.src}" alt="${m.title||''}" loading="lazy">
          ${flyout}
        </div>`;
    } else {
      const thumbSrc = m.thumbnail || m.poster || '';
      const thumbImg = thumbSrc ? `<img src="${thumbSrc}" alt="${m.title||''}" loading="lazy">` : '';
      gallery += `
        <div class="tile video-tile" data-index="${i}" data-type="video" data-src="${m.src}">
          <div class="tile-thumb" id="thumb-${i}">
            ${thumbImg}
            <video src="${m.src}" muted playsinline preload="none"></video>
            <div class="mob-play-hint">
              <div class="play-circle"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div>
            </div>
          </div>
          <div class="tile-caption">${cap}</div>
        </div>`;
    }
  });

  container.innerHTML = `
    <div class="project-header">
      <div class="project-meta">
        <span>${typeLabel}</span><span class="dot"></span><span>${year}</span>
      </div>
      <h2 class="project-title">${project.title}</h2>
      ${project.bio ? `<p class="project-bio">${project.bio}</p>` : ''}
    </div>
    <div class="gallery">${gallery}</div>
  `;

  document.querySelectorAll('.tile').forEach(tile => {
    tile.addEventListener('click', e => {
      const i = parseInt(tile.dataset.index);
      const type = tile.dataset.type;

      if (isMobile() && type === 'video') {
        e.preventDefault();
        e.stopPropagation();

        // Stop any other playing tile
        document.querySelectorAll('.tile.video-tile.playing').forEach(t => {
          if (t !== tile) {
            const v = t.querySelector('video#vid');
            if (v) v.pause();
            t.classList.remove('playing');
            // Restore thumb to original state
            const th = t.querySelector('.tile-thumb');
            const origThumb = t.dataset.origThumb;
            if (th && origThumb) th.innerHTML = origThumb;
          }
        });

        const thumb = tile.querySelector('.tile-thumb');
        if (!thumb) return;

        if (tile.classList.contains('playing')) {
          // Tap again = pause/resume via player
          const vid = thumb.querySelector('video#vid');
          if (vid) vid.paused ? vid.play() : vid.pause();
          return;
        }

        // Save original thumb HTML so we can restore it later
        tile.dataset.origThumb = thumb.innerHTML;

        // Replace thumb contents with full player
        thumb.innerHTML = buildPlayer(project.media[i].src);
        tile.classList.add('playing');

        setTimeout(() => {
          const vp2 = initPlayerIn(thumb);
          tile._vp = vp2;
          const vid = thumb.querySelector('#vid');
          if (vid) vid.play().catch(()=>{});
        }, 40);

        return;
      }
        // ── MOBILE: fullscreen the image ──
        e.preventDefault();
        const img = tile.querySelector('img');
        if (!img) return;
        // Create a fullscreen overlay with the image
        const fs = document.createElement('div');
        fs.style.cssText = 'position:fixed;inset:0;z-index:9000;background:#000;display:flex;align-items:center;justify-content:center;';
        const fsImg = document.createElement('img');
        fsImg.src = img.src;
        fsImg.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;display:block;';
        // Close button
        const closeBtn = document.createElement('div');
        closeBtn.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        closeBtn.style.cssText = 'position:absolute;top:16px;right:16px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.12);border-radius:50%;cursor:pointer;z-index:1;';
        fs.appendChild(fsImg);
        fs.appendChild(closeBtn);
        document.body.appendChild(fs);
        document.body.style.overflow = 'hidden';

        // Try native fullscreen
        fs.requestFullscreen?.().catch(()=>{});

        function closeFsPhoto() {
          if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
          fs.remove();
          document.body.style.overflow = '';
          document.removeEventListener('fullscreenchange', onFsChange);
        }
        function onFsChange() { if (!document.fullscreenElement) { fs.remove(); document.body.style.overflow=''; } }
        closeBtn.addEventListener('click', closeFsPhoto);
        fs.addEventListener('click', e => { if (e.target === fs) closeFsPhoto(); });
        document.addEventListener('fullscreenchange', onFsChange);
        return
        
      // ── DESKTOP: open modal ──
      openModal(i, project.media);
    });
  });
}

// ── MODAL ─────────────────────────────────────────────
let idx = 0, media = [], vp = null;

const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
const modalCaption = document.getElementById('modal-caption');
const modalCounter = document.getElementById('modal-counter');

function openModal(i, arr) {
  idx = i; media = arr;
  renderMedia();
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  document.removeEventListener('keydown', onKey);
  const v = modalContent.querySelector('video');
  if (v) v.pause();
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  vp = null;
}

function renderMedia() {
  const m = media[idx];
  if (!m) return;

  modalCounter.textContent = `${idx + 1} / ${media.length}`;
  document.getElementById('modal-prev').classList.toggle('disabled', media.length <= 1);
  document.getElementById('modal-next').classList.toggle('disabled', media.length <= 1);

  const cap = [m.title, m.caption].filter(Boolean).join(' — ');

  const prevVideo = modalContent.querySelector('video');
  if (prevVideo) prevVideo.pause();
  vp = null;

  modalContent.style.opacity = '0';
  modalContent.style.transform = 'scale(0.97) translateY(6px)';

  setTimeout(() => {
    if (m.type === 'photo') {
      modalContent.innerHTML = `<img src="${m.src}" alt="${m.title||''}">`;
      vp = null;
    } else {
      modalContent.innerHTML = buildPlayer(m.src);
      setTimeout(() => { vp = initPlayer(); }, 60);
    }
    modalCaption.textContent = cap;

    requestAnimationFrame(() => {
      modalContent.style.transition = 'opacity 0.4s var(--ease-out-expo), transform 0.4s var(--ease-out-expo)';
      modalContent.style.opacity = '1';
      modalContent.style.transform = 'scale(1) translateY(0)';
    });
  }, 150);
}

function prev() { idx = (idx - 1 + media.length) % media.length; renderMedia(); }
function next() { idx = (idx + 1) % media.length; renderMedia(); }

// ── VIDEO PLAYER ───────────────────────────────────────
function buildPlayer(src) {
  return `
  <div class="player paused" id="player">
    <video id="vid" src="${src}" playsinline controls preload="metadata"></video>

    <!-- Big centre play icon when paused -->
    <div class="yt-big-play" style="display:none;">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </div>

    <!-- Click flash -->
    <div class="play-flash" id="play-flash" style="display:none;">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </div>

    <div class="controls" id="controls" style="display:none;">
      <!-- Progress bar -->
      <div class="yt-progress" id="yt-progress">
        <div class="yt-track">
          <div class="yt-buf"  id="yt-buf"></div>
          <div class="yt-fill" id="yt-fill"></div>
        </div>
        <div class="yt-thumb" id="yt-thumb"></div>
        <input type="range" class="yt-input" id="yt-input" min="0" max="1000" value="0" step="1">
        <div class="seek-tooltip" id="seek-tt">0:00</div>
      </div>

      <!-- Bottom row -->
      <div class="controls-row">
        <!-- Play/Pause -->
        <button class="ctrl-btn" id="play-btn" title="Play/Pause (Space)">
          <svg id="play-icon" viewBox="0 0 24 24" width="24" height="24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
        </button>

        <!-- Volume -->
        <div class="vol-wrap">
          <button class="ctrl-btn" id="mute-btn" title="Mute (M)">
            <svg id="vol-icon" viewBox="0 0 24 24" width="24" height="24"></svg>
          </button>
          <div class="vol-slider-wrap">
            <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.02" value="1">
          </div>
        </div>

        <!-- Time -->
        <div class="time-wrap">
          <span class="time-cur" id="cur-time">0:00</span>
          <span class="time-sep">/</span>
          <span class="time-dur" id="dur-time">0:00</span>
        </div>

        <!-- Right side -->
        <div class="controls-right">
          <button class="ctrl-btn" id="fs-btn" title="Fullscreen (F)">
            <svg id="fs-icon" viewBox="0 0 24 24" width="24" height="24" fill="white"></svg>
          </button>
        </div>
      </div>
    </div>
  </div>`;
}

// ── initPlayer: used by modal (global IDs) ─────────────
function initPlayer() { return initPlayerIn(document); }

// ── initPlayerIn: scoped to a container ────────────────
function initPlayerIn(root) {
  const $ = id => root.getElementById ? root.getElementById(id) : root.querySelector('#'+id);
  const player   = $('player');
  const vid      = $('vid');
  const controls = $('controls');
  const playBtn  = $('play-btn');
  const playIcon = $('play-icon');
  const muteBtn  = $('mute-btn');
  const volIcon  = $('vol-icon');
  const fsBtn    = $('fs-btn');
  const fsIcon   = $('fs-icon');
  const ytInput  = $('yt-input');
  const ytFill   = $('yt-fill');
  const ytBuf    = $('yt-buf');
  const ytThumb  = $('yt-thumb');
  const curTime  = $('cur-time');
  const durTime  = $('dur-time');
  const volSlider= $('vol-slider');
  const flash    = $('play-flash');
  const seekTT   = $('seek-tt');
  const ytProg   = $('yt-progress');
  if (!vid) return null;

  let hideTimer, isFs = false;

  const IC_PLAY  = `<polygon points="5,3 19,12 5,21" fill="white"/>`;
  const IC_PAUSE = `<rect x="6" y="4" width="4" height="16" fill="white"/><rect x="14" y="4" width="4" height="16" fill="white"/>`;
  const IC_VOL2  = `<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="white"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  const IC_VOL1  = `<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="white"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>`;
  const IC_MUTE  = `<polygon points="11,5 6,9 2,9 2,15 6,15 11,19" fill="white"/><line x1="23" y1="9" x2="17" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>`;
  const IC_FS_IN = `<polyline points="15,3 21,3 21,9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="9,21 3,21 3,15" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="21" y1="3" x2="14" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="3" y1="21" x2="10" y2="14" stroke="white" stroke-width="2" stroke-linecap="round"/>`;
  const IC_FS_OUT= `<polyline points="4,14 10,14 10,20" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><polyline points="20,10 14,10 14,4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><line x1="10" y1="14" x2="3" y2="21" stroke="white" stroke-width="2" stroke-linecap="round"/><line x1="21" y1="3" x2="14" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>`;

  function fmt(s){ return isNaN(s)||!isFinite(s)?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`; }

  function updateVolIcon() {
    if (!volIcon) return;
    const v = vid.volume, m = vid.muted;
    volIcon.innerHTML = m||v===0 ? IC_MUTE : v<0.5 ? IC_VOL1 : IC_VOL2;
    if (volSlider) volSlider.value = m ? 0 : v;
  }

  function updatePlayIcon() {
    if (playIcon) playIcon.innerHTML = vid.paused ? IC_PLAY : IC_PAUSE;
    if (player)   player.classList.toggle('paused', vid.paused);
  }

  function updateFsIcon() {
    if (fsIcon) fsIcon.innerHTML = isFs ? IC_FS_OUT : IC_FS_IN;
  }

  function showControls() {
    if (!controls) return;
    controls.classList.remove('hidden');
    clearTimeout(hideTimer);
    if (!vid.paused) hideTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
  }

  function flashIcon(paused) {
    if (!flash) return;
    flash.querySelector('svg').innerHTML = paused ? IC_PAUSE : IC_PLAY;
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 450);
  }

  function togglePlay() {
    if (vid.paused) { vid.play().catch(()=>{}); flashIcon(false); }
    else            { vid.pause(); flashIcon(true); }
    showControls();
  }

  function toggleMute() { vid.muted = !vid.muted; updateVolIcon(); }

  function setVolume(delta) {
    vid.volume = Math.max(0, Math.min(1, vid.volume + delta));
    vid.muted = vid.volume === 0;
    updateVolIcon(); showControls();
  }

  function seekBy(s) {
    vid.currentTime = Math.max(0, Math.min(vid.duration||0, vid.currentTime + s));
    showControls();
  }

  function toggleFs() {
    if (!isFs) player?.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.().catch(()=>{});
  }

  if (playBtn)  playBtn.addEventListener('click',  e => { e.stopPropagation(); togglePlay(); });
  if (muteBtn)  muteBtn.addEventListener('click',  e => { e.stopPropagation(); toggleMute(); });
  if (fsBtn)    fsBtn.addEventListener('click',    e => { e.stopPropagation(); toggleFs(); });
  if (player) {
    vid.addEventListener('click', togglePlay);
    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseleave', () => { if (!vid.paused) controls?.classList.add('hidden'); });
  }

  vid.addEventListener('play',  () => { updatePlayIcon(); showControls(); });
  vid.addEventListener('pause', () => { updatePlayIcon(); controls?.classList.remove('hidden'); clearTimeout(hideTimer); });
  vid.addEventListener('ended', () => { updatePlayIcon(); controls?.classList.remove('hidden'); });

  vid.addEventListener('timeupdate', () => {
    const pct = vid.duration ? vid.currentTime / vid.duration : 0;
    if (ytInput) ytInput.value = pct * 1000;
    if (ytFill)  ytFill.style.width  = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left  = (pct * 100) + '%';
    if (curTime) curTime.textContent = fmt(vid.currentTime);
    if (durTime) durTime.textContent = fmt(vid.duration);
  });

  vid.addEventListener('progress', () => {
    if (ytBuf && vid.buffered.length && vid.duration)
      ytBuf.style.width = (vid.buffered.end(vid.buffered.length-1) / vid.duration * 100) + '%';
  });

  if (ytInput) ytInput.addEventListener('input', () => {
    const pct = ytInput.value / 1000;
    vid.currentTime = pct * vid.duration;
    if (ytFill)  ytFill.style.width = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left = (pct * 100) + '%';
  });

  if (ytProg) ytProg.addEventListener('mousemove', e => {
    const rect = ytProg.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    if (seekTT) { seekTT.textContent = fmt(pct * (vid.duration||0)); seekTT.style.left = (pct*100)+'%'; }
  });

  if (volSlider) volSlider.addEventListener('input', e => {
    e.stopPropagation();
    vid.volume = parseFloat(volSlider.value);
    vid.muted = vid.volume === 0;
    updateVolIcon();
  });

  document.addEventListener('fullscreenchange', () => {
    isFs = !!document.fullscreenElement;
    player?.classList.toggle('is-fs', isFs);
    updateFsIcon();
    if (!isFs) controls?.classList.remove('hidden');
  });

  updatePlayIcon(); updateVolIcon(); updateFsIcon(); showControls();
  return { togglePlay, toggleMute, toggleFs, seekBy, setVolume };
}

// ── KEYBOARD ──────────────────────────────────────────
function onKey(e) {
  if (!modal.classList.contains('open')) return;

  const hasVideo = !!vp;
  const videoKeys = [' ','k','K','j','J','l','L','m','M','f','F','ArrowUp','ArrowDown'];
  if (hasVideo && videoKeys.includes(e.key) && !e.shiftKey) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();

  switch (e.key) {
    case ' ':
    case 'k': case 'K':
      if (hasVideo) vp.togglePlay();
      break;
    case 'ArrowLeft':
      e.shiftKey ? prev() : (hasVideo && vp.seekBy(-5));
      break;
    case 'ArrowRight':
      e.shiftKey ? next() : (hasVideo && vp.seekBy(5));
      break;
    case 'j': case 'J': if (hasVideo) vp.seekBy(-10); break;
    case 'l': case 'L': if (hasVideo) vp.seekBy(10); break;
    case 'ArrowUp':   if (hasVideo) vp.setVolume(0.1); break;
    case 'ArrowDown': if (hasVideo) vp.setVolume(-0.1); break;
    case 'm': case 'M': if (hasVideo) vp.toggleMute(); break;
    case 'f': case 'F': if (hasVideo) vp.toggleFs(); break;
    case '?':
      document.getElementById('shortcuts-panel').classList.toggle('show');
      break;
    case 'Escape':
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.getElementById('shortcuts-panel').classList.contains('show'))
        document.getElementById('shortcuts-panel').classList.remove('show');
      else closeModal();
      break;
  }
}

// ── BIND UI ────────────────────────────────────────────
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-prev').addEventListener('click', prev);
document.getElementById('modal-next').addEventListener('click', next);

document.getElementById('shortcuts-btn').addEventListener('click', () => {
  document.getElementById('shortcuts-panel').classList.toggle('show');
});

// Close on backdrop click
modal.addEventListener('click', e => {
  if (e.target === modal || e.target.classList.contains('modal-inner')) closeModal();
});

// Desktop swipe support in modal
let touchStartX = 0;
modal.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
modal.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, { passive: true });

loadProject();
</script>
