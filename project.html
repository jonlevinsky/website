<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Project</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
/* Všechny existující styly zůstávají stejné */
:root{
  --bg:#f6f4f5;
  --muted:#9aa0a6;
  --accent:#111;
  --card-radius:16px;
  --gap:16px;
  --transition:0.3s ease-in-out;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0; padding:0; font-family:Inter,sans-serif; background:var(--bg); color:#0b0b0b;}
.wrap{
  display:grid; 
  grid-template-columns:1fr 3fr; 
  gap:var(--gap); 
  max-width:1400px; 
  width:100%; 
  padding:16px;
  margin: 0 auto;
}

.brand{padding-left:12px;}
.kicker{font-size:13px; color:var(--muted); margin-bottom:28px;}
h1{margin:0; font-weight:800; font-size:56px; line-height:0.96;}
h2{margin:0 0 16px 0; font-weight:200; font-size:28px;}
p.project-bio{font-size:16px; line-height:1.6; margin-top:16px; max-width:800px; text-align: justify;}
a.back-link{display:inline-block; margin-top:24px; text-decoration:none; color:var(--accent); font-weight:500;}

/* Gallery - responzivní */
.gallery{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--gap);
  width: 100%;
}

.tile{
  position: relative;
  border-radius: var(--card-radius);
  overflow: hidden;
  background:#fff;
  aspect-ratio: 3/2;
  cursor:pointer;
  transition: all var(--transition);
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
}

.tile img, .tile video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition: transform var(--transition);
}

.tile:hover img, .tile:hover video{
  transform: scale(1.1);
}

.tile::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  background: linear-gradient(to top, rgba(0,0,0,0.555), rgba(255,255,255,0));
  pointer-events:none;
  opacity:0;
  transition: height var(--transition), opacity var(--transition);
}

.tile:hover::after{
  height:40%;
  opacity:1;
}

.flyout{
  position:absolute;
  z-index:2;
  bottom:10px;
  left:50%;
  transform:translateX(-50%) scale(0);
  transform-origin: bottom center;
  background: rgba(255,255,255,0.116);
  backdrop-filter: blur(5px) saturate(180%);
  border:1px solid rgba(255,255,255,0.6);
  border-radius:16px;
  padding:8px 14px;
  color:#fff;
  font-size:14px;
  white-space:nowrap;
  pointer-events:none;
  transition: transform var(--transition), opacity var(--transition);
  opacity:0;
}

.tile:hover .flyout{
  transform: translateX(-50%) scale(1);
  opacity:1;
}

.tile-video::before{
  content:'▶';
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  font-size:50px;
  color: rgba(255,255,255,0.8);
  text-shadow:2px 2px 6px rgba(0,0,0,0.6);
  pointer-events:none;
  z-index:2;
}

/* Modal */
.modal{
  position:fixed;
  z-index: 1000;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0, 0, 0, 0.95);
  display:none;
  align-items:center;
  justify-content:center;
  padding: 20px;
  box-sizing: border-box;
}

.modal.open{
  display: flex;
}

.modal-inner{
  max-width:100%;
  max-height:100%;
  position:relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.modal-content{
  max-width: 100%;
  max-height: calc(100vh - 100px);
  display: flex;
  justify-content: center;
  align-items: center;
}

.modal-content img{
  max-width:100%;
  max-height:100%;
  border-radius:20px;
  display:block;
  height: auto;
  box-shadow: 0 25px 50px rgba(0,0,0,0.5);
}

.modal-caption{
  color:white;
  font-size:16px;
  margin-top:16px;
  text-align:center;
  max-width: 90%;
  padding: 12px 20px;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.2);
}

.modal-close{
  position:absolute; top:25px; right:25px; font-size:28px; color:white; cursor:pointer; z-index: 1001;
  width: 55px; height: 55px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 50%;
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.modal-close:hover{
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

.modal-nav{
  position:absolute; top:50%; transform:translateY(-50%); font-size:42px; color:white; cursor:pointer; user-select:none;
  z-index: 1001; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 50%;
  transition: all 0.3s ease;
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.modal-nav:hover{
  background: rgba(255,255,255,0.2);
  transform: translateY(-50%) scale(1.15);
}

.modal-prev{left:25px;}
.modal-next{right:25px;}

/* MODERN FROSTED GLASS VIDEO PLAYER */
.player{
  position:relative;
  width: 100%;
  max-width: 90vw;
  border-radius:24px;
  overflow:hidden;
  background: rgba(0,0,0,0.3);
  backdrop-filter: blur(20px);
  box-shadow: 
    0 25px 50px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.1);
  transition: all 0.4s ease;
}

.player video{
  width:100%;
  height:auto;
  max-height:80vh;
  display:block;
  border-radius:24px;
  background: #000;
}

.overlay-icon{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.8);
  font-size:90px;
  color:rgba(255,255,255,0.95);
  opacity:0;
  pointer-events:none;
  transition:all 0.4s ease;
  text-shadow:0 0 40px rgba(0,0,0,0.8);
  z-index: 2;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 50%;
  width: 120px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.2);
}

.overlay-icon.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width: calc(100% - 40px);
  display:flex;
  align-items:center;
  gap:16px;
  padding:20px 24px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(25px);
  border-radius:18px;
  color:white;
  transition:all 0.5s ease;
  opacity:1;
  z-index: 3;
  flex-wrap: wrap;
  border: 1px solid rgba(255,255,255,0.15);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

.controls.hidden{
  transform:translateX(-50%) translateY(120%);
  opacity:0;
}

.control-btn{
  background: rgba(255,255,255,0.12);
  border:none;
  border-radius:14px;
  padding:12px;
  cursor:pointer;
  color:rgba(255,255,255,0.95);
  font-size:18px;
  transition:all 0.3s ease;
  min-width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  flex-shrink: 0;
}

.control-btn:hover{
  background:rgba(255,255,255,0.2); 
  transform:translateY(-2px);
  color: white;
}

.progress-container{
  flex: 1;
  min-width: 0;
  height:8px;
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  position:relative;
  cursor:pointer;
  overflow: hidden;
  margin: 0 12px;
  border: 1px solid rgba(255,255,255,0.1);
}

.progress-bar{
  appearance:none;
  width:100%;
  height:8px;
  background:transparent;
  position:absolute;
  top:0;
  left:0;
  margin:0;
  cursor: pointer;
  opacity: 0;
}

.played{
  position:absolute;
  top:0;
  left:0;
  bottom:0;
  background: linear-gradient(90deg, #fff, rgba(255,255,255,0.9));
  border-radius:10px;
  width:0%;
  pointer-events:none;
  transition: width 0.1s ease;
}

.progress-bar::-webkit-slider-thumb{
  appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#fff;
  box-shadow: 0 0 20px rgba(255,255,255,0.8);
  cursor:pointer;
  transition: all 0.3s ease;
  border: 2px solid #fff;
}

.progress-bar::-webkit-slider-thumb:hover{
  transform: scale(1.3);
}

.volume-container{
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 120px;
  flex-shrink: 0;
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 8px 12px;
  border: 1px solid rgba(255,255,255,0.1);
}

.volume-control{
  flex: 1;
  appearance:none;
  height:6px;
  border-radius:8px;
  background:rgba(255,255,255,0.1);
  cursor:pointer;
  min-width: 80px;
  border: 1px solid rgba(255,255,255,0.1);
}

.volume-control::-webkit-slider-thumb{
  appearance:none;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 15px rgba(255,255,255,0.6);
  cursor:pointer;
  transition: all 0.3s ease;
  border: 2px solid #fff;
}

.volume-control::-webkit-slider-thumb:hover{
  transform: scale(1.3);
}

.time-display{
  font-size:14px;
  min-width:55px;
  text-align:center;
  font-weight: 600;
  flex-shrink: 0;
  color: rgba(255,255,255,0.95);
  background: rgba(255,255,255,0.1);
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
}

/* Fullscreen styles */
.player.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  max-height: 100vh;
  border-radius: 0;
  z-index: 10000;
  max-width: none;
  background: #000;
}

.player.fullscreen video {
  max-height: 100vh;
  height: 100vh;
  object-fit: contain;
  border-radius: 0;
}

.player.fullscreen .controls {
  width: calc(100% - 60px);
  bottom: 30px;
  padding: 24px 28px;
}

/* Loading spinner */
.loading-spinner {
  width: 32px;
  height: 32px;
  border: 3px solid rgba(0, 0, 0, 0.1);
  border-left-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Keyboard shortcuts help */
.keyboard-help {
  position: absolute;
  top: 25px;
  left: 25px;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(20px);
  border-radius: 12px;
  padding: 16px;
  color: white;
  font-size: 14px;
  border: 1px solid rgba(255,255,255,0.2);
  display: none;
  z-index: 1002;
  max-width: 300px;
}

.keyboard-help.show {
  display: block;
}

.keyboard-help h3 {
  margin: 0 0 12px 0;
  font-size: 16px;
  font-weight: 600;
}

.keyboard-shortcut {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.keyboard-shortcut:last-child {
  margin-bottom: 0;
  border-bottom: none;
}

.key {
  background: rgba(255,255,255,0.15);
  padding: 2px 8px;
  border-radius: 4px;
  font-family: monospace;
  font-size: 12px;
}

.help-btn {
  position: absolute;
  top: 25px;
  left: 90px;
  width: 55px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.2);
  color: white;
  cursor: pointer;
  font-size: 20px;
  z-index: 1001;
  transition: all 0.3s ease;
}

.help-btn:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

/* RESPONZIVITA */
@media (max-width: 1024px) {
  .wrap { grid-template-columns: 1fr 2fr; }
  h1 { font-size: 48px; }
  .player { max-width: 92vw; }
}

@media (max-width: 880px) {
  .wrap { grid-template-columns: 1fr; gap: 20px; padding: 12px; }
  h1 { font-size: 44px; }
  h2 { font-size: 24px; }
  .gallery { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .modal-nav { font-size: 36px; width: 55px; height: 55px; }
  .modal-close { width: 50px; height: 50px; font-size: 24px; }
  .player { max-width: 95vw; border-radius: 20px; }
  .controls { padding: 16px 20px; gap: 12px; }
  .control-btn { min-width: 46px; height: 46px; font-size: 16px; padding: 10px; }
  .overlay-icon { font-size: 70px; width: 100px; height: 100px; }
  .help-btn { top: 20px; left: 80px; width: 50px; height: 50px; font-size: 18px; }
  .keyboard-help { top: 20px; left: 20px; max-width: 280px; }
}

@media (max-width: 640px) {
  .gallery { grid-template-columns: 1fr; gap: 10px; }
  h1 { font-size: 36px; }
  .player { max-width: 98vw; border-radius: 16px; }
  .controls { padding: 14px 16px; gap: 10px; width: calc(100% - 20px); bottom: 15px; }
  .control-btn { min-width: 42px; height: 42px; font-size: 15px; padding: 8px; }
  .progress-container { margin: 0 8px; }
  .volume-container { min-width: 100px; }
  .overlay-icon { font-size: 60px; width: 90px; height: 90px; }
  .help-btn { display: none; }
  .keyboard-help { display: none !important; }
}

@media (max-width: 480px) {
  .controls { flex-wrap: wrap; justify-content: space-between; }
  .progress-container { order: 1; flex: 0 0 100%; margin: 10px 0 6px 0; }
  .time-display:nth-of-type(1) { order: 0; }
  .time-display:nth-of-type(2) { order: 2; }
  .volume-container { order: 3; flex: 1; min-width: auto; }
  .fullscreen-btn { order: 4; }
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="brand">
    <div class="kicker">PORTFOLIO // 2025</div>
    <h1>Jan<br/>Levínský</h1>
  </aside>
  <main id="project-container">
    <div class="loading-spinner"></div>
    <div style="text-align: center; color: var(--muted);">Načítám projekt...</div>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <div class="modal-content" id="modal-content"></div>
    <div class="modal-caption" id="modal-caption"></div>
  </div>
  <div class="modal-close" id="modal-close">&times;</div>
  <div class="modal-nav modal-prev" id="modal-prev">&#10094;</div>
  <div class="modal-nav modal-next" id="modal-next">&#10095;</div>
  
  <!-- Tlačítko nápovědy a panel -->
  <div class="help-btn" id="help-btn" title="Keyboard shortcuts (?)">?</div>
  <div class="keyboard-help" id="keyboard-help">
    <h3>Keyboard Shortcuts</h3>
    <div class="keyboard-shortcut">
      <span>Play/Pause</span>
      <span class="key">Space / K</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Forward 10s</span>
      <span class="key">L / →</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Backward 10s</span>
      <span class="key">J / ←</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Forward 5s</span>
      <span class="key">→</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Backward 5s</span>
      <span class="key">←</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Volume Up</span>
      <span class="key">↑</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Volume Down</span>
      <span class="key">↓</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Mute</span>
      <span class="key">M</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Fullscreen</span>
      <span class="key">F</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Next Media</span>
      <span class="key">Shift + →</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Previous Media</span>
      <span class="key">Shift + ←</span>
    </div>
    <div class="keyboard-shortcut">
      <span>Close</span>
      <span class="key">Esc</span>
    </div>
  </div>
</div>

<script>
// Jednoduché získání URL parametru
function getProjectId() {
  const urlParams = new URLSearchParams(window.location.search);
  return parseInt(urlParams.get('id'));
}

// Hlavní funkce
async function loadProject() {
  const projectId = getProjectId();
  const container = document.getElementById('project-container');
  
  if (!projectId) {
    container.innerHTML = '<p>Chybí ID projektu.</p><a href="index.html" class="back-link">&larr; Zpět na portfolio</a>';
    return;
  }

  try {
    // Načtení JSON
    const response = await fetch('./projects.json');
    if (!response.ok) throw new Error('Network error');
    
    const projects = await response.json();
    
    // Najdi projekt
    const project = projects.find(p => p.id === projectId);
    
    if (!project) {
      container.innerHTML = '<p>Projekt nenalezen.</p><a href="index.html" class="back-link">&larr; Zpět na portfolio</a>';
      return;
    }
    
    // Zobraz projekt
    displayProject(project);
    
  } catch (error) {
    console.error('Chyba:', error);
    container.innerHTML = `
      <p>Chyba při načítání projektu.</p>
      <a href="index.html" class="back-link">&larr; Zpět na portfolio</a>
    `;
  }
}

// Zobrazení projektu
function displayProject(project) {
  const container = document.getElementById('project-container');
  
  let galleryHTML = '';
  
  // Vytvoříme galerii
  project.media.forEach((media, index) => {
    const flyoutText = media.title || media.caption ? 
      `${media.title || ''}${media.caption ? ': ' + media.caption : ''}` : '';
    
    const flyoutHTML = flyoutText ? `<div class="flyout">${flyoutText}</div>` : '';
    
    if (media.type === 'photo') {
      galleryHTML += `
        <div class="tile">
          <img src="${media.src}" alt="${media.title || ''}" data-index="${index}" loading="lazy">
          ${flyoutHTML}
        </div>
      `;
    } else {
      galleryHTML += `
        <div class="tile tile-video">
          <video src="${media.src}" data-index="${index}" muted playsinline></video>
          ${flyoutHTML}
        </div>
      `;
    }
  });
  
  // Sestavíme HTML
  container.innerHTML = `
    <h2>${project.title} <span style="font-weight:200;color:gray;">(${project.type})</span></h2>
    ${project.bio ? `<p class="project-bio">${project.bio}</p>` : ''}
    <div class="gallery">${galleryHTML}</div>
    <a href="index.html" class="back-link">&larr; Zpět na portfolio</a>
  `;
  
  // Přidáme klikací eventy
  document.querySelectorAll('.tile img, .tile video').forEach(element => {
    element.addEventListener('click', function() {
      const index = parseInt(this.getAttribute('data-index'));
      openModal(index, project.media);
    });
  });
}

// Modal funkce
let currentMediaIndex = 0;
let currentMediaArray = [];
let currentVideoPlayer = null;

function openModal(index, mediaArray) {
  currentMediaIndex = index;
  currentMediaArray = mediaArray;
  
  const modal = document.getElementById('modal');
  
  showMediaInModal();
  modal.classList.add('open');
  
  // Přidáme event listener pro klávesnici
  document.addEventListener('keydown', handleKeyPress);
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('open');
  
  // Skryjeme nápovědu
  document.getElementById('keyboard-help').classList.remove('show');
  
  // Zastavíme video pokud hraje
  const video = modal.querySelector('video');
  if (video) {
    video.pause();
  }
  
  // Ukončíme fullscreen pokud je aktivní
  if (document.fullscreenElement) {
    document.exitFullscreen().catch(err => console.log(err));
  }
  
  // Odstraníme event listener
  document.removeEventListener('keydown', handleKeyPress);
  currentVideoPlayer = null;
}

function showMediaInModal() {
  const modalContent = document.getElementById('modal-content');
  const modalCaption = document.getElementById('modal-caption');
  
  const media = currentMediaArray[currentMediaIndex];
  if (!media) return;
  
  let mediaHTML = '';
  
  if (media.type === 'photo') {
    mediaHTML = `<img src="${media.src}" alt="${media.title || ''}">`;
    currentVideoPlayer = null;
  } else {
    mediaHTML = `
      <div class="player" id="player">
        <video id="media-element" src="${media.src}" playsinline></video>
        <div class="overlay-icon" id="overlay">▶</div>
        <div class="controls" id="controls">
          <button class="control-btn" id="play-btn" title="Play/Pause">▶</button>
          <span class="time-display" id="current-time">0:00</span>
          <div class="progress-container">
            <div class="played" id="played-bar"></div>
            <input type="range" class="progress-bar" id="progress-input" value="0" min="0" max="100">
          </div>
          <span class="time-display" id="duration-time">0:00</span>
          <div class="volume-container">
            <button class="control-btn" id="mute-btn" title="Mute">🔊</button>
            <input type="range" class="volume-control" id="volume-input" min="0" max="1" step="0.05" value="1">
          </div>
          <button class="control-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
        </div>
      </div>
    `;
  }
  
  modalContent.innerHTML = mediaHTML;
  modalCaption.textContent = `${media.title || ''}${media.caption ? ': ' + media.caption : ''}`;
  
  // Pokud je to video, inicializujeme custom player
  if (media.type === 'video') {
    setTimeout(() => {
      currentVideoPlayer = initializeCustomPlayer();
    }, 100);
  }
}

// CUSTOM VIDEO PLAYER FUNKCE
function initializeCustomPlayer() {
  const player = document.getElementById("player");
  const media = document.getElementById("media-element");
  const controls = document.getElementById("controls");
  const playBtn = document.getElementById("play-btn");
  const muteBtn = document.getElementById("mute-btn");
  const fullscreenBtn = document.getElementById("fullscreen-btn");
  const overlay = document.getElementById("overlay");
  const progressInput = document.getElementById("progress-input");
  const playedBar = document.getElementById("played-bar");
  const currentTime = document.getElementById("current-time");
  const durationTime = document.getElementById("duration-time");
  const volumeInput = document.getElementById("volume-input");
  
  if (!media) return null;
  
  let hideTimeout;
  let isFullscreen = false;

  // Formátování času
  function formatTime(seconds) {
    if (isNaN(seconds)) return "0:00";
    const minutes = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${minutes}:${secs.toString().padStart(2, "0")}`;
  }

  // Play/Pause
  function togglePlay() {
    if (media.paused) {
      media.play().catch(e => console.log('Play error:', e));
      playBtn.textContent = "⏸";
      overlay.classList.remove("show");
    } else {
      media.pause();
      playBtn.textContent = "▶";
      overlay.classList.add("show");
    }
  }

  // Mute/Unmute
  function toggleMute() {
    media.muted = !media.muted;
    muteBtn.textContent = media.muted ? "🔇" : "🔊";
    volumeInput.value = media.muted ? 0 : media.volume;
  }

  // Fullscreen funkce
  function toggleFullscreen() {
    if (!isFullscreen) {
      if (player.requestFullscreen) {
        player.requestFullscreen();
      }
      fullscreenBtn.textContent = "⛷";
      player.classList.add('fullscreen');
      isFullscreen = true;
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
      fullscreenBtn.textContent = "⛶";
      player.classList.remove('fullscreen');
      isFullscreen = false;
    }
  }

  // Seek forward/backward
  function seek(seconds) {
    media.currentTime += seconds;
    showControls();
  }

  // Set volume
  function setVolume(change) {
    let newVolume = media.volume + change;
    newVolume = Math.max(0, Math.min(1, newVolume));
    media.volume = newVolume;
    volumeInput.value = newVolume;
    media.muted = newVolume === 0;
    muteBtn.textContent = media.muted ? "🔇" : "🔊";
    showControls();
  }

  // Event listeners
  playBtn.addEventListener("click", togglePlay);
  muteBtn.addEventListener("click", toggleMute);
  fullscreenBtn.addEventListener("click", toggleFullscreen);
  media.addEventListener("click", togglePlay);

  // Fullscreen change event
  document.addEventListener('fullscreenchange', function() {
    isFullscreen = !!document.fullscreenElement;
    if (isFullscreen) {
      fullscreenBtn.textContent = "⛷";
      player.classList.add('fullscreen');
    } else {
      fullscreenBtn.textContent = "⛶";
      player.classList.remove('fullscreen');
    }
  });

  // Aktualizace progress baru
  media.addEventListener("timeupdate", () => {
    const percent = (media.currentTime / media.duration) * 100 || 0;
    progressInput.value = percent;
    playedBar.style.width = percent + "%";
    currentTime.textContent = formatTime(media.currentTime);
    durationTime.textContent = formatTime(media.duration);
  });

  // Seek
  progressInput.addEventListener("input", () => {
    media.currentTime = (progressInput.value / 100) * media.duration;
  });

  // Volume
  volumeInput.addEventListener("input", () => {
    media.volume = volumeInput.value;
    media.muted = media.volume === 0;
    muteBtn.textContent = media.muted ? "🔇" : "🔊";
  });

  // Skrytí/viditelnost controls
  function showControls() {
    controls.classList.remove("hidden");
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(() => {
      if (!media.paused && isFullscreen) {
        controls.classList.add("hidden");
      }
    }, 3000);
  }

  player.addEventListener("mousemove", showControls);
  media.addEventListener("play", showControls);

  // Focus na video
  media.setAttribute("tabindex", "0");

  // Return player controls for keyboard handling
  return {
    togglePlay,
    toggleMute,
    toggleFullscreen,
    seek,
    setVolume,
    media
  };
}

function prevMedia() {
  currentMediaIndex = (currentMediaIndex - 1 + currentMediaArray.length) % currentMediaArray.length;
  showMediaInModal();
}

function nextMedia() {
  currentMediaIndex = (currentMediaIndex + 1) % currentMediaArray.length;
  showMediaInModal();
}

// Hlavní funkce pro zpracování klávesnice
function handleKeyPress(event) {
  // Zabráníme default chování pro klávesy, které používáme
  const videoKeys = [' ', 'k', 'K', 'j', 'J', 'l', 'L', 'm', 'M', 'f', 'F', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'];
  if (videoKeys.includes(event.key) && currentVideoPlayer) {
    event.preventDefault();
    event.stopPropagation();
  }

  switch(event.key) {
    case ' ':
    case 'k':
    case 'K':
      // Play/Pause
      if (currentVideoPlayer) {
        currentVideoPlayer.togglePlay();
      }
      break;
      
    case 'ArrowLeft':
      if (event.shiftKey) {
        // Previous media
        prevMedia();
      } else if (currentVideoPlayer) {
        // Backward 5 seconds
        currentVideoPlayer.seek(-5);
      }
      break;
      
    case 'ArrowRight':
      if (event.shiftKey) {
        // Next media
        nextMedia();
      } else if (currentVideoPlayer) {
        // Forward 5 seconds
        currentVideoPlayer.seek(5);
      }
      break;
      
    case 'j':
    case 'J':
      // Backward 10 seconds
      if (currentVideoPlayer) {
        currentVideoPlayer.seek(-10);
      }
      break;
      
    case 'l':
    case 'L':
      // Forward 10 seconds
      if (currentVideoPlayer) {
        currentVideoPlayer.seek(10);
      }
      break;
      
    case 'ArrowUp':
      // Volume up
      if (currentVideoPlayer) {
        currentVideoPlayer.setVolume(0.1);
      }
      break;
      
    case 'ArrowDown':
      // Volume down
      if (currentVideoPlayer) {
        currentVideoPlayer.setVolume(-0.1);
      }
      break;
      
    case 'm':
    case 'M':
      // Mute
      if (currentVideoPlayer) {
        currentVideoPlayer.toggleMute();
      }
      break;
      
    case 'f':
    case 'F':
      // Fullscreen
      if (currentVideoPlayer) {
        currentVideoPlayer.toggleFullscreen();
      }
      break;
      
    case '?':
      // Show/hide keyboard help
      const help = document.getElementById('keyboard-help');
      help.classList.toggle('show');
      break;
      
    case 'Escape':
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        const help = document.getElementById('keyboard-help');
        if (help.classList.contains('show')) {
          help.classList.remove('show');
        } else {
          closeModal();
        }
      }
      break;
  }
}

// Event listeners pro modal
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-prev').addEventListener('click', prevMedia);
document.getElementById('modal-next').addEventListener('click', nextMedia);
document.getElementById('help-btn').addEventListener('click', function() {
  document.getElementById('keyboard-help').classList.toggle('show');
});

// Kliknutí mimo obsah modalu zavře modal
document.getElementById('modal').addEventListener('click', function(event) {
  if (event.target === this) {
    closeModal();
  }
});
