/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: auto;
  grid-auto-flow: dense;
  align-items: stretch;
  gap: 14px;
  width: 100%;
}

.tile {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.6s var(--ease-out-expo), border-color 0.4s ease;
  width: 100%;
}

.tile.landscape {
  grid-column: span 1;
  grid-row: span 1;
  aspect-ratio: 16/9;
}

.tile.portrait {
  grid-column: span 1;
  grid-row: span 2;
  aspect-ratio: 9/16;
}

.tile.video-tile { background: var(--bg-raised); }

.tile.video-tile .tile-thumb {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: block;
}

.tile.video-tile .tile-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tile img, .tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.8s var(--ease-out-expo), opacity 0.6s ease;
  pointer-events: none;
}

.tile:hover, .tile:focus-visible {
  transform: translateY(-4px);
  border-color: var(--border-subtle);
  z-index: 2;
}

.tile:hover img, .tile:hover video,
.tile:focus-visible img, .tile:focus-visible video { transform: scale(1.03); }

/* LQIP placeholder — blur-up technique */
.tile .lqip-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(20px) saturate(0.8);
  transform: scale(1.08);
  transition: opacity 0.4s ease;
}
.tile img.loaded + .lqip-bg,
.tile .lqip-bg.hidden {
  opacity: 0;
}

/* Hover overlay */
.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
  pointer-events: none;
  z-index: 2;
}

.tile:hover::after { opacity: 1; }

/* Film Perforations -> Removed */

.flyout {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  color: #fff;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  text-shadow: 0 2px 10px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translate(-50%, -50%) translateY(8px);
  transition: opacity 0.45s var(--ease-in-out), transform 0.45s var(--ease-out-expo);
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
  max-width: 85%;
  text-align: center;
}

.tile:hover .flyout {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0);
}

.tile-thumb { position: relative; }
.video-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
}

.tile:hover .video-overlay,
.tile.video-tile:hover .video-overlay {
  opacity: 1;
}

.video-info {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.45s var(--ease-in-out);
}

.tile:hover .video-info { opacity: 1; }

.video-info-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.6);
  letter-spacing: 0.01em;
  max-width: 70%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s 0.05s var(--ease-in-out), transform 0.4s 0.05s var(--ease-out-expo);
}

.tile:hover .video-info-title {
  opacity: 1;
  transform: translateY(0);
}

.video-info-play {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s 0.15s var(--ease-in-out), transform 0.35s 0.15s var(--ease-out-expo);
}

.video-info-play i {
  font-size: 18px;
  color: var(--accent);
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
}

.tile:hover .video-info-play {
  opacity: 1;
  transform: translateY(0);
}

.loading-state { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 8px 0; }
.loading-ring {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.85s linear infinite;
}
.loading-label { color: var(--muted); font-size: 11.5px; letter-spacing: 0.06em; }

.player {
  position: relative;
  border-radius: var(--r-md);
  overflow: hidden;
  background: #000;
  width: 100%;
  max-width: min(92vw, calc((100vh - 180px) * 16/9));
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
}

.player video {
  width: 100%;
  height: auto;
  max-height: calc(100vh - 180px);
  display: block;
  background: #000;
}

.yt-big-play {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 4;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.35s var(--ease-out-expo);
}
.yt-big-play i { font-size: 32px; color: #fff; }
.player.paused .yt-big-play { opacity: 1; }
.player:hover.paused .yt-big-play { transform: translate(-50%, -50%) scale(1.1); }

.kb-feedback {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 96px; height: 96px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 6;
  opacity: 0;
}
.kb-feedback i { font-size: 40px; color: #fff; }
.kb-feedback.anim { animation: kbFeedback 0.55s var(--ease-out-expo) forwards; }

@keyframes kbFeedback {
  0%  { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
}

.play-flash {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
}
.play-flash i { font-size: 32px; color: #fff; }
.play-flash.show { animation: flashAnim 0.5s var(--ease-out-expo) forwards; }

@keyframes flashAnim {
  0%  { opacity: 0.9; transform: translate(-50%, -50%) scale(0.8); }
  40% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
}

.controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 52px 16px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 45%, transparent 100%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 5;
}
.player:hover .controls,
.player.paused .controls,
.controls.active { opacity: 1; }

.yt-progress {
  width: 100%;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  margin-bottom: 4px;
}

.yt-track {
  position: absolute; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  transition: height 0.15s ease, background 0.15s ease;
  overflow: hidden;
}

.yt-progress:hover .yt-track { height: 6px; background: rgba(255,255,255,0.3); }

.yt-buf {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: rgba(255,255,255,0.35);
  border-radius: 2px;
  width: 0%; pointer-events: none;
}

.yt-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--accent);
  border-radius: 2px;
  width: 0%; pointer-events: none;
}

.yt-thumb {
  position: absolute; top: 50%;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  pointer-events: none;
  transition: transform 0.15s ease, background 0.15s ease;
  z-index: 2;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
}
.yt-progress:hover .yt-thumb { transform: translate(-50%, -50%) scale(1); }
.yt-progress:hover .yt-thumb { background: var(--accent); }

.yt-input {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
  margin: 0;
}

.seek-tooltip {
  position: absolute;
  bottom: calc(100% + 10px);
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 6px;
  pointer-events: none;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s ease;
  font-variant-numeric: tabular-nums;
}
.yt-progress:hover .seek-tooltip { opacity: 1; }

.controls-row { display: flex; align-items: center; gap: 4px; }

.ctrl-btn {
  width: 44px; height: 44px;
  border: none; border-radius: 8px;
  background: transparent;
  cursor: pointer;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, transform 0.15s ease;
  padding: 0;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.1); }
.ctrl-btn:active { transform: scale(0.92); }

.time-wrap {
  display: flex; align-items: center; gap: 0;
  font-size: 13px; font-weight: 400; color: #fff;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
  flex-shrink: 0; user-select: none;
  margin-left: 4px;
  white-space: nowrap;
}
.time-cur { color: #fff; }
.time-sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.time-dur { color: rgba(255,255,255,0.55); }

.vol-wrap { display: flex; align-items: center; gap: 0; }

.vol-slider-wrap {
  width: 0;
  overflow: hidden;
  transition: width 0.25s var(--ease-out-expo);
  display: flex; align-items: center;
}
.vol-wrap:hover .vol-slider-wrap,
.vol-wrap:focus-within .vol-slider-wrap { width: 80px; }

.vol-slider {
  -webkit-appearance: none; appearance: none;
  width: 60px; height: 4px; border-radius: 4px;
  background: rgba(255,255,255,0.25);
  cursor: pointer; outline: none;
  margin: 0 10px;
  flex-shrink: 0;
}
.vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer;
  box-shadow: 0 0 4px rgba(0,0,0,0.3);
}
.vol-slider::-moz-range-thumb {
  width: 14px; height: 14px; border: none; border-radius: 50%; background: #fff; cursor: pointer;
  box-shadow: 0 0 4px rgba(0,0,0,0.3);
}

.controls-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }

.player.is-fs {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;
  max-width: none; max-height: none;
  border-radius: 0; z-index: 2000;
}
.player.is-fs video { max-height: 100vh; height: 100%; object-fit: contain; }

.player-loading {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--accent);
  animation: spin 0.9s linear infinite;
  pointer-events: none;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.2s;
}
.player-loading.show { opacity: 1; }

.modal {
  position: fixed; z-index: 1000; inset: 0;
  background: rgba(250,248,245,0);
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  visibility: hidden;
  transition: background 0.4s var(--ease-in-out), visibility 0s 0.4s;
}

.modal.open {
  background: #000;
  visibility: visible;
  transition: background 0.5s var(--ease-in-out), visibility 0s 0s;
}

.modal-inner {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 72px 80px 48px;
  overflow: visible;
}

.modal-content {
  position: relative;
  max-width: 100%;
  max-height: calc(100vh - 160px);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transform: scale(0.95) translateY(10px);
  transition: opacity 0.45s var(--ease-out-expo), transform 0.45s var(--ease-out-expo);
}

.modal.open .modal-content {
  opacity: 1;
  transform: scale(1) translateY(0);
}

.modal-content img {
  max-width: 100%;
  max-height: calc(100vh - 170px);
  border-radius: var(--r-md);
  display: block;
  height: auto;
}

.modal-caption {
  color: rgba(255,255,255,0.45);
  font-size: 12.5px;
  font-weight: 300;
  margin-top: 20px;
  text-align: center;
  letter-spacing: 0.04em;
  min-height: 18px;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.4s 0.15s var(--ease-out-expo), transform 0.4s 0.15s var(--ease-out-expo);
}

.modal.open .modal-caption {
  opacity: 1;
  transform: translateY(0);
}

.modal-topbar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 64px;
  display: flex;

/* Ambient Lighting */
.ambient-canvas {
  position: absolute;
  inset: -160px;
  width: calc(100% + 320px);
  height: calc(100% + 320px);
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 1.2s ease;
  filter: blur(180px) saturate(1.1) brightness(0.4);
}

.modal.open .ambient-canvas {
  opacity: 1;
}

.ambient-canvas.off {
  opacity: 0 !important;
  transition: opacity 0.6s ease;
}

/* ─── SETTINGS PANEL (YouTube-style) ────────────────── */
.settings-btn { position: relative; }
.settings-panel {
  position: absolute;
  bottom: 70px;
  right: 12px;
  background: rgba(33,33,33,0.98);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  min-width: 224px;
  max-width: 260px;
  z-index: 20;
  opacity: 0;
  transform: translateY(8px) scale(0.96);

  transition: opacity 0.18s var(--ease-out-expo), transform 0.18s var(--ease-out-expo);
  backdrop-filter: blur(32px);

  box-shadow: 0 16px 48px rgba(0,0,0,0.7);

}
.settings-panel.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
.settings-menu, .settings-sub {
  padding: 8px 0;
}
.settings-sub { display: none; }
.settings-menu.show, .settings-sub.show { display: block; }

.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 16px;

  user-select: none;
}
.settings-item:hover { background: rgba(255,255,255,0.08); }
.settings-item i { font-size: 16px; margin-right: 6px; color: rgba(255,255,255,0.5); }

.settings-item-value {
  color: rgba(255,255,255,0.4);

}

.settings-sub-header {
  display: flex;
  align-items: center;
  padding: 4px 6px 8px 2px;
  color: #eee;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 1px solid rgba(255,255,255,0.06);

.settings-opt-row i { font-size: 15px; margin-right: 6px; color: rgba(255,255,255,0.35); }

.settings-divider {
  height: 1px;
  background: rgba(255,255,255,0.06);

/* ─── SUBTITLE OVERLAY ─────────────────────────────── */
.sub-overlay {
  position: absolute;

// ─── CASE-INSENSITIVE PATH RESOLVER ──────────────────────────────────
const _pathCache = new Map();

function tryHead(url) {
  return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
}

async function resolvePath(path) {
  if (!path || _pathCache.has(path)) return _pathCache.get(path) || path;
  // 1. Original
  if (await tryHead(path)) { _pathCache.set(path, path); return path; }
  // 2. Lowercase
  const lower = path.toLowerCase();
  if (lower !== path && await tryHead(lower)) { _pathCache.set(path, lower); return lower; }
  // 3. Lowercase with spaces->hyphens
  const lowerHyphen = lower.replace(/ /g, '-');
  if (lowerHyphen !== path && await tryHead(lowerHyphen)) { _pathCache.set(path, lowerHyphen); return lowerHyphen; }
  // 4. Lowercase with %20->hyphens
  const lowerEncoded = lower.replace(/%20/g, '-');
  if (lowerEncoded !== path && await tryHead(lowerEncoded)) { _pathCache.set(path, lowerEncoded); return lowerEncoded; }
  _pathCache.set(path, path);
  return path;
}

async function resolveProjectPaths(project) {
  if (!project) return project;
  const tasks = [];
  const setters = [];
  const collect = (key, val, setter) => { if (val) { tasks.push(resolvePath(val)); setters.push(setter); } };
  collect('thumbnail', project.thumbnail, v => project.thumbnail = v);
  collect('full', project.full, v => project.full = v);
  collect('og_image', project.og_image, v => project.og_image = v);
  if (project.media) {
    project.media.forEach((m, i) => {
      collect('src', m.src, v => m.src = v);
      collect('thumbnail', m.thumbnail, v => m.thumbnail = v);
      collect('poster', m.poster, v => m.poster = v);
    });
  }
  const resolved = await Promise.all(tasks);
  resolved.forEach((v, i) => setters[i](v));
  return project;
}

function setOrientation(tile, w, h) {
  if (!w || !h) { tile.classList.add('landscape'); return; }
  if (w >= h) {
    tile.classList.add('landscape');
    tile.classList.remove('portrait');
  } else {
    tile.classList.add('portrait');
    tile.classList.remove('landscape');
  }
}

function detectOrientations() {
  document.querySelectorAll('.tile').forEach(tile => {
    const img = tile.querySelector('img');
    const video = tile.querySelector('video');

    if (img) {
      if (img.complete && img.naturalWidth) {
        setOrientation(tile, img.naturalWidth, img.naturalHeight);
      } else {
        img.addEventListener('load', () => setOrientation(tile, img.naturalWidth, img.naturalHeight));
        img.addEventListener('error', () => setOrientation(tile, 16, 9));
      }
    } else if (video) {
      if (video.videoWidth) {
        setOrientation(tile, video.videoWidth, video.videoHeight);
      } else {
        video.addEventListener('loadedmetadata', () => setOrientation(tile, video.videoWidth, video.videoHeight));
        setTimeout(() => {
          if (!tile.classList.contains('landscape') && !tile.classList.contains('portrait')) {
            setOrientation(tile, video.videoWidth || 16, video.videoHeight || 9);
          }
        }, 3000);
      }
    } else {
      tile.classList.add('landscape');
    }
  });
}

// DYNAMIC META TAG UPDATE - supports builder features
function updateMetaTags(project) {
  const setMeta = (id, attr, val) => {
    const el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  };

  // OG image: prefer project.og_image, then thumbnail, then first media src, then fallback
  let ogImage = 'https://levinskyj.art/media/og-cover.webp';
  if (project.og_image) {
    ogImage = 'https://levinskyj.art/' + project.og_image;
  } else if (project.thumbnail) {
    ogImage = 'https://levinskyj.art/' + project.thumbnail;
  } else if (project.media && project.media[0] && project.media[0].src) {
    ogImage = 'https://levinskyj.art/' + project.media[0].src;
  }

  const description = project.bio
    ? project.bio.substring(0, 200).replace(/\n/g, ' ') + (project.bio.length > 200 ? '...' : '')
    : 'Cinematography & Photography. Detail projektu.';

  const canonicalUrl = 'https://levinskyj.art/project.html?id=' + project.id;

  setMeta('og-url', 'content', canonicalUrl);
  setMeta('og-title', 'content', project.title + ' — Jan Levínský');
  setMeta('og-desc', 'content', description);
  setMeta('og-image', 'content', ogImage);
  setMeta('og-image-alt', 'content', project.title + ' — project preview');

  // OG image type based on extension
  const ogExt = ogImage.split('.').pop().toLowerCase();
  const mimeType = ogExt === 'webp' ? 'image/webp' : ogExt === 'png' ? 'image/png' : ogExt === 'jpg' || ogExt === 'jpeg' ? 'image/jpeg' : 'image/png';
  setMeta('og-image-type', 'content', mimeType);

  setMeta('tw-title', 'content', project.title + ' — Jan Levínský');
  setMeta('tw-desc', 'content', description);
  setMeta('tw-image', 'content', ogImage);
  setMeta('tw-image-alt', 'content', project.title + ' — project preview');

  // Canonical link
  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.href = canonicalUrl;

  // Meta description
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = description;

  // Title
  document.title = project.title + ' — Jan Levínský';
}

async function loadProject() {
  const id = getProjectId();
  const container = document.getElementById('project-container');
  if (!id) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Missing project ID.</p>';
    return;
  }

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('network');
    const projects = await res.json();
    const projectList = Array.isArray(projects) ? projects : (projects.projects || []);
    const project = projectList.find(p => p.id === id);
    if (!project) {
      container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Project not found.</p>';
      return;
    }
    // Resolve case-insensitive paths before displaying
    await resolveProjectPaths(project);
    displayProject(project);
    updateMetaTags(project);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Failed to load project.</p>';
  }
}

let idx = 0, media = [], vp = null;
let ambientRaf = null, ambientCtx = null, lastAmbientTime = 0;
let ambientEnabled = true;
let currentPhotoImg = null;
let ambientFrameCount = 0;

function toggleAmbient() {
  ambientEnabled = !ambientEnabled;
  const canvas = document.getElementById('ambient-canvas');
  if (canvas) canvas.classList.toggle('off', !ambientEnabled);
  document.querySelectorAll('#ambient-on, #ambient-off').forEach(el => {
    el.classList.toggle('active', (ambientEnabled && el.id === 'ambient-on') || (!ambientEnabled && el.id === 'ambient-off'));
  });
  const val = document.getElementById('ambient-val');
  if (val) val.textContent = ambientEnabled ? 'On' : 'Off';
  if (ambientEnabled && modal.classList.contains('open')) {
    startAmbient();
  } else {
    stopAmbient();
  }
}

function getAmbientCanvas() {
  const c = document.getElementById('ambient-canvas');
  if (!c) return null;
  if (!ambientCtx) ambientCtx = c.getContext('2d');
  return c;
}

function resizeAmbient() {
  const c = getAmbientCanvas();
  if (!c) return;
  const inner = document.querySelector('.modal-inner');
  if (!inner) return;
  const rect = inner.getBoundingClientRect();
  c.width = rect.width + 160;
  c.height = rect.height + 160;
}

function drawAmbient() {
  if (!ambientEnabled) { ambientRaf = null; return; }
  const c = getAmbientCanvas();
  if (!c || !ambientCtx) return;

  const vid = document.querySelector('#vid');
  const isVideo = !!(vid && vid.readyState >= 2);

  if (isVideo) {
    const now = performance.now();
    const throttle = ambientFrameCount < 5 ? 16 : 33;
    if (now - lastAmbientTime < throttle) {
      ambientRaf = requestAnimationFrame(drawAmbient);
      return;
    }
    lastAmbientTime = now;
  }

  let source = null;
  if (isVideo) {
    source = vid;
  } else if (currentPhotoImg && currentPhotoImg.complete && currentPhotoImg.naturalWidth) {
    source = currentPhotoImg;
  }

  if (!source) {
    if (isVideo) {
      ambientRaf = requestAnimationFrame(drawAmbient);
    }
    return;
  }

  try {
    ambientCtx.imageSmoothingEnabled = true;
    ambientCtx.imageSmoothingQuality = 'low';
    ambientCtx.drawImage(source, 0, 0, c.width, c.height);
  } catch(e) {}

  if (isVideo) {
    ambientFrameCount++;
    ambientRaf = requestAnimationFrame(drawAmbient);
  } else {
    ambientRaf = null;
  }
}

function repaintAmbient() {
  const c = getAmbientCanvas();
  if (!c || !ambientCtx || !ambientEnabled) return;
  const vid = document.querySelector('#vid');
  const hasVideo = vid && vid.readyState >= 2;
  if (!hasVideo && currentPhotoImg && currentPhotoImg.complete && currentPhotoImg.naturalWidth) {
    try {
      ambientCtx.imageSmoothingEnabled = true;
      ambientCtx.imageSmoothingQuality = 'low';
      ambientCtx.drawImage(currentPhotoImg, 0, 0, c.width, c.height);
    } catch(e) {}
  }
}

function startAmbient() {
  if (!ambientEnabled || ambientRaf) return;
  ambientFrameCount = 0;
  resizeAmbient();
  ambientRaf = requestAnimationFrame(drawAmbient);
}

function setAmbientPhoto(img) {
  currentPhotoImg = img;
  ambientFrameCount = 0;
  if (ambientEnabled && modal.classList.contains('open')) {
    startAmbient();
  }
}

function stopAmbient() {
  if (ambientRaf) {
    cancelAnimationFrame(ambientRaf);
    ambientRaf = null;
  }
}

const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
const modalCaption = document.getElementById('modal-caption');

  if (!prefersReduced && ensureGsap()) {

    [content, caption, ...navs.map(n => document.querySelector(n))].forEach(el => {
      if (el) el.style.transition = 'none';
    });
    const tl = gsap.timeline({
      onComplete: () => {
        const navEls = navs.map(n => document.querySelector(n));
        [content, caption, ...navEls].forEach(el => {
          if (el) { el.style.transition = ''; }
        });
        gsap.set([content, caption, ...navEls.filter(Boolean)], { clearProps: 'transform' });
      }
    });
    tl.fromTo(content,
      { opacity: 0, scale: 0.96, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'power3.out' }, 0);
    tl.fromTo(caption,
      { opacity: 0, y: 6 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' }, 0.1);
    tl.fromTo('.modal-prev',
      { opacity: 0, x: -12 },
      { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 0.15);
    tl.fromTo('.modal-next',
      { opacity: 0, x: 12 },
      { opacity: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 0.15);
  }
}

function closeModal() {
  if (!modal.classList.contains('open')) return;

  if (!prefersReduced && ensureGsap()) {
    modalContent.style.transition = 'none';
    gsap.to(modalContent, {
      opacity: 0,
      scale: 0.96,
      y: 6,
      duration: 0.25,
      ease: 'power2.in',
      onComplete: () => {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        document.removeEventListener('keydown', onKey);
        const v = modalContent.querySelector('video');
        if (v) v.pause();
        if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        vp = null;
        currentPhotoImg = null;
        stopAmbient();
        modalContent.style.opacity = '';
        modalContent.style.transform = '';
        modalContent.style.transition = '';
      }
    });
    gsap.to('.modal-caption', { opacity: 0, y: 4, duration: 0.2, ease: 'power2.in' });
  } else {
    const quickMs = 180;
    modalContent.style.transition = 'opacity ' + quickMs + 'ms var(--ease-out-expo), transform ' + quickMs + 'ms var(--ease-out-expo)';
    modalContent.style.opacity = '0';
    modalContent.style.transform = 'scale(0.97) translateY(6px)';
    setTimeout(() => {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
      const v = modalContent.querySelector('video');
      if (v) v.pause();
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      vp = null;
      modalContent.style.transition = '';
      modalContent.style.opacity = '';
      modalContent.style.transform = '';
    }, quickMs + 20);
  }
}

function renderMedia() {
  const m = media[idx];
  if (!m) return;

  modalCounter.textContent = (idx + 1) + ' / ' + media.length;
  document.getElementById('modal-prev').classList.toggle('disabled', media.length <= 1);
  document.getElementById('modal-next').classList.toggle('disabled', media.length <= 1);

  const cap = [m.title, m.caption].filter(Boolean).join(' — ');

  const prevVideo = modalContent.querySelector('video');
  if (prevVideo) prevVideo.pause();
  vp = null;

  modalContent.style.opacity = '0';
  modalContent.style.transform = 'scale(0.97) translateY(6px)';

  setTimeout(() => {
    if (m.type === 'photo') {
      modalContent.innerHTML = '<img src="' + m.src + '" alt="' + (m.title || '') + '" id="modal-photo" onerror="imgErrorFallback(this)">';
      vp = null;
      const photoImg = modalContent.querySelector('#modal-photo');
      if (photoImg) {
        if (photoImg.complete) {
          setAmbientPhoto(photoImg);
        } else {
          photoImg.addEventListener('load', () => setAmbientPhoto(photoImg));
        }
      }
    } else {
      modalContent.innerHTML = buildPlayer(m.src, m.sources);
      currentPhotoImg = null;
      ambientFrameCount = 0;
      setTimeout(() => { vp = initPlayer(); startAmbient(); }, 60);
    }
    modalCaption.textContent = cap;

    requestAnimationFrame(() => {
      modalContent.style.transition = 'opacity 0.4s var(--ease-out-expo), transform 0.4s var(--ease-out-expo)';
      modalContent.style.opacity = '1';
      modalContent.style.transform = 'scale(1) translateY(0)';
    });
  }, 150);
}

function prev() { idx = (idx - 1 + media.length) % media.length; renderMedia(); }
function next() { idx = (idx + 1) % media.length; renderMedia(); }

function initPlayer() { return initPlayerIn(document); }

function initPlayerIn(root) {
  const $ = id => root.getElementById ? root.getElementById(id) : root.querySelector('#'+id);

  const player   = $('player');
  const vid      = $('vid');
  const controls = $('controls');
  const playBtn  = $('play-btn');
  const playIcon = $('play-icon');
  const muteBtn  = $('mute-btn');
  const volIcon  = $('vol-icon');
  const fsBtn    = $('fs-btn');
  const fsIcon   = $('fs-icon');
  const ytInput  = $('yt-input');
  const ytFill   = $('yt-fill');
  const ytBuf    = $('yt-buf');
  const ytThumb  = $('yt-thumb');
  const curTime  = $('cur-time');
  const durTime  = $('dur-time');
  const volSlider= $('vol-slider');
  const flash    = $('play-flash');
  const flashIcon= $('play-flash-icon');
  const seekTT   = $('seek-tt');
  const ytProg   = $('yt-progress');
  const loading  = $('player-loading');
  if (!vid) return null;

  const settingsBtn = $('settings-btn');
  const settingsPnl = $('settings-panel');
  const settingsMenu= $('settings-menu');
  const subFileInp  = $('sub-file-input');
  const subOverlay  = $('sub-overlay');
  const subText     = $('sub-text');

  let hideTimer, isFs = false;
  let cues = [], subActive = false, curSpeed = 1;
  let subRaf = null;

  function fmt(s){
    if (isNaN(s) || !isFinite(s)) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = String(Math.floor(s % 60)).padStart(2, '0');
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + sec;
    return m + ':' + sec;
  }

  function updateVolIcon() {
    if (!volIcon) return;
    const v = vid.volume, m = vid.muted;
    if (m || v === 0) { volIcon.className = 'ph ph-speaker-x'; }
    else if (v < 0.5) { volIcon.className = 'ph ph-speaker-low'; }
    else { volIcon.className = 'ph ph-speaker-high'; }
    if (volSlider) volSlider.value = m ? 0 : v;
  }

  function updatePlayIcon() {
    if (playIcon) playIcon.className = vid.paused ? 'ph ph-play' : 'ph ph-pause';
    if (player) player.classList.toggle('paused', vid.paused);
  }

  function updateFsIcon() {
    if (fsIcon) fsIcon.className = isFs ? 'ph ph-corners-in' : 'ph ph-corners-out';
  }

  function showControls() {
    if (!controls) return;
    controls.classList.add('active');
    clearTimeout(hideTimer);
    if (!vid.paused) hideTimer = setTimeout(() => controls.classList.remove('active'), 3000);
  }

  function flashIconFn(paused) {
    if (!flash || !flashIcon) return;
    flashIcon.className = paused ? 'ph ph-pause' : 'ph ph-play';
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 500);
  }

  function togglePlay() {
    if (vid.paused) { vid.play().catch(()=>{}); flashIconFn(false); }
    else { vid.pause(); flashIconFn(true); }
    showControls();
  }

  function toggleMute() { vid.muted = !vid.muted; updateVolIcon(); }

  function setVolume(delta) {
    vid.volume = Math.max(0, Math.min(1, vid.volume + delta));
    vid.muted = vid.volume === 0;
    updateVolIcon(); showControls();
  }

  function seekBy(s) {
    vid.currentTime = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + s));
    showControls();
  }

  function toggleFs() {
    if (!isFs) player?.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.().catch(()=>{});
  }

  function showMenu(id) {
    if (!settingsPnl) return;
    settingsPnl.querySelectorAll('.settings-menu, .settings-sub').forEach(el => el.classList.remove('show'));
    const target = settingsPnl.querySelector(id);
    if (target) target.classList.add('show');
  }

  function closeSettings(e) {
    if (settingsPnl && !settingsPnl.contains(e.target) && e.target !== settingsBtn) {
      settingsPnl.classList.remove('show');
    }
  }

  function toggleSettings(e) {
    e.stopPropagation();
    if (!settingsPnl) return;
    const wasOpen = settingsPnl.classList.contains('show');
    settingsPnl.classList.toggle('show');
    if (!wasOpen) {
      showMenu('#settings-menu');
      setTimeout(() => document.addEventListener('click', closeSettings, { once: true }), 0);
    }
  }

  function setSpeed(speed) {
    curSpeed = speed;
    vid.playbackRate = speed;
    const sub = settingsPnl?.querySelector('#sub-speed');
    if (sub) {
      sub.querySelectorAll('.settings-opt-row').forEach(el => {
        el.classList.toggle('active', parseFloat(el.dataset.speed) === speed);
      });
    }
    const val = document.getElementById('speed-val');
    if (val) val.textContent = speed === 1 ? 'Normal' : speed + '×';
    showMenu('#settings-menu');
  }

  function loadSubtitleFile(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      if (ext === 'vtt') cues = parseVTT(text);
      else if (ext === 'srt') cues = parseSRT(text);
      else if (ext === 'ass') cues = parseASS(text);
      else return;

      const sub = settingsPnl?.querySelector('#sub-subtitles');
      if (cues.length && sub) {
        const existing = sub.querySelectorAll('[data-sub]:not([data-sub="off"])');
        existing.forEach(el => el.remove());
        cues.forEach((c, i) => {
          const row = document.createElement('div');
          row.className = 'settings-opt-row' + (i === 0 ? '' : '');
          row.dataset.sub = i;
          row.innerHTML = '<span><i class="ph ph-closed-captioning"></i> ' + (c.label || 'Track ' + (i + 1)) + '</span><span class="check"></span>';
          row.addEventListener('click', e => { e.stopPropagation(); selectSubTrack(i); });
          sub.insertBefore(row, sub.querySelector('#sub-load-row'));
        });
        selectSubTrack(0);
      }
      let subLabel = file.name.length > 20 ? file.name.slice(0, 18) + '…' : file.name;
      document.getElementById('subs-val').textContent = subLabel;
    };
    reader.readAsText(file);
  }

  function selectSubTrack(idx) {
    subActive = idx >= 0 && idx < cues.length;
    const sub = settingsPnl?.querySelector('#sub-subtitles');
    if (sub) {
      sub.querySelectorAll('.settings-opt-row[data-sub]').forEach(el => {
        const val = el.dataset.sub;
        el.classList.toggle('active', (subActive && parseInt(val) === idx) || (!subActive && val === 'off'));
      });
    }
    if (!subActive) {
      if (subOverlay) subOverlay.classList.remove('show');
      if (subText) subText.textContent = '';
      if (subRaf) { cancelAnimationFrame(subRaf); subRaf = null; }
      document.getElementById('subs-val').textContent = 'Off';
    } else {
      updateSubtitle();
      document.getElementById('subs-val').textContent = cues[idx].label || 'Track ' + (idx + 1);
    }
    showMenu('#settings-menu');
  }

  function updateSubtitle() {
    if (!subActive || !cues.length || !subOverlay || !subText) { subRaf = null; return; }
    const ct = vid.currentTime;
    let found = false;
    for (const cue of cues) {
      if (ct >= cue.start - 0.05 && ct <= cue.end + 0.05) {
        if (subText.innerHTML !== cue.text) subText.innerHTML = cue.text;
        subOverlay.classList.add('show');
        found = true;
        break;
      }
    }
    if (!found) {
      subOverlay.classList.remove('show');
      subText.textContent = '';
    }
    subRaf = requestAnimationFrame(updateSubtitle);
  }

  if (playBtn) playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  if (muteBtn) muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  if (fsBtn) fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
  if (settingsBtn) settingsBtn.addEventListener('click', toggleSettings);

  if (settingsMenu) settingsMenu.addEventListener('click', e => {
    const item = e.target.closest('.settings-item');
    if (item && item.dataset.menu) {
      e.stopPropagation();
      showMenu('#sub-' + item.dataset.menu);
    }
  });

  if (settingsPnl) settingsPnl.addEventListener('click', e => {
    const back = e.target.closest('.settings-back');
    if (back) { e.stopPropagation(); showMenu('#settings-menu'); }
    const row = e.target.closest('.settings-opt-row');
    if (!row) return;

    if (row.dataset.speed !== undefined) {
      e.stopPropagation();
      setSpeed(parseFloat(row.dataset.speed));
    } else if (row.dataset.quality !== undefined) {
      e.stopPropagation();
      const parent = row.closest('.settings-sub');
      if (parent) parent.querySelectorAll('.settings-opt-row').forEach(r => r.classList.remove('active'));
      row.classList.add('active');
      const newSrc = row.dataset.src;
      const oldSrc = vid.src.split('/').pop();
      const newFile = newSrc.split('/').pop();
      if (newSrc && oldSrc !== newFile) {
        const ct = vid.currentTime, playing = !vid.paused;
        vid.src = newSrc;
        vid.currentTime = ct;
        if (playing) vid.play().catch(()=>{});
      }
      const label = row.querySelector('span')?.textContent || 'Auto';
      document.getElementById('quality-val').textContent = label;
      showMenu('#settings-menu');
    } else if (row.dataset.sub !== undefined) {
      e.stopPropagation();
      selectSubTrack(parseInt(row.dataset.sub));
    } else if (row.id === 'sub-load-row') {
      e.stopPropagation();
      if (subFileInp) subFileInp.click();
    } else if (row.id === 'ambient-on' || row.id === 'ambient-off') {
      e.stopPropagation();
      toggleAmbient();
    }
  });

  if (subFileInp) subFileInp.addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) loadSubtitleFile(e.target.files[0]);
  });

  if (player) {
    vid.addEventListener('click', togglePlay);
    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseleave', () => { if (!vid.paused) controls?.classList.remove('active'); });
    player.addEventListener('dblclick', e => { e.stopPropagation(); toggleFs(); });
  }

  vid.addEventListener('play', () => { updatePlayIcon(); showControls(); if (subActive) updateSubtitle(); });
  vid.addEventListener('pause', () => { updatePlayIcon(); controls?.classList.add('active'); clearTimeout(hideTimer); });
  vid.addEventListener('ended', () => { updatePlayIcon(); controls?.classList.add('active'); });
  vid.addEventListener('waiting', () => { if (loading) loading.classList.add('show'); });
  vid.addEventListener('playing', () => { if (loading) loading.classList.remove('show'); });
  vid.addEventListener('canplay', () => { if (loading) loading.classList.remove('show'); });
  vid.addEventListener('seeked', () => { if (subActive) updateSubtitle(); });

  vid.addEventListener('timeupdate', () => {
    const pct = vid.duration ? vid.currentTime / vid.duration : 0;
    if (ytInput) ytInput.value = pct * 1000;
    if (ytFill) ytFill.style.width = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left = (pct * 100) + '%';
    if (curTime) curTime.textContent = fmt(vid.currentTime);
    if (durTime) durTime.textContent = fmt(vid.duration);
  });

  vid.addEventListener('progress', () => {
    if (ytBuf && vid.buffered.length && vid.duration) {
      ytBuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
    }
  });

  if (ytInput) ytInput.addEventListener('input', () => {
    const pct = ytInput.value / 1000;
    vid.currentTime = pct * vid.duration;
    if (ytFill) ytFill.style.width = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left = (pct * 100) + '%';
  });

  if (ytProg) {
    ytProg.addEventListener('mousemove', e => {
      const rect = ytProg.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (seekTT) {
        seekTT.textContent = fmt(pct * (vid.duration || 0));
        seekTT.style.left = (pct * 100) + '%';
      }
    });
    ytProg.addEventListener('mouseleave', () => {
      if (seekTT) seekTT.style.opacity = '0';
    });
    ytProg.addEventListener('mouseenter', () => {
      if (seekTT) seekTT.style.opacity = '1';
    });
  }

  if (volSlider) volSlider.addEventListener('input', e => {
    e.stopPropagation();
    vid.volume = parseFloat(volSlider.value);
    vid.muted = vid.volume === 0;
    updateVolIcon();
  });

  document.addEventListener('fullscreenchange', () => {
    isFs = !!document.fullscreenElement;
    player?.classList.toggle('is-fs', isFs);
    updateFsIcon();
    if (!isFs) controls?.classList.add('active');
  });

  updatePlayIcon(); updateVolIcon(); updateFsIcon(); showControls();
  return { togglePlay, toggleMute, toggleFs, seekBy, setVolume, setSpeed, selectSubTrack, loadSubtitleFile };
}

function parseVTT(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const cues = [];
  let i = 0;
  while (i < lines.length && !lines[i].trim().startsWith('WEBVTT') && !lines[i].trim().match(/^\d+:\d+/)) i++;
  const timeRe = /(\d{1,2}:?\d{2}:\d{2}\.\d{3}|\d{1,2}:\d{2}\.\d{3})\s*-->\s*(\d{1,2}:?\d{2}:\d{2}\.\d{3}|\d{1,2}:\d{2}\.\d{3})/;
  for (; i < lines.length; i++) {
    const m = lines[i].match(timeRe);
    if (m) {
      const start = parseVTTTime(m[1]);
      const end = parseVTTTime(m[2]);
      const textLines = [];
      i++;
      while (i < lines.length && lines[i].trim() !== '' && !lines[i].match(timeRe)) {
        textLines.push(lines[i].replace(/<[^>]+>/g, ''));
        i++;
      }
      if (textLines.length) cues.push({ start, end, text: textLines.join('<br>').trim() });
    }
  }
  return cues;
}

function parseVTTTime(str) {
  const parts = str.split(':');
  if (parts.length === 3) {
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2].replace(',', '.'));
  }
  return parseFloat(parts[0]) * 60 + parseFloat(parts[parts.length - 1].replace(',', '.'));
}

function parseSRT(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const cues = [];
  const timeRe = /(\d{2}:\d{2}:\d{2}[.,]\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2}[.,]\d{3})/;
  let i = 0;
  while (i < lines.length) {
    if (lines[i].trim() === '' || /^\d+$/.test(lines[i].trim())) {
      i++;
      const m = lines[i] ? lines[i].match(timeRe) : null;
      if (m) {
        const start = parseSRTTime(m[1]);
        const end = parseSRTTime(m[2]);
        i++;
        const textLines = [];
        while (i < lines.length && lines[i].trim() !== '') {
          textLines.push(lines[i]);
          i++;
        }
        if (textLines.length) cues.push({ start, end, text: textLines.join('<br>').trim() });
      }
    } else { i++; }
  }
  return cues;
}

function parseSRTTime(str) {
  const parts = str.replace(',', '.').split(':');
  return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]);
}

function parseASS(text) {
  const lines = text.replace(/\r\n/g, '\n').split('\n');
  const cues = [];
  let inEvents = false;
  let fmtParts = [];
  for (const line of lines) {
    if (line.startsWith('Format:') || line.startsWith('format:')) {
      fmtParts = line.split(':')[1].split(',').map(s => s.trim().toLowerCase());
    }
    if (line.startsWith('Dialogue:') || line.startsWith('dialogue:')) {
      const parts = line.split(',');
      if (parts.length >= 10) {
        const start = parseASSTime(parts[1].trim());
        const end = parseASSTime(parts[2].trim());
        const textIdx = fmtParts.length ? fmtParts.indexOf('text') : -1;
        let text = textIdx >= 0 ? parts.slice(textIdx).join(',').trim() : parts.slice(9).join(',').trim();
        text = text.replace(/\{[^}]+\}/g, '').replace(/\\N/g, '<br>');
        if (text) cues.push({ start, end, text });
      }
    }
  }
  return cues;
}

function parseASSTime(str) {
  const parts = str.replace(',', '.').split(':');
  if (parts.length === 4) {
    return parseFloat(parts[0]) * 3600 + parseFloat(parts[1]) * 60 + parseFloat(parts[2]) + parseFloat(parts[3]);
  }
  return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
}

function getModalVideo() {
  return document.querySelector('#vid');
}

function showFeedback(iconClass) {
  const fb = document.getElementById('kb-feedback');
  const icon = document.getElementById('kb-feedback-icon');
  if (!fb || !icon) return;
  icon.className = 'ph ' + iconClass;
  fb.classList.remove('anim');
  void fb.offsetWidth;
  fb.classList.add('anim');
}

function onKey(e) {
  if (!modal.classList.contains('open')) return;

  const hasVideo = !!vp;
  const videoKeys = [' ','k','K','j','J','l','L','m','M','f','F','ArrowUp','ArrowDown','>','.','<',','];
  if (hasVideo && videoKeys.includes(e.key) && !e.shiftKey) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();

  switch (e.key) {
    case ' ':
    case 'k': case 'K':
      if (hasVideo) {
        vp.togglePlay();
        const v = getModalVideo();
        showFeedback(v && !v.paused ? 'ph-play' : 'ph-pause');
      }
      break;
    case 'ArrowLeft':
      if (e.shiftKey) { prev(); }
      else if (hasVideo) { vp.seekBy(-5); showFeedback('ph-arrow-left'); }
      break;
    case 'ArrowRight':
      if (e.shiftKey) { next(); }
      else if (hasVideo) { vp.seekBy(5); showFeedback('ph-arrow-right'); }
      break;
    case 'j': case 'J':
      if (hasVideo) { vp.seekBy(-10); showFeedback('ph-skip-back'); }
      break;
    case 'l': case 'L':
      if (hasVideo) { vp.seekBy(10); showFeedback('ph-skip-forward'); }
      break;
    case 'ArrowUp':
      if (hasVideo) {
        vp.setVolume(0.1);
        const v = getModalVideo();
        const vol = v ? v.volume : 0;
        showFeedback(vol === 0 || (v && v.muted) ? 'ph-speaker-x' : vol < 0.5 ? 'ph-speaker-low' : 'ph-speaker-high');
      }
      break;
    case 'ArrowDown':
      if (hasVideo) {
        vp.setVolume(-0.1);
        const v = getModalVideo();
        const vol = v ? v.volume : 0;
        showFeedback(vol === 0 || (v && v.muted) ? 'ph-speaker-x' : vol < 0.5 ? 'ph-speaker-low' : 'ph-speaker-high');
      }
      break;
    case 'm': case 'M':
      if (hasVideo) {
        vp.toggleMute();
        const v = getModalVideo();
        showFeedback(v && v.muted ? 'ph-speaker-x' : 'ph-speaker-high');
      }
      break;
    case 'f': case 'F':
      if (hasVideo) {
        vp.toggleFs();
        showFeedback(document.fullscreenElement ? 'ph-corners-in' : 'ph-corners-out');
      }
      break;
    case '>': case '.':
      if (hasVideo && vp.setSpeed) {
        const rates = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
        const cur = getModalVideo()?.playbackRate || 1;
        const next = rates.find(r => r > cur) || rates[rates.length - 1];
        vp.setSpeed(next);
        showFeedback('ph-speedometer');
      }
      break;
    case '<': case ',':
      if (hasVideo && vp.setSpeed) {
        const rates = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
        const cur = getModalVideo()?.playbackRate || 1;
        const prev = [...rates].reverse().find(r => r < cur) || rates[0];
        vp.setSpeed(prev);
        showFeedback('ph-speedometer');
      }
      break;
    case '?':
      document.getElementById('shortcuts-panel').classList.toggle('show');
      break;
    case 'a': case 'A':
      toggleAmbient();
      break;
    case 'Escape':
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.getElementById('shortcuts-panel').classList.contains('show'))
        document.getElementById('shortcuts-panel').classList.remove('show');
      else closeModal();
      break;
  }
}

window.addEventListener('resize', () => {
  resizeAmbient();
  repaintAmbient();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-prev').addEventListener('click', prev);
document.getElementById('modal-next').addEventListener('click', next);

document.getElementById('shortcuts-btn').addEventListener('click', () => {
  const panel = document.getElementById('shortcuts-panel');
  const isShowing = panel.classList.toggle('show');
  if (window.Motion && !prefersReduced && isShowing) {
    const rows = panel.querySelectorAll('.sc-row');
    Motion.animate(
      rows,
      { opacity: [0, 1], x: [8, 0] },
      { delay: Motion.stagger(0.05), duration: 0.35, easing: [0.22, 1, 0.36, 1] }
    );
  }
});

modal.addEventListener('click', e => {
  if (e.target === modal || e.target.classList.contains('modal-inner')) closeModal();
});

let touchStartX = 0;
modal.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
modal.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, { passive: true });

const logoEl2 = document.querySelector('.logo-mark');
if (logoEl2) {
  logoEl2.addEventListener('animationend', function() {
    this.classList.add('anim-done');
  });
}

loadProject();
</script>
