<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --accent: #c4956a;
  --text-on-accent: #0c0c0c;
  --accent-subtle: #c4966b1f;
  --accent-subtle-2: #c4956a0f;
  --bg: #faf8f5;
  --surface: #f0ece6;
  --bg-raised: #f5f2ee;
  --surface-raised: #eae6e0;
  --bg-subtle: #fdfcfa;
  --border: #d4cfc7;
  --border-subtle: #e8e4dd;
  --text: #1c1917;
  --muted: #6b6560;
  --serif: 'Bricolage Grotesque', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

html, body { height: 100%; color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { background: var(--bg); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-full); }

a:focus-visible, button:focus-visible, .tile:focus-visible,
.modal-close:focus-visible, .modal-shortcuts-btn:focus-visible,
.modal-nav:focus-visible, .ctrl-btn:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

.wrap {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 40px;
  max-width: 1420px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
}

.brand {
  padding: 4px 0 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 24px;
  height: fit-content;
}

.kicker {
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 30px;
  opacity: 0;
  animation: fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 56px;
  line-height: 0.92;
  letter-spacing: -0.015em;
  color: var(--text);
  opacity: 0;
  animation: fadeUp 0.8s 0.15s var(--ease-out-expo) forwards;
}

h1 .last { display: block; font-style: italic; color: var(--accent); }

.h1-word { display: block; }
.h1-char { display: inline-block; will-change: transform; }
html.lib-anim h1 { animation: none; opacity: 1; }
html.lib-anim .h1-char { opacity: 0; }

.px-wrap {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  z-index: 0;
  pointer-events: none;
}
.px-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.divider {
  width: 28px;
  height: 1.5px;
  background: var(--accent);
  margin: 26px 0;
  opacity: 0;
  animation: fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--accent);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  transition: color 0.3s ease, gap 0.4s var(--ease-out-expo);
  opacity: 0;
  animation: fadeUp 0.7s 0.3s var(--ease-out-expo) forwards;
  width: fit-content;
}

.back-link i {
  font-size: 14px;
  opacity: 0.7;
  transition: transform 0.4s var(--ease-out-expo), opacity 0.3s ease;
  display: inline-block;
}

.back-link:hover { color: var(--text); gap: 10px; }
.back-link:hover i { transform: translateX(-3px); opacity: 1; }

main {
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 0.9s 0.2s var(--ease-out-expo) forwards;
}

.project-header { margin-bottom: 22px; }

.project-title {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 38px;
  line-height: 1.08;
  letter-spacing: -0.015em;
}

.project-meta {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); opacity: 0.5; }

.project-bio {
  font-size: 13.5px;
  line-height: 1.8;
  color: var(--muted);
  font-weight: 300;
  max-width: 680px;
  margin: 0 0 26px;
}

.project-tech { margin-top: 8px; font-size: 13px; color: var(--muted); font-weight: 500; }

.gear-section { margin: 0 0 28px; }
.gear-title {
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.gear-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 16px 28px;
}
.gear-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.gear-group-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}
.gear-group-label i { font-size: 13px; color: var(--accent); opacity: 0.8; }
.gear-items {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.gear-chip {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.01em;
  transition: border-color 0.25s ease, background 0.25s ease;
}
.gear-chip:hover {
  border-color: var(--accent);
  background: var(--bg-raised);
}

/* Gallery */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-auto-rows: auto;
  grid-auto-flow: dense;
  align-items: stretch;
  gap: 14px;
  width: 100%;
}

.tile {
  position: relative;
  border-radius: var(--r-lg);
  overflow: hidden;
  background: var(--surface);
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.6s var(--ease-out-expo), border-color 0.4s ease;
  width: 100%;
}

.tile.landscape {
  grid-column: span 1;
  grid-row: span 1;
  aspect-ratio: 16/9;
}

.tile.portrait {
  grid-column: span 1;
  grid-row: span 2;
  aspect-ratio: 9/16;
}

.tile.video-tile { background: var(--bg-raised); }

.tile.video-tile .tile-thumb {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: block;
}

.tile.video-tile .tile-thumb img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.tile img, .tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.8s var(--ease-out-expo), opacity 0.6s ease;
  pointer-events: none;
}

.tile:hover {
  transform: translateY(-4px) scale(1.015);
  border-color: var(--border-subtle);
  z-index: 2;
}

.tile:hover img, .tile:hover video { transform: scale(1.03); }

/* LQIP placeholder */
.tile .lqip-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(8px) saturate(0.8);
  transition: opacity 0.6s var(--ease-out-expo);
}
.tile img.loaded + .lqip-bg,
.tile .lqip-bg.hidden {
  opacity: 0;
}

/* Hover overlay */
.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
  pointer-events: none;
  z-index: 2;
}

.tile:hover::after { opacity: 1; }

/* Film Perforations */
.film-perf-v {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  opacity: 1;
  transition: opacity 0.3s ease;
  top: 3.5%;
  bottom: 3.5%;
  width: calc(var(--perf-dot-width, 11%) + 2%);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-v.left { left: 2.5%; }
.film-perf-v.right { right: 2.5%; }

.film-perf-v .perf-dot {
  width: var(--perf-dot-width, 11%);
  height: var(--perf-dot-height, 1.2%);
  border-radius: 999px;
  background: var(--bg);
  flex-shrink: 0;
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.6),
    1px 1px 3px rgba(0,0,0,0.25),
    inset 2px 2px 4px rgba(0,0,0,0.45),
    inset -1px -1px 2px rgba(255,255,255,0.15);
  transition: box-shadow 0.4s ease, transform 0.4s var(--ease-out-expo);
}

.tile:hover .film-perf-v { opacity: 0.9; }

.tile:hover .perf-dot {
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.7),
    1px 1px 4px rgba(0,0,0,0.35),
    inset 2.5px 2.5px 5px rgba(0,0,0,0.55),
    inset -1px -1px 2px rgba(255,255,255,0.2);
}

.film-shadow {
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  transition: opacity 0.5s ease;
}

.tile:hover .film-shadow { opacity: 0.75; }

.tile.video-tile .film-shadow {
  box-shadow:
    inset 60px 0 40px -30px rgba(0, 0, 0, 0.7),
    inset -60px 0 40px -30px rgba(0, 0, 0, 0.7);
}

.tile.video-tile::after { opacity: 0; }
.tile.video-tile:hover::after { opacity: 0; }

.flyout {
  position: absolute;
  z-index: 5;
  left: 50%;
  top: 50%;
  color: #fff;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  text-shadow: 0 2px 10px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translate(-50%, -50%) translateY(8px);
  transition: opacity 0.45s var(--ease-in-out), transform 0.45s var(--ease-out-expo);
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
  max-width: 85%;
  text-align: center;
}

.tile:hover .flyout {
  opacity: 1;
  transform: translate(-50%, -50%) translateY(0);
}

.tile-thumb { position: relative; }
.video-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  background: rgba(0,0,0,0.55);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
}

.tile:hover .video-overlay,
.tile.video-tile:hover .video-overlay {
  opacity: 1;
}

.video-info {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.45s var(--ease-in-out);
}

.tile:hover .video-info { opacity: 1; }

.video-info-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 600;
  color: #fff;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.6);
  letter-spacing: 0.01em;
  max-width: 70%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s 0.05s var(--ease-in-out), transform 0.4s 0.05s var(--ease-out-expo);
}

.tile:hover .video-info-title {
  opacity: 1;
  transform: translateY(0);
}

.video-info-play {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s 0.15s var(--ease-in-out), transform 0.35s 0.15s var(--ease-out-expo);
}

.video-info-play i {
  font-size: 18px;
  color: var(--accent);
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
}

.tile:hover .video-info-play {
  opacity: 1;
  transform: translateY(0);
}

.loading-state { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 8px 0; }
.loading-ring {
  width: 30px; height: 30px; border-radius: 50%;
  border: 2px solid var(--border); border-top-color: var(--accent);
  animation: spin 0.85s linear infinite;
}
.loading-label { color: var(--muted); font-size: 11.5px; letter-spacing: 0.06em; }

.player {
  position: relative;
  border-radius: var(--r-md);
  overflow: hidden;
  background: #000;
  width: 100%;
  max-width: min(92vw, calc((100vh - 180px) * 16/9));
  cursor: pointer;
  -webkit-user-select: none; user-select: none;
}

.player video {
  width: 100%;
  height: auto;
  max-height: calc(100vh - 180px);
  display: block;
  background: #000;
}

.yt-big-play {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 4;
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.35s var(--ease-out-expo);
}
.yt-big-play i { font-size: 32px; color: #fff; }
.player.paused .yt-big-play { opacity: 1; }
.player:hover.paused .yt-big-play { transform: translate(-50%, -50%) scale(1.1); }

.kb-feedback {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 96px; height: 96px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 6;
  opacity: 0;
}
.kb-feedback i { font-size: 40px; color: #fff; }
.kb-feedback.anim { animation: kbFeedback 0.55s var(--ease-out-expo) forwards; }

@keyframes kbFeedback {
  0%  { opacity: 0; transform: translate(-50%, -50%) scale(0.75); }
  15% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  75% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.15); }
}

.play-flash {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 5;
  opacity: 0;
}
.play-flash i { font-size: 32px; color: #fff; }
.play-flash.show { animation: flashAnim 0.5s var(--ease-out-expo) forwards; }

@keyframes flashAnim {
  0%  { opacity: 0.9; transform: translate(-50%, -50%) scale(0.8); }
  40% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
}

.controls {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 52px 16px 12px;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 45%, transparent 100%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  opacity: 0;
  transition: opacity 0.3s ease;
  z-index: 5;
}
.player:hover .controls,
.player.paused .controls,
.controls.active { opacity: 1; }

.yt-progress {
  width: 100%;
  height: 20px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  margin-bottom: 4px;
}

.yt-track {
  position: absolute; left: 0; right: 0;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  transition: height 0.15s ease, background 0.15s ease;
  overflow: hidden;
}

.yt-progress:hover .yt-track { height: 6px; background: rgba(255,255,255,0.3); }

.yt-buf {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: rgba(255,255,255,0.35);
  border-radius: 2px;
  width: 0%; pointer-events: none;
}

.yt-fill {
  position: absolute; top: 0; left: 0; bottom: 0;
  background: var(--accent);
  border-radius: 2px;
  width: 0%; pointer-events: none;
}

.yt-thumb {
  position: absolute; top: 50%;
  width: 14px; height: 14px;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(0);
  pointer-events: none;
  transition: transform 0.15s ease, background 0.15s ease;
  z-index: 2;
  box-shadow: 0 0 6px rgba(0,0,0,0.4);
}
.yt-progress:hover .yt-thumb { transform: translate(-50%, -50%) scale(1); }
.yt-progress:hover .yt-thumb { background: var(--accent); }

.yt-input {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
  margin: 0;
}

.seek-tooltip {
  position: absolute;
  bottom: calc(100% + 10px);
  transform: translateX(-50%);
  background: rgba(0,0,0,0.9);
  color: #fff;
  font-size: 12px;
  font-weight: 500;
  padding: 4px 10px;
  border-radius: 6px;
  pointer-events: none;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s ease;
  font-variant-numeric: tabular-nums;
}
.yt-progress:hover .seek-tooltip { opacity: 1; }

.controls-row { display: flex; align-items: center; gap: 4px; }

.ctrl-btn {
  width: 44px; height: 44px;
  border: none; border-radius: 8px;
  background: transparent;
  cursor: pointer;
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, transform 0.15s ease;
  padding: 0;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.1); }
.ctrl-btn:active { transform: scale(0.92); }

.time-wrap {
  display: flex; align-items: center; gap: 0;

<script>
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia('(pointer: fine)').matches;
let heroChars = [];
let gsapReady = false;

function ensureGsap() {
  if (gsapReady) return typeof gsap !== 'undefined';
  if (typeof gsap === 'undefined') return false;
  if (typeof ScrollTrigger !== 'undefined') gsap.registerPlugin(ScrollTrigger);
  gsapReady = true;
  return true;
}

function splitChars(root) {
  const chars = [];
  const pushChars = (text, parent) => {
    for (const ch of text) {
      const c = document.createElement('span');
      c.className = 'h1-char';
      c.textContent = ch === ' ' ? '\u00A0' : ch;
      c.setAttribute('aria-hidden', 'true');
      parent.appendChild(c);
      chars.push(c);
    }
  };
  Array.from(root.childNodes).forEach(node => {
    if (node.nodeType === Node.TEXT_NODE) {
      if (!node.textContent.trim()) return;
      const wrap = document.createElement('span');
      wrap.className = 'h1-word';
      root.insertBefore(wrap, node);
      pushChars(node.textContent, wrap);
      root.removeChild(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
      root.removeChild(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'BR') {
      const text = node.textContent;
      node.setAttribute('aria-label', text);
      node.textContent = '';
      pushChars(text, node);
    }
  });
  return chars;
}

function prepareHero() {
  if (prefersReduced) return;
  const h1 = document.querySelector('h1');
  if (!h1) return;
  heroChars = splitChars(h1);
  if (heroChars.length) document.documentElement.classList.add('lib-anim');
}

function initHeroAnim() {
  if (!heroChars.length) return;
  if (!window.Motion) { document.documentElement.classList.remove('lib-anim'); return; }
  Motion.animate(
    heroChars,
    { opacity: [0, 1], y: ['0.6em', '0em'], rotate: [8, 0] },
    { delay: Motion.stagger(0.03, { start: 0.12 }), duration: 0.75, easing: [0.16, 1, 0.3, 1] }
  );
}

prepareHero();

document.addEventListener('DOMContentLoaded', () => {
  initHeroAnim();
  ensureGsap();
});

function getProjectId() {
  return parseInt(new URLSearchParams(window.location.search).get('id'));
}

// ─── CASE-INSENSITIVE PATH RESOLVER ──────────────────────────────────
const _pathCache = new Map();

function tryHead(url) {
  return fetch(url, { method: 'HEAD', cache: 'no-store' }).then(r => r.ok).catch(() => false);
}

async function resolvePath(path) {
  if (!path || _pathCache.has(path)) return _pathCache.get(path) || path;
  // 1. Original
  if (await tryHead(path)) { _pathCache.set(path, path); return path; }
  // 2. Lowercase
  const lower = path.toLowerCase();
  if (lower !== path && await tryHead(lower)) { _pathCache.set(path, lower); return lower; }
  // 3. Lowercase with spaces->hyphens
  const lowerHyphen = lower.replace(/ /g, '-');
  if (lowerHyphen !== path && await tryHead(lowerHyphen)) { _pathCache.set(path, lowerHyphen); return lowerHyphen; }
  // 4. Lowercase with %20->hyphens
  const lowerEncoded = lower.replace(/%20/g, '-');
  if (lowerEncoded !== path && await tryHead(lowerEncoded)) { _pathCache.set(path, lowerEncoded); return lowerEncoded; }
  _pathCache.set(path, path);
  return path;
}

async function resolveProjectPaths(project) {
  if (!project) return project;
  const tasks = [];
  const setters = [];
  const collect = (key, val, setter) => { if (val) { tasks.push(resolvePath(val)); setters.push(setter); } };
  collect('thumbnail', project.thumbnail, v => project.thumbnail = v);
  collect('full', project.full, v => project.full = v);
  collect('og_image', project.og_image, v => project.og_image = v);
  if (project.media) {
    project.media.forEach((m, i) => {
      collect('src', m.src, v => m.src = v);
      collect('thumbnail', m.thumbnail, v => m.thumbnail = v);
      collect('poster', m.poster, v => m.poster = v);
    });
  }
  const resolved = await Promise.all(tasks);
  resolved.forEach((v, i) => setters[i](v));
  return project;
}

function imgErrorFallback(img) {
  const orig = img.getAttribute('data-orig-src') || img.src;
  if (!img.getAttribute('data-orig-src')) img.setAttribute('data-orig-src', orig);
  const n = parseInt(img.getAttribute('data-attempt') || '0');
  img.setAttribute('data-attempt', String(n + 1));
  const variants = [orig.toLowerCase(), orig.toLowerCase().replace(/ /g, '-'), orig.toLowerCase().replace(/%20/g, '-')];
  if (n < variants.length && variants[n] !== img.src) {
    img.src = variants[n];
  } else {
    img.removeAttribute('onerror');
  }
}

function setOrientation(tile, w, h) {
  if (!w || !h) { tile.classList.add('landscape'); return; }
  if (w >= h) {
    tile.classList.add('landscape');
    tile.classList.remove('portrait');
  } else {
    tile.classList.add('portrait');
    tile.classList.remove('landscape');
  }
  requestAnimationFrame(() => recalcPerforations());
}

function detectOrientations() {
  document.querySelectorAll('.tile').forEach(tile => {
    const img = tile.querySelector('img');
    const video = tile.querySelector('video');

    if (img) {
      if (img.complete && img.naturalWidth) {
        setOrientation(tile, img.naturalWidth, img.naturalHeight);
      } else {
        img.addEventListener('load', () => setOrientation(tile, img.naturalWidth, img.naturalHeight));
        img.addEventListener('error', () => setOrientation(tile, 16, 9));
      }
    } else if (video) {
      if (video.videoWidth) {
        setOrientation(tile, video.videoWidth, video.videoHeight);
      } else {
        video.addEventListener('loadedmetadata', () => setOrientation(tile, video.videoWidth, video.videoHeight));
        setTimeout(() => {
          if (!tile.classList.contains('landscape') && !tile.classList.contains('portrait')) {
            setOrientation(tile, video.videoWidth || 16, video.videoHeight || 9);
          }
        }, 3000);
      }
    } else {
      tile.classList.add('landscape');
    }
  });
}

// DYNAMIC META TAG UPDATE - supports builder features
function updateMetaTags(project) {
  const setMeta = (id, attr, val) => {
    const el = document.getElementById(id);
    if (el) el.setAttribute(attr, val);
  };

  // OG image: prefer project.og_image, then thumbnail, then first media src, then fallback
  let ogImage = 'https://levinskyj.art/media/og-cover.webp';
  if (project.og_image) {
    ogImage = 'https://levinskyj.art/' + project.og_image;
  } else if (project.thumbnail) {
    ogImage = 'https://levinskyj.art/' + project.thumbnail;
  } else if (project.media && project.media[0] && project.media[0].src) {
    ogImage = 'https://levinskyj.art/' + project.media[0].src;
  }

  const description = project.bio
    ? project.bio.substring(0, 200).replace(/\n/g, ' ') + (project.bio.length > 200 ? '...' : '')
    : 'Cinematography & Photography. Detail projektu.';

  const canonicalUrl = 'https://levinskyj.art/project.html?id=' + project.id;

  setMeta('og-url', 'content', canonicalUrl);
  setMeta('og-title', 'content', project.title + ' — Jan Levínský');
  setMeta('og-desc', 'content', description);
  setMeta('og-image', 'content', ogImage);
  setMeta('og-image-alt', 'content', project.title + ' — project preview');

  // OG image type based on extension
  const ogExt = ogImage.split('.').pop().toLowerCase();
  const mimeType = ogExt === 'webp' ? 'image/webp' : ogExt === 'png' ? 'image/png' : ogExt === 'jpg' || ogExt === 'jpeg' ? 'image/jpeg' : 'image/png';
  setMeta('og-image-type', 'content', mimeType);

  setMeta('tw-title', 'content', project.title + ' — Jan Levínský');
  setMeta('tw-desc', 'content', description);
  setMeta('tw-image', 'content', ogImage);
  setMeta('tw-image-alt', 'content', project.title + ' — project preview');

  // Canonical link
  const canonical = document.querySelector('link[rel="canonical"]');
  if (canonical) canonical.href = canonicalUrl;

  // Meta description
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.content = description;

  // Title
  document.title = project.title + ' — Jan Levínský';
}

async function loadProject() {
  const id = getProjectId();
  const container = document.getElementById('project-container');
  if (!id) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Missing project ID.</p>';
    return;
  }

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('network');
    const projects = await res.json();
    const projectList = Array.isArray(projects) ? projects : (projects.projects || []);
    const project = projectList.find(p => p.id === id);
    if (!project) {
      container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Project not found.</p>';
      return;
    }
    // Resolve case-insensitive paths before displaying
    await resolveProjectPaths(project);
    displayProject(project);
    updateMetaTags(project);
  } catch(e) {
    container.innerHTML = '<p style="color:var(--muted);font-size:13px;">Failed to load project.</p>';
  }
}

function recalcPerforations() {
  const tiles = Array.from(document.querySelectorAll('.tile'));
  tiles.forEach(a => {
    const type = a.dataset.perfType;
    if (!type) return;
    const frameW = parseFloat(a.dataset.perfFrameWidth);
    const frameH = parseFloat(a.dataset.perfFrameHeight);
    const holeW = parseFloat(a.dataset.perfHoleWidth);
    const holeH = parseFloat(a.dataset.perfHoleHeight);
    const count = parseInt(a.dataset.perfCount, 10) || 2;
    const rect = a.getBoundingClientRect();
    const isVideo = type === 'video';
    const pitchPx = isVideo ? (4.75 / frameH) * rect.height : (4.75 / frameW) * rect.width;
    const dotWidthPx = (holeW / frameW) * rect.width;
    const dotHeightPx = (holeH / frameH) * rect.height;
    const gapForH = Math.max(1, pitchPx - dotWidthPx);
    const gapForV = Math.max(1, pitchPx - dotHeightPx);
    a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
    a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

    const perfVLeft = a.querySelector('.film-perf-v.left');
    const perfVRight = a.querySelector('.film-perf-v.right');
    if (perfVLeft || perfVRight) {
      const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
      [perfVLeft, perfVRight].forEach(el => {
        if (!el) return;
        el.style.height = Math.round(containerH) + 'px';
        el.style.top = '50%';
        el.style.transform = 'translateY(-50%)';
        el.style.justifyContent = 'flex-start';
        el.style.gap = Math.round(gapForV) + 'px';
        el.querySelectorAll('.perf-dot').forEach(d => {
          d.style.width = Math.round(dotWidthPx) + 'px';
          d.style.height = Math.round(dotHeightPx) + 'px';
          d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
        });
      });
    }
  });
}

let idx = 0, media = [], vp = null;
let ambientRaf = null, ambientCtx = null, lastAmbientTime = 0;
let ambientEnabled = true;
let currentPhotoImg = null;
let ambientFrameCount = 0;

function toggleAmbient() {
  ambientEnabled = !ambientEnabled;
  const btn = document.getElementById('ambient-btn');
  const canvas = document.getElementById('ambient-canvas');
  if (btn) btn.classList.toggle('off', !ambientEnabled);
  if (canvas) canvas.classList.toggle('off', !ambientEnabled);
  if (ambientEnabled && modal.classList.contains('open')) {
    startAmbient();
  } else {
    stopAmbient();
  }
}

function getAmbientCanvas() {
  const c = document.getElementById('ambient-canvas');
  if (!c) return null;
  if (!ambientCtx) ambientCtx = c.getContext('2d');
  return c;
}

function resizeAmbient() {
  const c = getAmbientCanvas();
  if (!c) return;
  const inner = document.querySelector('.modal-inner');
  if (!inner) return;
  const rect = inner.getBoundingClientRect();
  c.width = rect.width + 160;
  c.height = rect.height + 160;
}

function drawAmbient() {
  if (!ambientEnabled) { ambientRaf = null; return; }
  const c = getAmbientCanvas();
  if (!c || !ambientCtx) return;

  const now = performance.now();
  const throttle = ambientFrameCount < 5 ? 16 : 33;
  if (now - lastAmbientTime < throttle) {
    ambientRaf = requestAnimationFrame(drawAmbient);
    return;
  }
  lastAmbientTime = now;
  ambientFrameCount++;

  let source = null;
  const vid = document.querySelector('#vid');
  if (vid && vid.readyState >= 2) {
    source = vid;
  } else if (currentPhotoImg && currentPhotoImg.complete && currentPhotoImg.naturalWidth) {
    source = currentPhotoImg;
  }

  if (!source) {
    ambientRaf = requestAnimationFrame(drawAmbient);
    return;
  }

  try {
    ambientCtx.imageSmoothingEnabled = true;
    ambientCtx.imageSmoothingQuality = 'low';
    ambientCtx.drawImage(source, 0, 0, c.width, c.height);
  } catch(e) {}

  ambientRaf = requestAnimationFrame(drawAmbient);
}

function startAmbient() {
  if (!ambientEnabled || ambientRaf) return;
  ambientFrameCount = 0;
  resizeAmbient();
  ambientRaf = requestAnimationFrame(drawAmbient);
}

function setAmbientPhoto(img) {
  currentPhotoImg = img;
  ambientFrameCount = 0;
  if (ambientEnabled && modal.classList.contains('open')) {
    startAmbient();
  }
}

function stopAmbient() {
  if (ambientRaf) {
    cancelAnimationFrame(ambientRaf);
    ambientRaf = null;
  }
}

const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');
const modalCaption = document.getElementById('modal-caption');
const modalCounter = document.getElementById('modal-counter');

function openModal(i, arr) {
  idx = i; media = arr;
  renderMedia();
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
  document.addEventListener('keydown', onKey);

  if (!prefersReduced && ensureGsap()) {
    const content = document.querySelector('.modal-content');
    const caption = document.querySelector('.modal-caption');
    const navs = ['.modal-prev', '.modal-next'];
    [content, caption, ...navs.map(n => document.querySelector(n))].forEach(el => {
      if (el) el.style.transition = 'none';
    });
    const tl = gsap.timeline({
      onComplete: () => {
        const navEls = navs.map(n => document.querySelector(n));
        [content, caption, ...navEls].forEach(el => {
          if (el) { el.style.transition = ''; }
        });
        gsap.set([content, caption, ...navEls.filter(Boolean)], { clearProps: 'transform' });
      }
    });
    tl.fromTo(content,
      { opacity: 0, scale: 0.96, y: 10 },
      { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'expo.out' }, 0);
    tl.fromTo(caption,
      { opacity: 0, y: 6 },
      { opacity: 1, y: 0, duration: 0.4, ease: 'expo.out' }, 0.1);
    tl.fromTo('.modal-prev',
      { opacity: 0, x: -12 },
      { opacity: 1, x: 0, duration: 0.4, ease: 'expo.out' }, 0.15);
    tl.fromTo('.modal-next',
      { opacity: 0, x: 12 },
      { opacity: 1, x: 0, duration: 0.4, ease: 'expo.out' }, 0.15);
  }
}

function closeModal() {
  if (!modal.classList.contains('open')) return;

  if (!prefersReduced && ensureGsap()) {
    modalContent.style.transition = 'none';
    gsap.to(modalContent, {
      opacity: 0,
      scale: 0.96,
      y: 6,
      duration: 0.25,
      ease: 'power2.in',
      onComplete: () => {
        modal.classList.remove('open');
        document.body.style.overflow = '';
        document.removeEventListener('keydown', onKey);
        const v = modalContent.querySelector('video');
        if (v) v.pause();
        if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        vp = null;
        currentPhotoImg = null;
        stopAmbient();
        modalContent.style.opacity = '';
        modalContent.style.transform = '';
        modalContent.style.transition = '';
      }
    });
    gsap.to('.modal-caption', { opacity: 0, y: 4, duration: 0.2, ease: 'power2.in' });
  } else {
    const quickMs = 180;
    modalContent.style.transition = 'opacity ' + quickMs + 'ms var(--ease-out-expo), transform ' + quickMs + 'ms var(--ease-out-expo)';
    modalContent.style.opacity = '0';
    modalContent.style.transform = 'scale(0.97) translateY(6px)';
    setTimeout(() => {
      modal.classList.remove('open');
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKey);
      const v = modalContent.querySelector('video');
      if (v) v.pause();
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      vp = null;
      modalContent.style.transition = '';
      modalContent.style.opacity = '';
      modalContent.style.transform = '';
    }, quickMs + 20);
  }
}

function renderMedia() {
  const m = media[idx];
  if (!m) return;

  modalCounter.textContent = (idx + 1) + ' / ' + media.length;
  document.getElementById('modal-prev').classList.toggle('disabled', media.length <= 1);
  document.getElementById('modal-next').classList.toggle('disabled', media.length <= 1);

  const cap = [m.title, m.caption].filter(Boolean).join(' — ');

  const prevVideo = modalContent.querySelector('video');
  if (prevVideo) prevVideo.pause();
  vp = null;

  modalContent.style.opacity = '0';
  modalContent.style.transform = 'scale(0.97) translateY(6px)';

  setTimeout(() => {
    if (m.type === 'photo') {
      modalContent.innerHTML = '<img src="' + m.src + '" alt="' + (m.title || '') + '" id="modal-photo" onerror="imgErrorFallback(this)">';
      vp = null;
      const photoImg = modalContent.querySelector('#modal-photo');
      if (photoImg) {
        if (photoImg.complete) {
          setAmbientPhoto(photoImg);
        } else {
          photoImg.addEventListener('load', () => setAmbientPhoto(photoImg));
        }
      }
    } else {
      modalContent.innerHTML = buildPlayer(m.src);
      currentPhotoImg = null;
      ambientFrameCount = 0;
      setTimeout(() => { vp = initPlayer(); startAmbient(); }, 60);
    }
    modalCaption.textContent = cap;

    requestAnimationFrame(() => {
      modalContent.style.transition = 'opacity 0.4s var(--ease-out-expo), transform 0.4s var(--ease-out-expo)';
      modalContent.style.opacity = '1';
      modalContent.style.transform = 'scale(1) translateY(0)';
    });
  }, 150);
}

function prev() { idx = (idx - 1 + media.length) % media.length; renderMedia(); }
function next() { idx = (idx + 1) % media.length; renderMedia(); }

function buildPlayer(src) {
  const s = src ? encodeURI(src) : src;
  return '<div class="player paused" id="player">' +
    '<video id="vid" crossorigin="anonymous" src="' + s + '" playsinline preload="metadata" controlsList="nodownload"></video>' +
    '<div class="player-loading" id="player-loading"></div>' +
    '<div class="yt-big-play" id="yt-big-play">' +
    '<i class="ph ph-play"></i>' +
    '</div>' +
    '<div class="kb-feedback" id="kb-feedback"><i id="kb-feedback-icon"></i></div>' +
    '<div class="play-flash" id="play-flash">' +
    '<i class="ph ph-play" id="play-flash-icon"></i>' +
    '</div>' +
    '<div class="controls" id="controls">' +
    '<div class="yt-progress" id="yt-progress">' +
    '<div class="yt-track">' +
    '<div class="yt-buf" id="yt-buf"></div>' +
    '<div class="yt-fill" id="yt-fill"></div>' +
    '</div>' +
    '<div class="yt-thumb" id="yt-thumb"></div>' +
    '<input type="range" class="yt-input" id="yt-input" min="0" max="1000" value="0" step="1">' +
    '<div class="seek-tooltip" id="seek-tt">0:00</div>' +
    '</div>' +
    '<div class="controls-row">' +
    '<button class="ctrl-btn" id="play-btn" title="Play/Pause (Space)" aria-label="Play or pause">' +
    '<i class="ph ph-play" id="play-icon" style="font-size:20px;"></i>' +
    '</button>' +
    '<div class="vol-wrap">' +
    '<button class="ctrl-btn" id="mute-btn" title="Mute (M)" aria-label="Mute">' +
    '<i class="ph ph-speaker-high" id="vol-icon" style="font-size:20px;"></i>' +
    '</button>' +
    '<div class="vol-slider-wrap">' +
    '<input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.02" value="1" aria-label="Volume">' +
    '</div>' +
    '</div>' +
    '<div class="time-wrap">' +
    '<span class="time-cur" id="cur-time">0:00</span>' +
    '<span class="time-sep">/</span>' +
    '<span class="time-dur" id="dur-time">0:00</span>' +
    '</div>' +
    '<div class="controls-right">' +
    '<button class="ctrl-btn" id="fs-btn" title="Fullscreen (F)" aria-label="Fullscreen">' +
    '<i class="ph ph-corners-out" id="fs-icon" style="font-size:20px;"></i>' +
    '</button>' +
    '</div>' +
    '</div>' +
    '</div>' +
    '</div>';
}

function initPlayer() { return initPlayerIn(document); }

function initPlayerIn(root) {
  const $ = id => root.getElementById ? root.getElementById(id) : root.querySelector('#'+id);
  const player   = $('player');
  const vid      = $('vid');
  const controls = $('controls');
  const playBtn  = $('play-btn');
  const playIcon = $('play-icon');
  const muteBtn  = $('mute-btn');
  const volIcon  = $('vol-icon');
  const fsBtn    = $('fs-btn');
  const fsIcon   = $('fs-icon');
  const ytInput  = $('yt-input');
  const ytFill   = $('yt-fill');
  const ytBuf    = $('yt-buf');
  const ytThumb  = $('yt-thumb');
  const curTime  = $('cur-time');
  const durTime  = $('dur-time');
  const volSlider= $('vol-slider');
  const flash    = $('play-flash');
  const flashIcon= $('play-flash-icon');
  const seekTT   = $('seek-tt');
  const ytProg   = $('yt-progress');
  const loading  = $('player-loading');
  if (!vid) return null;

  let hideTimer, isFs = false;

  function fmt(s){
    if (isNaN(s) || !isFinite(s)) return '0:00';
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = String(Math.floor(s % 60)).padStart(2, '0');
    if (h > 0) return h + ':' + String(m).padStart(2, '0') + ':' + sec;
    return m + ':' + sec;
  }

  function updateVolIcon() {
    if (!volIcon) return;
    const v = vid.volume, m = vid.muted;
    if (m || v === 0) { volIcon.className = 'ph ph-speaker-x'; }
    else if (v < 0.5) { volIcon.className = 'ph ph-speaker-low'; }
    else { volIcon.className = 'ph ph-speaker-high'; }
    if (volSlider) volSlider.value = m ? 0 : v;
  }

  function updatePlayIcon() {
    if (playIcon) {
      playIcon.className = vid.paused ? 'ph ph-play' : 'ph ph-pause';
    }
    if (player) player.classList.toggle('paused', vid.paused);
  }

  function updateFsIcon() {
    if (fsIcon) fsIcon.className = isFs ? 'ph ph-corners-in' : 'ph ph-corners-out';
  }

  function showControls() {
    if (!controls) return;
    controls.classList.add('active');
    clearTimeout(hideTimer);
    if (!vid.paused) hideTimer = setTimeout(() => controls.classList.remove('active'), 3000);
  }

  function flashIconFn(paused) {
    if (!flash || !flashIcon) return;
    flashIcon.className = paused ? 'ph ph-pause' : 'ph ph-play';
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
    setTimeout(() => flash.classList.remove('show'), 500);
  }

  function togglePlay() {
    if (vid.paused) { vid.play().catch(()=>{}); flashIconFn(false); }
    else { vid.pause(); flashIconFn(true); }
    showControls();
  }

  function toggleMute() { vid.muted = !vid.muted; updateVolIcon(); }

  function setVolume(delta) {
    vid.volume = Math.max(0, Math.min(1, vid.volume + delta));
    vid.muted = vid.volume === 0;
    updateVolIcon(); showControls();
  }

  function seekBy(s) {
    vid.currentTime = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + s));
    showControls();
  }

  function toggleFs() {
    if (!isFs) player?.requestFullscreen?.().catch(()=>{});
    else document.exitFullscreen?.().catch(()=>{});
  }

  if (playBtn) playBtn.addEventListener('click', e => { e.stopPropagation(); togglePlay(); });
  if (muteBtn) muteBtn.addEventListener('click', e => { e.stopPropagation(); toggleMute(); });
  if (fsBtn) fsBtn.addEventListener('click', e => { e.stopPropagation(); toggleFs(); });
  if (player) {
    vid.addEventListener('click', togglePlay);
    player.addEventListener('mousemove', showControls);
    player.addEventListener('mouseleave', () => { if (!vid.paused) controls?.classList.remove('active'); });
    player.addEventListener('dblclick', e => { e.stopPropagation(); toggleFs(); });
  }

  vid.addEventListener('play', () => { updatePlayIcon(); showControls(); });
  vid.addEventListener('pause', () => { updatePlayIcon(); controls?.classList.add('active'); clearTimeout(hideTimer); });
  vid.addEventListener('ended', () => { updatePlayIcon(); controls?.classList.add('active'); });
  vid.addEventListener('waiting', () => { if (loading) loading.classList.add('show'); });
  vid.addEventListener('playing', () => { if (loading) loading.classList.remove('show'); });
  vid.addEventListener('canplay', () => { if (loading) loading.classList.remove('show'); });

  vid.addEventListener('timeupdate', () => {
    const pct = vid.duration ? vid.currentTime / vid.duration : 0;
    if (ytInput) ytInput.value = pct * 1000;
    if (ytFill) ytFill.style.width = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left = (pct * 100) + '%';
    if (curTime) curTime.textContent = fmt(vid.currentTime);
    if (durTime) durTime.textContent = fmt(vid.duration);
  });

  vid.addEventListener('progress', () => {
    if (ytBuf && vid.buffered.length && vid.duration) {
      ytBuf.style.width = (vid.buffered.end(vid.buffered.length - 1) / vid.duration * 100) + '%';
    }
  });

  if (ytInput) ytInput.addEventListener('input', () => {
    const pct = ytInput.value / 1000;
    vid.currentTime = pct * vid.duration;
    if (ytFill) ytFill.style.width = (pct * 100) + '%';
    if (ytThumb) ytThumb.style.left = (pct * 100) + '%';
  });

  if (ytProg) {
    ytProg.addEventListener('mousemove', e => {
      const rect = ytProg.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (seekTT) {
        seekTT.textContent = fmt(pct * (vid.duration || 0));
        seekTT.style.left = (pct * 100) + '%';
      }
    });
    ytProg.addEventListener('mouseleave', () => {
      if (seekTT) seekTT.style.opacity = '0';
    });
    ytProg.addEventListener('mouseenter', () => {
      if (seekTT) seekTT.style.opacity = '1';
    });
  }

  if (volSlider) volSlider.addEventListener('input', e => {
    e.stopPropagation();
    vid.volume = parseFloat(volSlider.value);
    vid.muted = vid.volume === 0;
    updateVolIcon();
  });

  document.addEventListener('fullscreenchange', () => {
    isFs = !!document.fullscreenElement;
    player?.classList.toggle('is-fs', isFs);
    updateFsIcon();
    if (!isFs) controls?.classList.add('active');
  });

  updatePlayIcon(); updateVolIcon(); updateFsIcon(); showControls();
  return { togglePlay, toggleMute, toggleFs, seekBy, setVolume };
}

function getModalVideo() {
  return document.querySelector('#vid');
}

function showFeedback(iconClass) {
  const fb = document.getElementById('kb-feedback');
  const icon = document.getElementById('kb-feedback-icon');
  if (!fb || !icon) return;
  icon.className = 'ph ' + iconClass;
  fb.classList.remove('anim');
  void fb.offsetWidth;
  fb.classList.add('anim');
}

function onKey(e) {
  if (!modal.classList.contains('open')) return;

  const hasVideo = !!vp;
  const videoKeys = [' ','k','K','j','J','l','L','m','M','f','F','ArrowUp','ArrowDown'];
  if (hasVideo && videoKeys.includes(e.key) && !e.shiftKey) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();

  switch (e.key) {
    case ' ':
    case 'k': case 'K':
      if (hasVideo) {
        vp.togglePlay();
        const v = getModalVideo();
        showFeedback(v && !v.paused ? 'ph-play' : 'ph-pause');
      }
      break;
    case 'ArrowLeft':
      if (e.shiftKey) { prev(); }
      else if (hasVideo) { vp.seekBy(-5); showFeedback('ph-arrow-left'); }
      break;
    case 'ArrowRight':
      if (e.shiftKey) { next(); }
      else if (hasVideo) { vp.seekBy(5); showFeedback('ph-arrow-right'); }
      break;
    case 'j': case 'J':
      if (hasVideo) { vp.seekBy(-10); showFeedback('ph-skip-back'); }
      break;
    case 'l': case 'L':
      if (hasVideo) { vp.seekBy(10); showFeedback('ph-skip-forward'); }
      break;
    case 'ArrowUp':
      if (hasVideo) {
        vp.setVolume(0.1);
        const v = getModalVideo();
        const vol = v ? v.volume : 0;
        showFeedback(vol === 0 || (v && v.muted) ? 'ph-speaker-x' : vol < 0.5 ? 'ph-speaker-low' : 'ph-speaker-high');
      }
      break;
    case 'ArrowDown':
      if (hasVideo) {
        vp.setVolume(-0.1);
        const v = getModalVideo();
        const vol = v ? v.volume : 0;
        showFeedback(vol === 0 || (v && v.muted) ? 'ph-speaker-x' : vol < 0.5 ? 'ph-speaker-low' : 'ph-speaker-high');
      }
      break;
    case 'm': case 'M':
      if (hasVideo) {
        vp.toggleMute();
        const v = getModalVideo();
        showFeedback(v && v.muted ? 'ph-speaker-x' : 'ph-speaker-high');
      }
      break;
    case 'f': case 'F':
      if (hasVideo) {
        vp.toggleFs();
        showFeedback(document.fullscreenElement ? 'ph-corners-in' : 'ph-corners-out');
      }
      break;
    case '?':
      document.getElementById('shortcuts-panel').classList.toggle('show');
      break;
    case 'a': case 'A':
      toggleAmbient();
      break;
    case 'Escape':
      if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
      else if (document.getElementById('shortcuts-panel').classList.contains('show'))
        document.getElementById('shortcuts-panel').classList.remove('show');
      else closeModal();
      break;
  }
}

window.addEventListener('resize', () => {
  requestAnimationFrame(recalcPerforations);
  resizeAmbient();
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-prev').addEventListener('click', prev);
document.getElementById('modal-next').addEventListener('click', next);

document.getElementById('ambient-btn').addEventListener('click', toggleAmbient);

document.getElementById('shortcuts-btn').addEventListener('click', () => {
  const panel = document.getElementById('shortcuts-panel');
  const isShowing = panel.classList.toggle('show');
  if (window.Motion && !prefersReduced && isShowing) {
    const rows = panel.querySelectorAll('.sc-row');
    Motion.animate(
      rows,
      { opacity: [0, 1], x: [8, 0] },
      { delay: Motion.stagger(0.05), duration: 0.35, easing: [0.16, 1, 0.3, 1] }
    );
  }
});

modal.addEventListener('click', e => {
  if (e.target === modal || e.target.classList.contains('modal-inner')) closeModal();
});

let touchStartX = 0;
modal.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
modal.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) dx < 0 ? next() : prev();
}, { passive: true });

loadProject();
</script>
