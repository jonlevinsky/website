<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio // 2025 — Jan Levínský</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f5;
  --muted:#9aa0a6;
  --accent:#111;
  --card-radius:12px;
  --card-radius-after:20px;
  --gap:16px;
  --transition:0.3s ease-in-out;
}
*{box-sizing:border-box;}
html,body{height:100%; margin:0; padding:0;}
body{
  font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  background:var(--bg);
  color:#0b0b0b;
  display:flex;
  justify-content:space-evenly;
  align-items:stretch;
  padding:16px;
}

.wrap{
  display:grid;
  grid-template-columns: 1fr 3fr;
  gap: var(--gap);
  max-width:1400px;
  width:100%;
  height:100%;
}

.brand{
  padding-left:12px;
}
.kicker{
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.06em;
  margin-bottom:28px;
}
h1{
  margin:0;
  font-weight:800;
  font-size:56px;
  line-height:0.96;
}
h2{
  margin:0 0 16px 0;
  font-weight:200;
  font-size:28px;
}
h2 a{
  cursor: pointer;
  text-decoration:none;
  color:var(--accent);
  margin-right:12px;
}
h2 a.active{
  text-decoration:underline;
}
.intro{
  margin-top:48px;
  color:var(--muted);
  font-size:14px;
  line-height:1.6;
  max-width:330px;
}
.links{margin-top:18px;}
.links a{
  color:var(--accent);
  text-decoration:none;
  margin-right:18px;
  font-weight:500;
  font-size:14px;
}

main{
  display:flex;
  flex-direction:column;
  justify-content: flex-start;
  height: 100%;
  min-height: 0;
  position: relative;
}

/* Loading overlay */
.grid-loading {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.grid-loading.hidden {
  display: none;
}

.loading-spinner {
  width: 48px;
  height: 48px;
  border: 3px solid rgba(0, 0, 0, 0.1);
  border-left-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 16px;
}

.loading-text {
  color: var(--muted);
  font-size: 14px;
  font-weight: 400;
}

/* Grid kontejner */
.grid {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 400px;
}

.tile {
  position: absolute;
  border-radius: var(--card-radius);
  overflow: hidden;
  background:#fff;
  aspect-ratio: 3 / 2;
  cursor:pointer;
  box-shadow: 0px 0px 0px rgba(0, 0, 0, 0.5);
  transition: all 0.8s cubic-bezier(0.4, 0.0, 0.2, 1);
  opacity: 1;
  transform: translate3d(0, 0, 0);
  will-change: transform;
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform var(--transition) !important;
}

.tile .image-placeholder {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: loading-shimmer 1.5s infinite;
}

.tile.hidden {
  opacity: 0;
  transform: scale(0.8) !important;
  pointer-events: none;
  transition: all 0.3s ease-out;
}

.tile.animating {
  z-index: 100;
}

.tile:hover{
  box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
  z-index: 10;
}

.tile:hover img{
  transform: scale(1.1) !important;
}

.tile::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.555), rgba(255,255,255,0));
  pointer-events:none;
  opacity: 0;
  transition: height var(--transition), opacity var(--transition);
}

.tile:hover::after{
  height:40%;
  opacity: 1;
}

.flyout{
  position:absolute;
  z-index: 2;
  bottom:10px;
  left:50%;
  transform: translateX(-50%) scale(0);
  transform-origin: bottom center;
  background: rgba(255, 255, 255, 0.116);
  backdrop-filter: blur(5px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius:16px;
  padding:8px 14px;
  color:#ffffff;
  font-family: Inter;
  font-weight: 100;
  font-size:14px;
  white-space:nowrap;
  pointer-events:none;
  transition: transform var(--transition), opacity var(--transition);
  opacity:0;
}

.tile:hover .flyout{
  transform: translateX(-50%) scale(1);
  opacity:1;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes loading-shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.greeting{display:flex; align-items:flex-start; gap:10px; margin-top:24px;}
.greeting .emoji{font-size:20px;}

/* RESPONZIVITA */
@media (max-width:1024px){
  .wrap{ grid-template-columns:1fr 2fr; }
  h1{font-size:48px;}
}

@media (max-width:880px){
  body{ padding:12px; }
  .wrap{ grid-template-columns:1fr; gap:24px; }
  h1{font-size:44px;} h2{font-size:24px;}
  .intro{ max-width:100%; }
  .brand { padding-left: 0; }
}

@media (max-width:640px){
  body{ padding:12px; }
  .wrap{ gap:20px; }
  .brand{ padding-left:0; }
  .kicker{ font-size:12px; margin-bottom:16px; }
  h1{ font-size:36px; line-height:1.1; }
  h2{ font-size:20px; margin-bottom:12px; }
  h2 a{ margin-right:8px; font-size:16px; }
  .intro{ margin-top:24px; font-size:13px; }
  .greeting{ margin-top:16px; }
}

@media (max-width:480px){
  body{ padding:10px; }
  .wrap{ gap:16px; }
  h1{ font-size:32px; }
  h2{ font-size:18px; }
  .flyout{ font-size:12px; padding:6px 12px; }
}

@media (max-width:360px){
  h1{ font-size:28px; }
  h2{ font-size:16px; }
  h2 a{ font-size:14px; }
  .intro{ font-size:12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="brand">
    <div class="kicker">PORTFOLIO // 2025</div>
    <h1>Jan<br/>Levínský</h1>
    <div class="intro">
      <div class="greeting">
        <div class="emoji">👋</div>
        <div>I am Honza — a multimedia creator with passion for tech, nature and everything in between.</div>
      </div>
    </div>
  </aside>

  <main>
    <h2>
      <a data-group="all" class="active">All</a> / 
      <a data-group="photo">Photo</a> / 
      <a data-group="video">Video</a>
    </h2>
    
    <div class="grid-loading" id="gridLoading">
      <div class="loading-spinner"></div>
      <div class="loading-text">Načítám projekty...</div>
    </div>
    
    <section class="grid" id="grid"></section>
  </main>
</div>

<script>
let currentGroup = 'all';
let resizeTimeout;

// PRO GITHUB PAGES - JEDNODUCHÉ A SPOLEHLIVÉ ŘEŠENÍ

// 1. Základní načítání obrázků
function loadImage(img, placeholder) {
  return new Promise((resolve) => {
    img.onload = () => {
      if (placeholder) placeholder.style.display = 'none';
      resolve(true);
    };
    img.onerror = () => {
      if (placeholder) placeholder.style.display = 'none';
      resolve(false);
    };
  });
}

// 2. Jednoduchý video thumbnail (pouze jako fallback)
function getVideoThumbnail(videoSrc) {
  return new Promise((resolve) => {
    const video = document.createElement('video');
    video.src = videoSrc;
    video.crossOrigin = 'anonymous';
    video.currentTime = 2;
    video.muted = true;
    
    const onSuccess = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 400; // Přiměřená velikost pro web
      canvas.height = 266;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.8));
    };
    
    video.addEventListener('loadeddata', onSuccess);
    video.addEventListener('error', () => resolve('placeholder.jpg'));
    
    // Rychlý timeout
    setTimeout(() => resolve('placeholder.jpg'), 2000);
  });
}

// 3. Hlavní funkce - optimalizovaná pro GitHub Pages
async function initPortfolio() {
  const grid = document.getElementById('grid');
  const gridLoading = document.getElementById('gridLoading');

  try {
    // Načtení JSON
    const response = await fetch('./projects.json');
    if (!response.ok) throw new Error('JSON se nenačetl');
    
    const projects = await response.json();
    projects.sort(() => Math.random() - 0.5);
    
    let loadedCount = 0;
    const totalProjects = projects.length;
    
    // Rychlé vytvoření všech tile
    for (const project of projects) {
      let thumbnailSrc = project.thumbnail;
      let needsVideoThumbnail = false;

      // Zjistíme zdroj thumbnailu
      if (!thumbnailSrc && project.media?.[0]) {
        const firstMedia = project.media[0];
        if (firstMedia.type === 'photo') {
          thumbnailSrc = firstMedia.src;
        } else if (firstMedia.type === 'video') {
          needsVideoThumbnail = true;
        }
      }
      
      if (!thumbnailSrc) thumbnailSrc = 'placeholder.jpg';

      // Vytvoření tile
      const a = document.createElement('a');
      a.href = `project.html?id=${project.id}`;
      a.className = 'tile';
      a.dataset.type = project.type;
      a.dataset.id = project.id;

      a.innerHTML = `
        <div class="image-placeholder"></div>
        <img src="" alt="${project.title}" loading="lazy">
        <div class="flyout">${project.title}</div>
      `;

      grid.appendChild(a);
      
      // Optimalizované načítání obrázku
      const loadImageForTile = async () => {
        try {
          let finalSrc = thumbnailSrc;
          
          if (needsVideoThumbnail) {
            finalSrc = await getVideoThumbnail(project.media[0].src);
          }
          
          const img = a.querySelector('img');
          const placeholder = a.querySelector('.image-placeholder');
          
          img.src = finalSrc;
          await loadImage(img, placeholder);
          
        } catch (error) {
          console.warn('Chyba při načítání thumbnailu:', error);
        } finally {
          loadedCount++;
          updateLoadingProgress(loadedCount, totalProjects);
        }
      };
      
      // Spustíme načítání s malým zpožděním pro lepší UX
      setTimeout(loadImageForTile, loadedCount * 100);
    }
    
    // Okamžitě zobrazíme grid a skryjeme loading po krátké době
    setTimeout(() => {
      gridLoading.classList.add('hidden');
      updateLayout(false);
      initEventListeners();
    }, 1500);
    
    // Fallback - vždy skrýt loading po 5s
    setTimeout(() => {
      gridLoading.classList.add('hidden');
    }, 5000);

  } catch (error) {
    console.error('Chyba:', error);
    gridLoading.classList.add('hidden');
    grid.innerHTML = `
      <div style="text-align: center; padding: 40px; color: var(--muted);">
        <p>Nepodařilo se načíst projekty</p>
        <small>Zkontrolujte soubor projects.json</small>
      </div>
    `;
  }
}

function updateLoadingProgress(loaded, total) {
  const progress = (loaded / total) * 100;
  const loadingText = document.querySelector('.loading-text');
  if (loadingText) {
    loadingText.textContent = `Načítám projekty... ${Math.round(progress)}%`;
  }
}

// Zbývající funkce zůstávají stejné
function getGridColumns() {
  const width = window.innerWidth;
  if (width <= 480) return 1;
  if (width <= 880) return 2;
  return 3;
}

function getTileDimensions() {
  const grid = document.getElementById('grid');
  const columns = getGridColumns();
  const gap = 16;
  const containerWidth = grid.clientWidth;
  const availableWidth = containerWidth - (gap * (columns - 1));
  const tileWidth = availableWidth / columns;
  const tileHeight = tileWidth * (2/3);
  
  return { tileWidth, tileHeight, gap, columns };
}

function calculatePositions(visibleTiles) {
  const { tileWidth, tileHeight, gap, columns } = getTileDimensions();
  const positions = new Map();
  
  visibleTiles.forEach((tile, index) => {
    const col = index % columns;
    const row = Math.floor(index / columns);
    
    const x = col * (tileWidth + gap);
    const y = row * (tileHeight + gap);
    
    positions.set(tile, { x, y, width: tileWidth, height: tileHeight });
  });
  
  return positions;
}

function updateLayout(animate = true) {
  const grid = document.getElementById('grid');
  const allTiles = Array.from(document.querySelectorAll('.tile'));
  const visibleTiles = allTiles.filter(tile => 
    currentGroup === 'all' || tile.dataset.type === currentGroup
  );

  const currentPositions = new Map();
  if (animate) {
    allTiles.forEach(tile => {
      const rect = tile.getBoundingClientRect();
      const gridRect = grid.getBoundingClientRect();
      currentPositions.set(tile, {
        x: rect.left - gridRect.left,
        y: rect.top - gridRect.top,
        width: rect.width
      });
    });
  }

  const newPositions = calculatePositions(visibleTiles);

  if (animate) {
    allTiles.forEach(tile => {
      const currentPos = currentPositions.get(tile);
      if (currentPos) {
        tile.style.transform = `translate3d(${currentPos.x}px, ${currentPos.y}px, 0)`;
        tile.style.width = `${currentPos.width}px`;
      }
      tile.classList.add('animating');
    });

    grid.offsetHeight;
  }

  requestAnimationFrame(() => {
    visibleTiles.forEach(tile => {
      const newPos = newPositions.get(tile);
      if (newPos) {
        tile.style.transform = `translate3d(${newPos.x}px, ${newPos.y}px, 0)`;
        tile.style.width = `${newPos.width}px`;
        tile.style.height = `${newPos.height}px`;
        tile.classList.remove('hidden');
      }
    });

    allTiles.forEach(tile => {
      if (!visibleTiles.includes(tile)) {
        tile.classList.add('hidden');
      }
    });
  });

  if (animate) {
    setTimeout(() => {
      allTiles.forEach(tile => {
        tile.classList.remove('animating');
      });
    }, 800);
  }
}

function filterProjects(group) {
  currentGroup = group;
  updateLayout(true);
}

function initEventListeners() {
  const links = document.querySelectorAll('h2 a');
  links.forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      const group = link.dataset.group;

      links.forEach(a => a.classList.remove('active'));
      link.classList.add('active');

      filterProjects(group);
    });
  });

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      updateLayout(true);
    }, 250);
  });
}

// Start
initPortfolio();
</script>
</body>
</html>
