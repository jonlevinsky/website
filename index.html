<style>
.greeting-row { display: flex; align-items: flex-start; gap: 9px; }
.greeting-row .emoji { font-size: 15px; margin-top: 3px; flex-shrink: 0; }

.filter-row {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 20px;
  position: relative;
}

.filter-pill-bg {
  position: absolute;
  height: 30px;
  background: var(--accent-subtle);
  border: 1px solid rgba(196, 149, 106, 0.2);
  border-radius: 100px;
  pointer-events: none;
  z-index: 0;
}

.filter-row a {
  position: relative;
  z-index: 1;
  cursor: pointer;
  text-decoration: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 100px;
  transition: color 0.3s ease;
  user-select: none;
  white-space: nowrap;
}

.filter-row a:first-child { padding-left: 8px; }
.filter-row a.active { color: var(--accent); }
.sep { color: var(--muted); font-size: 12px; opacity: 0.3; padding: 0 2px; user-select: none; }

.bento { contain: layout;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 220px;
  grid-auto-flow: dense;
  gap: 14px;
  width: 100%;
}

.tile {
  position: relative;
  background: var(--surface);
  overflow: hidden;
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: transform 0.6s var(--ease-out-expo), border-color 0.5s var(--ease-out-expo), box-shadow 0.6s var(--ease-out-expo);
  will-change: transform;
  border: 1px solid var(--border);
  min-height: 220px;
}

.tile.wide { grid-column: span 2; min-height: 220px; }
.tile.tall { grid-row: span 2; min-height: auto; }
.tile.large { grid-column: span 2; grid-row: span 2; min-height: auto; }

.tile:hover, .tile:focus-visible {
  transform: translateY(-8px);
  border-color: var(--accent);
  box-shadow: 0 20px 38px rgba(28, 25, 23, 0.15), 0 8px 16px rgba(28, 25, 23, 0.08);
  z-index: 2;
}

.tile .px-wrap {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  overflow: hidden;
}

.tile img, .tile video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s var(--ease-out-expo), opacity 0.5s var(--ease-out-expo);
  will-change: transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}
.tile img {
  opacity: 0;
}

.tile:hover img, .tile:focus-visible img,
.tile:hover video, .tile:focus-visible video {
  transform: scale(1.05) translateZ(0);
}
.tile img.loaded { opacity: 1; }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--surface) 25%, var(--bg-raised) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.tile.skeleton::before { opacity: 1; }
.tile img, .tile video { position: relative; z-index: 1; }

/* Cinematic dark overlay */
.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(0, 0, 0, 0) 0%,
    rgba(0, 0, 0, 0.35) 50%,
    rgba(0, 0, 0, 0.8) 100%
  );
  opacity: 0;
  transition: opacity 0.6s var(--ease-out-expo);
  pointer-events: none;
  z-index: 2;
}
.tile:hover::after, .tile:focus-visible::after {
  opacity: 1;
}

/* Hover info */
.tile-hover {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  opacity: 0;
  transition: opacity 0.5s var(--ease-out-expo);
}

.tile:hover .tile-hover { opacity: 1; }

.tile-hover-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: #fff;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  letter-spacing: -0.01em;
  max-width: 80%;
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.5s var(--ease-out-expo), transform 0.5s var(--ease-out-expo);
}

.tile:hover .tile-hover-title { opacity: 1; transform: translateY(0); }

.tile-hover-year {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.5s 0.08s var(--ease-out-expo), transform 0.5s 0.08s var(--ease-out-expo);
}

.tile:hover .tile-hover-year { opacity: 1; transform: translateY(0); }

/* Film perforations - horizontal (photo) */
.film-perf-h {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  opacity: 1;
  transition: opacity 0.5s var(--ease-out-expo);
  left: 3.5%;
  right: 3.5%;
  height: calc(var(--perf-dot-height, 8%) + 2%);
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-h.top { top: 2.5%; }
.film-perf-h.bottom { bottom: 2.5%; }

.film-perf-h .perf-dot {
  width: var(--perf-dot-width, 1.2%);
  height: var(--perf-dot-height, 8%);
  border-radius: 999px;
  background: var(--bg);
  flex-shrink: 0;
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.6),
    1px 1px 3px rgba(0,0,0,0.25),
    inset 2px 2px 4px rgba(0,0,0,0.45),
    inset -1px -1px 2px rgba(255,255,255,0.15);
  transition: transform 0.5s var(--ease-out-expo), box-shadow 0.5s var(--ease-out-expo);
}

.tile:hover .film-perf-h { opacity: 1; }
.tile:hover .perf-dot {
  box-shadow:
    -0.5px -0.5px 1px rgba(255,255,255,0.7),
    0.5px 0.5px 2px rgba(0,0,0,0.3),
    inset 3.5px 3.5px 6px rgba(0,0,0,0.6),
    inset -1px -1px 2px rgba(255,255,255,0.25);
}

/* Film key legend */
.film-key-wrap {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  opacity: 0;
  animation: fadeUp 0.7s 0.5s var(--ease-out-expo) forwards;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.film-key-toggle {
  width: 28px; height: 28px;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: opacity 0.3s ease, border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  opacity: 0.5; cursor: pointer; padding: 0; flex-shrink: 0;
}
.film-key-toggle:hover { opacity: 1; border-color: var(--accent); color: var(--accent); }
.film-key-toggle.active { opacity: 1; border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }

.film-key {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-6px);
  transition: max-height 0.45s var(--ease-out-expo), opacity 0.35s ease, transform 0.35s var(--ease-out-expo), padding 0.35s ease;
  padding-top: 0;
}

.film-key.open {
  max-height: 120px;
  opacity: 1;
  transform: translateY(0);
  padding-top: 6px;
}

.film-key-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.film-key-strip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
  flex-shrink: 0;
}

.film-key-strip-h { width: 26px; height: 9px; padding: 0 3px; }
.film-key-strip-v { width: 9px; height: 26px; flex-direction: column; padding: 3px 0; }

.film-key-strip .perf {
  display: block;
  background: var(--bg);
  border-radius: 999px;
  box-shadow:
    -0.5px -0.5px 1px rgba(255,255,255,0.5),
    0.5px 0.5px 1.5px rgba(0,0,0,0.2),
    inset 1px 1px 2px rgba(0,0,0,0.35),
    inset -0.5px -0.5px 1px rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.film-key-strip-h .perf { width: 4.5px; height: 3px; }
.film-key-strip-v .perf { width: 3px; height: 4.5px; }

.film-key-row span {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.4;
}

@media (max-width: 1024px) {
  .bento { contain: layout; grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 880px) {
  .bento { contain: layout; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  .tile.wide, .tile.large { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
  .film-key-wrap { margin-top: 24px; border-top: none; padding-top: 0; margin-left: 2px; }
  .film-key.open { flex-direction: row; gap: 16px; padding-top: 6px; }
}

@media (max-width: 640px) {
  .bento { contain: layout; grid-template-columns: 1fr; grid-auto-rows: 240px; }
  .tile.wide { grid-column: span 1; grid-row: span 1; }
  .tile.tall, .tile.large { grid-column: span 1; grid-row: span 2; }
  .filter-row a { font-size: 11px; padding: 5px 10px; }
  .tile-hover {
    position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 0;
    transform: none !important; opacity: 1 !important; pointer-events: none;
    align-items: flex-start; justify-content: flex-end;
  }
  .tile-hover-title {
    font-size: 16px; white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
    text-align: left; opacity: 1; transform: none; max-width: 100%;
  }
  .tile-hover-year { font-size: 10px; opacity: 1; transform: none; }
  .tile::after { opacity: 0.35; }
  .tile .film-shadow { display: none !important; }
  .film-perf-h, .film-perf-v { display: none !important; }
  .film-key-wrap { display: none; }
  }

  @media (max-width: 400px) {
    .bento { grid-auto-rows: 200px; }
  }

  /* CENÍK MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-in-out);
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: var(--bg);
    border-radius: var(--r-xl);
    max-width: 620px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 44px 44px 40px;
    position: relative;
    box-shadow: 0 24px 80px rgba(0,0,0,0.2);
    transform: translateY(20px) scale(0.97);
    transition: transform 0.45s var(--ease-out-expo);
  }
  .modal-overlay.open .modal {
    transform: translateY(0) scale(1);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: var(--r-full);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    cursor: pointer;
    transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .modal-close:hover {
    background: var(--surface-raised);
    border-color: var(--accent);
    color: var(--accent);
  }
  .modal-title {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 4px;
  }
  .modal-sub {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .pricing-section {
    margin-bottom: 28px;
  }
  .pricing-section:last-of-type {
    margin-bottom: 0;
  }
  .pricing-section h3 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .pricing-section h3 i {
    color: var(--accent);
    font-size: 18px;
    opacity: 0.7;
  }
  .pricing-item {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 9px 0;
    border-bottom: 1px solid var(--border-subtle);
    gap: 16px;
  }
  .pricing-item:last-child {
    border-bottom: none;
  }
  .pricing-item-label {
    font-size: 13.5px;
    color: var(--text);
    flex-shrink: 0;
  }
  .pricing-item-dash {
    flex: 1;
    height: 1px;
    border-bottom: 1px dotted var(--border);
    min-width: 16px;
  }
  .pricing-item-value {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    font-family: var(--serif);
  }
  .pricing-note {
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.7;
    text-wrap: balance;
  }
  .pricing-note a {
    color: var(--accent);
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease;
  }
  .pricing-note a:hover {
    border-color: var(--accent);
  }

  @media (max-width: 640px) {
    .modal { padding: 32px 24px 28px; border-radius: var(--r-lg); }
    .modal-title { font-size: 22px; }
    .pricing-item { flex-wrap: wrap; gap: 4px; }
    .pricing-item-dash { display: none; }
    .pricing-item-value { margin-left: auto; }
  }

</style>

<script>
let currentGroup = 'all';

document.getElementById('currentYear').textContent = new Date().getFullYear();

prepareHero();

document.addEventListener('DOMContentLoaded', () => {
  initHeroAnim();
  ensureGsap();
});

function updateFilterPill(animate = false) {
  const row = document.getElementById('filterRow');
  const pill = document.getElementById('filterPill');
  const active = row.querySelector('a.active');
  if (!active) return;
  const rowRect = row.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  const targetLeft = aRect.left - rowRect.left;
  const targetWidth = aRect.width;
  const targetTop = ((aRect.top - rowRect.top) + (aRect.height - 30) / 2);

  if (animate && window.Motion && !prefersReduced) {
    Motion.animate(pill, {
      left: targetLeft,
      width: targetWidth,
      top: targetTop
    }, { type: 'spring', stiffness: 420, damping: 34, mass: 0.9 });
  } else {
    pill.style.width = targetWidth + 'px';
    pill.style.left = targetLeft + 'px';
    pill.style.top = targetTop + 'px';
  }
}

async function initPortfolio() {
  const grid = document.getElementById('grid');

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('JSON failed');
    let projects = await res.json();

    const imagePromises = [];

    for (const [idx, project] of projects.entries()) {
      let thumbnailSrc = project.thumbnail || '';
      let lqipSrc = null;
      if (!thumbnailSrc && project.media && project.media[0]) {
        const m = project.media[0];
        if (m.type === 'photo') thumbnailSrc = m.thumbnail || m.src;
        if (m.lqip) lqipSrc = m.lqip;
      }
      // Prefer project-level thumbnail LQIP if available
      if (project.lqip) lqipSrc = project.lqip;

      let projectAspect = null;
      if (project.media) {
        const matchingMedia = project.media.find(m => (m.thumbnail || m.src) === thumbnailSrc);
        if (matchingMedia && matchingMedia.aspect_ratio) {
          projectAspect = matchingMedia.aspect_ratio;
        } else if (project.media[0] && project.media[0].aspect_ratio) {
          projectAspect = project.media[0].aspect_ratio;
        }
      }

      const a = document.createElement('a');
      a.href = 'project.html?id=' + project.id;
      a.className = 'tile ' + (project.layout || 'normal') + ' ' + (project.type === 'video' ? 'video-tile' : 'photo-tile');
      a.dataset.type = project.type;
      a.dataset.id = project.id;
      a.setAttribute('role', 'button');
      a.setAttribute('tabindex', '0');
      a.setAttribute('aria-label', 'Prohlédnout projekt ' + project.title);
      a.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          a.click();
        }
      });

      const isVideo = project.type === 'video';
      const layout = project.layout || 'normal';
      const filmSizes = {
        photo: {
          normal: { width: 36, height: 24 },
          wide: { width: 42.7, height: 24 },
          tall: { width: 13.5, height: 24 }
        },
        video: {
          normal: { width: 24, height: 18.6 },
          wide: { width: 24, height: 14 },
          tall: { width: 24, height: 44.2 }
        }
      };
      const hole = { width: 2.79, height: 1.98, pitch: 4.75 };
      const frame = filmSizes[isVideo ? 'video' : 'photo'][layout] || filmSizes[isVideo ? 'video' : 'photo'].normal;
      const edgeLength = isVideo ? frame.height : frame.width;
      const count = Math.max(2, Math.round(edgeLength / hole.pitch));

      a.dataset.perfType = isVideo ? 'video' : 'photo';
      a.dataset.perfFrameWidth = frame.width;
      a.dataset.perfFrameHeight = frame.height;
      a.dataset.perfHoleWidth = hole.width;
      a.dataset.perfHoleHeight = hole.height;
      a.dataset.perfCount = count;
      a.dataset.src = (project.media && project.media[0] && project.media[0].src) ? project.media[0].src : '';

      const perfHtml = isVideo 
        ? '<div class="film-perf-v left">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-v right">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>'
        : '<div class="film-perf-h top">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-h bottom">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>';

      a.innerHTML = '<div class="film-shadow"></div>' + perfHtml +
        '<div class="tile-hover">' + 
          '<div class="tile-hover-title">' + project.title + '</div>' +
          (project.year ? '<div class="tile-hover-year">' + project.year + '</div>' : '') +
        '</div>';

      a.classList.add('skeleton');
      a.style.opacity = '0';
      a.style.transform = 'translateY(16px)';
      grid.appendChild(a);

      const rect = a.getBoundingClientRect();
      const pitchPx = isVideo ? (hole.pitch / frame.height) * rect.height : (hole.pitch / frame.width) * rect.width;
      const dotWidthPx = (hole.width / frame.width) * rect.width;
      const dotHeightPx = (hole.height / frame.height) * rect.height;

      const gapForH = Math.max(1, pitchPx - dotWidthPx);
      const gapForV = Math.max(1, pitchPx - dotHeightPx);

      a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
      a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

      const perfHTop = a.querySelector('.film-perf-h.top');
      const perfHBottom = a.querySelector('.film-perf-h.bottom');
      const perfVLeft = a.querySelector('.film-perf-v.left');
      const perfVRight = a.querySelector('.film-perf-v.right');

      if (perfHTop || perfHBottom) {
        const containerW = (count * dotWidthPx) + ((count - 1) * gapForH);
        [perfHTop, perfHBottom].forEach(el => {
          if (!el) return;
          el.style.width = Math.round(containerW) + 'px';
          el.style.left = '50%';
          el.style.transform = 'translateX(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForH) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      if (perfVLeft || perfVRight) {
        const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
        [perfVLeft, perfVRight].forEach(el => {
          if (!el) return;
          el.style.height = Math.round(containerH) + 'px';
          el.style.top = '50%';
          el.style.transform = 'translateY(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForV) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      const imgPromise = new Promise(resolve => {
        const pxWrap = document.createElement('div');
        pxWrap.className = 'px-wrap';
        pxWrap.setAttribute('string', 'parallax');
        pxWrap.setAttribute('string-parallax', '0.05');

        // LQIP placeholder background
        if (lqipSrc) {
          const lqipDiv = document.createElement('div');
          lqipDiv.className = 'lqip-bg';
          lqipDiv.style.backgroundImage = 'url(' + lqipSrc + ')';
          pxWrap.appendChild(lqipDiv);
        }

        const img = document.createElement('img');
        img.src = thumbnailSrc ? encodeURI(thumbnailSrc) : '';
        img.alt = project.title || '';
        img.loading = idx < 3 ? 'eager' : 'lazy';
        img.decoding = 'async';
        if (projectAspect) {
          img.style.aspectRatio = projectAspect;
        } else {
          const tileRect = a.getBoundingClientRect();
          if (tileRect.width && tileRect.height) {
            img.width = Math.round(tileRect.width);
            img.height = Math.round(tileRect.height);
            img.style.aspectRatio = tileRect.width / tileRect.height;
          }
        }
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.opacity = '0';
        img.style.transition = 'opacity 0.4s ease';

        img.onload = () => {
          img.classList.add('loaded');
          requestAnimationFrame(() => {
            img.style.opacity = '1';
            setTimeout(() => {
              a.classList.remove('skeleton');
            }, 600);
          });
          resolve();
        };
        img.onerror = () => {
          a.classList.remove('skeleton');
          resolve();
        };
        pxWrap.appendChild(img);
        a.insertBefore(pxWrap, a.firstChild);
      });
      imagePromises.push(imgPromise);
    }

    const tiles = Array.from(document.querySelectorAll('.tile'));
    if (window.Motion && !prefersReduced) {
      Motion.animate(
        tiles,
        { opacity: [0, 1], y: [16, 0] },
        { delay: Motion.stagger(0.06), duration: 0.6, easing: [0.22, 1, 0.36, 1] }
      ).finished.then(() => {
        tiles.forEach(t => { t.style.opacity = ''; t.style.transform = ''; });
      }).catch(() => {});
    } else {
      tiles.forEach((t, i) => {
        setTimeout(() => {
          t.style.opacity = '1';
          t.style.transform = 'translateY(0)';
          if (i === tiles.length - 1) {
            setTimeout(() => {
              tiles.forEach(tile => {
                tile.style.opacity = '';
                tile.style.transform = '';
              });
            }, 100);
          }
        }, prefersReduced ? 0 : i * 70);
      });
    }

    initEventListeners();
    initScrollAnimations();
    setTimeout(() => { updateFilterPill(); recalcPerforations(); }, 50);

  } catch(err) {
    console.error(err);
    grid.innerHTML = '<div style="padding:40px;color:var(--muted);font-size:13px;">Failed to load projects.json</div>';
  }
}

document.getElementById('filmKeyToggle').addEventListener('click', function() {
  const panel = document.getElementById('filmKeyPanel');
  const isOpen = panel.classList.toggle('open');
  this.classList.toggle('active', isOpen);
  this.setAttribute('aria-expanded', isOpen);
  panel.setAttribute('aria-hidden', !isOpen);

  if (window.Motion && !prefersReduced) {
    Motion.animate(this.querySelector('i'), { rotate: isOpen ? 90 : 0 }, { type: 'spring', stiffness: 320, damping: 22 });
    if (isOpen) {
      const rows = panel.querySelectorAll('.film-key-row');
      Motion.animate(
        rows,
        { opacity: [0, 1], x: [-8, 0] },
        { delay: Motion.stagger(0.09), duration: 0.45, easing: [0.22, 1, 0.36, 1] }
      );
    }
  }
});

function initEventListeners() {
  document.querySelectorAll('.filter-row a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.filter-row a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      updateFilterPill(true);
      currentGroup = link.dataset.group;
      filterTiles();
    });
    link.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        link.click();
      }
    });
  });

  window.addEventListener('resize', () => {
    requestAnimationFrame(updateFilterPill);
    requestAnimationFrame(recalcPerforations);
  });
}

const SMOOTH_EASE = 'power3.out';

function filterTiles() {
  const tiles = Array.from(document.querySelectorAll('.tile'));

  const visible = [];
  const hidden = [];
  tiles.forEach(t => {
    const match = currentGroup === 'all' || t.dataset.type === currentGroup;
    (match ? visible : hidden).push(t);
  });

  const useFlip = ensureGsap() && typeof Flip !== 'undefined' && !prefersReduced;

  if (!useFlip) {
    tiles.forEach(t => {
      const match = visible.includes(t);
      t.style.display = match ? '' : 'none';
      t.style.opacity = match ? '1' : '0';
      t.style.transform = '';
    });
    recalcPerforations();
    return;
  }

  const previouslyVisible = tiles.filter(t => t.style.display !== 'none');
  const state = Flip.getState(previouslyVisible);

  hidden.forEach(t => { t.style.display = 'none'; t.style.opacity = '0'; });
  visible.forEach(t => { t.style.display = ''; });

  tiles.forEach(t => { t.style.transition = 'none'; t.style.willChange = 'transform, opacity'; });

  Flip.from(state, {
    duration: 0.65,
    ease: 'power3.out',
    scale: false,
    absolute: false,
    stagger: 0.015,
    onComplete: () => {
      tiles.forEach(t => {
        gsap.set(t, { clearProps: 'transform,opacity' });
        t.style.transform = '';
        t.style.willChange = '';
        t.style.transition = '';
      });
      recalcPerforations();
    }
  });
}

function initScrollAnimations() {
  const footer = document.querySelector('.g-footer');
  if (!footer || prefersReduced) return;
  if (!ensureGsap() || typeof ScrollTrigger === 'undefined') return;
  const targets = footer.querySelectorAll('.f-name, .f-role, .f-contact');
  gsap.set(targets, { opacity: 0, y: 12 });
  gsap.to(targets, {
    opacity: 1,
    y: 0,
    duration: 0.6,
    ease: SMOOTH_EASE,
    stagger: 0.08,
    scrollTrigger: { trigger: footer, start: 'top 90%', once: true },
    onComplete: () => gsap.set(targets, { clearProps: 'transform' })
  });
}

const logoEl = document.querySelector('.logo-mark');
if (logoEl) {
  logoEl.addEventListener('animationend', function() {
    this.classList.add('anim-done');
  });
}

initPortfolio();
</script>
