<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio // 2025 — Jan Levínský</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0ed;
  --bg2:#e8e5e0;
  --muted:#9a9590;
  --accent:#1a1814;
  --accent2:#5c4f3a;
  --card-radius:16px;
  --gap:14px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --transition: 0.4s var(--ease-in-out);
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;padding:0;}

body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg);
  color:var(--accent);
  display:flex;
  justify-content:center;
  align-items:stretch;
  padding:24px;
  min-height:100vh;
}

/* Grain */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;
  z-index:9999;
  opacity:0.5;
}

.wrap{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:32px;
  max-width:1420px;
  width:100%;
}

/* ── SIDEBAR ── */
.brand{
  padding:4px 0 0;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:24px;
  height:fit-content;
}

.kicker{
  font-size:10px;
  font-weight:500;
  color:var(--muted);
  letter-spacing:0.18em;
  text-transform:uppercase;
  margin-bottom:30px;
  opacity:0;
  animation:fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;
}

h1{
  margin:0;
  font-family:'DM Serif Display',Georgia,serif;
  font-weight:400;
  font-size:60px;
  line-height:0.9;
  letter-spacing:-0.015em;
  opacity:0;
  animation:fadeUp 0.8s 0.15s var(--ease-out-expo) forwards;
}

h1 span{display:block;}
h1 .last{
  font-style:italic;
  color:var(--accent2);
}

.divider{
  width:28px;
  height:1.5px;
  background:var(--accent2);
  margin:26px 0;
  opacity:0;
  animation:fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}

.intro{
  color:var(--muted);
  font-size:13px;
  line-height:1.75;
  font-weight:300;
  opacity:0;
  animation:fadeUp 0.7s 0.3s var(--ease-out-expo) forwards;
}

.greeting-row{
  display:flex;
  align-items:flex-start;
  gap:9px;
}
.greeting-row .emoji{font-size:15px;margin-top:3px;flex-shrink:0;}

.links{
  margin-top:32px;
  display:flex;
  flex-direction:column;
  gap:9px;
  opacity:0;
  animation:fadeUp 0.7s 0.38s var(--ease-out-expo) forwards;
}

.links a{
  color:var(--accent2);
  text-decoration:none;
  font-size:12.5px;
  font-weight:500;
  letter-spacing:0.03em;
  display:inline-flex;
  align-items:center;
  gap:5px;
  transition:color 0.25s, gap 0.3s var(--ease-out-expo);
  width:fit-content;
}

.links a .arrow{
  font-size:11px;
  opacity:0.55;
  transition:opacity 0.25s, transform 0.3s var(--ease-out-expo);
  display:inline-block;
}

.links a:hover{color:var(--accent);gap:9px;}
.links a:hover .arrow{opacity:1;transform:translate(1px,-1px);}

/* ── MAIN ── */
main{
  display:flex;
  flex-direction:column;
  opacity:0;
  animation:fadeIn 0.9s 0.2s var(--ease-out-expo) forwards;
}

.filter-row{
  display:flex;
  align-items:center;
  gap:2px;
  margin-bottom:18px;
  position:relative;
}

.filter-pill-bg{
  position:absolute;
  height:30px;
  background:rgba(26,24,20,0.08);
  border-radius:100px;
  transition:all 0.35s var(--ease-out-expo);
  pointer-events:none;
  z-index:0;
}

.filter-row a{
  position:relative;
  z-index:1;
  cursor:pointer;
  text-decoration:none;
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  letter-spacing:0.09em;
  text-transform:uppercase;
  padding:6px 14px;
  border-radius:100px;
  transition:color 0.25s ease;
  user-select:none;
  white-space:nowrap;
}

.filter-row a:first-child{padding-left:8px;}
.filter-row a.active{color:var(--accent);}
.sep{color:var(--muted);font-size:12px;opacity:0.3;padding:0 2px;user-select:none;}

/* Grid Loading */
.grid-loading{
  position:absolute;
  inset:0;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:100;
  transition:opacity 0.5s ease, visibility 0s 0.5s;
  visibility:visible;
  min-height:300px;
}

.grid-loading.hidden{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

.loading-ring{
  width:32px;
  height:32px;
  border-radius:50%;
  border:2px solid var(--bg2);
  border-top-color:var(--accent2);
  animation:spin 0.85s linear infinite;
  margin-bottom:12px;
}

.loading-text{
  color:var(--muted);
  font-size:11.5px;
  letter-spacing:0.07em;
  font-weight:400;
}

/* Grid */
.grid{
  position:relative;
  width:100%;
  min-height:400px;
}

/* Tiles start invisible, shown after layout is calculated */
.tile{
  position:absolute;
  border-radius:var(--card-radius);
  overflow:hidden;
  background:var(--bg2);
  aspect-ratio:3/2;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,0.07), 0 0 0 1px rgba(0,0,0,0.04);
  transition:
    transform 0.7s var(--ease-out-expo),
    width 0.7s var(--ease-out-expo),
    height 0.7s var(--ease-out-expo),
    box-shadow 0.35s ease,
    opacity 0.35s ease;
  will-change:transform,width,height;
  text-decoration:none;
  display:block;
  opacity:0; /* hidden until positioned */
}

.tile img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform 0.6s var(--ease-out-expo);
}

.image-placeholder{
  position:absolute;
  inset:0;
  background:linear-gradient(105deg,var(--bg2) 0%,#dedad3 50%,var(--bg2) 100%);
  background-size:200% 100%;
  animation:shimmer 1.8s infinite;
}

.tile.hidden{
  opacity:0 !important;
  pointer-events:none;
}

.tile:hover{
  box-shadow:0 10px 40px rgba(0,0,0,0.18), 0 2px 8px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.06);
  z-index:10;
}

.tile:hover img{transform:scale(1.07);}

/* Overlay gradient */
.tile::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(12,9,6,0.78) 0%,rgba(12,9,6,0.22) 38%,transparent 62%);
  opacity:0;
  transition:opacity 0.4s var(--ease-in-out);
  pointer-events:none;
}

.tile:hover::after{opacity:1;}

/* Badge */
.tile-badge{
  position:absolute;
  top:11px;
  right:11px;
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(10px) saturate(180%);
  -webkit-backdrop-filter:blur(10px) saturate(180%);
  border:1px solid rgba(255,255,255,0.28);
  border-radius:100px;
  padding:3px 9px;
  font-size:9.5px;
  font-weight:600;
  letter-spacing:0.1em;
  text-transform:uppercase;
  color:rgba(255,255,255,0.88);
  opacity:0;
  transform:translateY(-3px);
  transition:opacity 0.35s var(--ease-in-out), transform 0.35s var(--ease-out-expo);
  pointer-events:none;
  z-index:3;
}

.tile:hover .tile-badge{opacity:1;transform:translateY(0);}

/* Flyout label */
.flyout{
  position:absolute;
  z-index:3;
  bottom:13px;
  left:14px;
  right:14px;
  color:#fff;
  font-size:13px;
  font-weight:400;
  line-height:1.3;
  opacity:0;
  transform:translateY(6px);
  transition:opacity 0.4s var(--ease-in-out), transform 0.4s var(--ease-out-expo);
  pointer-events:none;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tile:hover .flyout{opacity:1;transform:translateY(0);}

/* ── KEYFRAMES ── */
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes shimmer{
  0%{background-position:-200% 0;}
  100%{background-position:200% 0;}
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(16px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .wrap{grid-template-columns:210px 1fr;}
  h1{font-size:50px;}
}

@media(max-width:880px){
  body{padding:16px;}
  .wrap{grid-template-columns:1fr;gap:24px;}
  .brand{position:static;}
  h1{font-size:46px;}
}

@media(max-width:640px){
  body{padding:12px;}
  h1{font-size:38px;}
  .filter-row a{font-size:11px;padding:5px 10px;}
}

@media(max-width:480px){
  h1{font-size:32px;}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="brand">
    <div class="kicker">Portfolio // 2025</div>
    <h1>
      <span>Jan</span>
      <span class="last">Levínský</span>
    </h1>
    <div class="divider"></div>
    <div class="intro">
      <div class="greeting-row">
        <span class="emoji">👋</span>
        <span>I am Honza — a multimedia creator with passion for tech, nature and everything in between.</span>
      </div>
    </div>
    <nav class="links">
      <a href="#"><span class="arrow">↗</span>Instagram</a>
      <a href="#"><span class="arrow">↗</span>Behance</a>
      <a href="#"><span class="arrow">↗</span>Contact</a>
    </nav>
  </aside>

  <main>
    <div class="filter-row" id="filterRow">
      <div class="filter-pill-bg" id="filterPill"></div>
      <a data-group="all" class="active">All</a>
      <span class="sep">/</span>
      <a data-group="photo">Photo</a>
      <span class="sep">/</span>
      <a data-group="video">Video</a>
    </div>

    <div style="position:relative; flex:1; min-height:400px;">
      <div class="grid-loading" id="gridLoading">
        <div class="loading-ring"></div>
        <div class="loading-text">Loading projects…</div>
      </div>
      <section class="grid" id="grid"></section>
    </div>
  </main>
</div>

<script>
let currentGroup = 'all';
let resizeTimeout;

// Animated filter pill
function updateFilterPill() {
  const row = document.getElementById('filterRow');
  const pill = document.getElementById('filterPill');
  const active = row.querySelector('a.active');
  if (!active) return;
  const rowRect = row.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  pill.style.width = aRect.width + 'px';
  pill.style.left = (aRect.left - rowRect.left) + 'px';
  pill.style.top = ((aRect.top - rowRect.top) + (aRect.height - 30) / 2) + 'px';
}

function loadImage(img, placeholder) {
  return new Promise(resolve => {
    if (img.complete && img.naturalWidth) { placeholder?.remove(); resolve(true); return; }
    img.onload = () => { placeholder?.remove(); resolve(true); };
    img.onerror = () => { placeholder?.remove(); resolve(false); };
  });
}

function getVideoThumbnail(videoSrc) {
  return new Promise(resolve => {
    const video = document.createElement('video');
    video.src = videoSrc;
    video.crossOrigin = 'anonymous';
    video.currentTime = 1.5;
    video.muted = true;
    video.addEventListener('loadeddata', () => {
      const canvas = document.createElement('canvas');
      canvas.width = 480; canvas.height = 320;
      canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    });
    video.addEventListener('error', () => resolve(''));
    setTimeout(() => resolve(''), 2500);
  });
}

async function initPortfolio() {
  const grid = document.getElementById('grid');
  const gridLoading = document.getElementById('gridLoading');

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('JSON failed');
    const projects = await res.json();
    projects.sort(() => Math.random() - 0.5);

    let loaded = 0;
    const total = projects.length;

    for (const project of projects) {
      let thumbnailSrc = project.thumbnail;
      let needsVideo = false;

      if (!thumbnailSrc && project.media?.[0]) {
        const m = project.media[0];
        if (m.type === 'photo') thumbnailSrc = m.src;
        else if (m.type === 'video') needsVideo = true;
      }
      if (!thumbnailSrc) thumbnailSrc = '';

      const a = document.createElement('a');
      a.href = `project.html?id=${project.id}`;
      a.className = 'tile';
      a.dataset.type = project.type;
      a.dataset.id = project.id;
      a.innerHTML = `
        <div class="image-placeholder"></div>
        <img src="" alt="${project.title}" loading="lazy">
        <div class="tile-badge">${project.type === 'video' ? 'Video' : 'Photo'}</div>
        <div class="flyout">${project.title}</div>
      `;
      grid.appendChild(a);

      const idx = loaded;
      setTimeout(async () => {
        try {
          let src = thumbnailSrc;
          if (needsVideo) src = await getVideoThumbnail(project.media[0].src);
          const img = a.querySelector('img');
          const ph = a.querySelector('.image-placeholder');
          img.src = src;
          await loadImage(img, ph);
        } catch(e) { console.warn(e); }
        loaded++;
        const el = document.querySelector('.loading-text');
        if (el) el.textContent = `Loading… ${Math.round((loaded/total)*100)}%`;
      }, idx * 70);
    }

    // First position all tiles silently, THEN fade out loader
    updateLayout(false);
    initEventListeners();
    setTimeout(updateFilterPill, 50);

    // Small delay so layout is painted before loader disappears
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        gridLoading.classList.add('hidden');
        // Stagger tile reveal after loader is gone
        const tiles = Array.from(document.querySelectorAll('.tile'));
        tiles.forEach((t, i) => {
          t.style.opacity = '0';
          t.style.transform = t.style.transform; // keep position
          setTimeout(() => {
            t.style.transition = `opacity 0.45s ease, transform 0.5s var(--ease-out-expo)`;
            t.style.opacity = '1';
          }, i * 55);
        });
      });
    });

  } catch(err) {
    console.error(err);
    gridLoading.classList.add('hidden');
    grid.innerHTML = `<div style="padding:40px;color:var(--muted);font-size:13px;">Failed to load projects.json</div>`;
  }
}

function getColumns() {
  const w = window.innerWidth;
  if (w <= 480) return 1;
  if (w <= 880) return 2;
  return 3;
}

function getTileDims() {
  const grid = document.getElementById('grid');
  const cols = getColumns();
  const gap = 14;
  const w = (grid.clientWidth - gap * (cols - 1)) / cols;
  return { w, h: w * (2/3), gap, cols };
}

function calcPositions(tiles) {
  const { w, h, gap, cols } = getTileDims();
  const map = new Map();
  tiles.forEach((t, i) => {
    map.set(t, {
      x: (i % cols) * (w + gap),
      y: Math.floor(i / cols) * (h + gap),
      w, h
    });
  });
  return map;
}

function updateLayout(animate = true) {
  const grid = document.getElementById('grid');
  const all = Array.from(document.querySelectorAll('.tile'));
  const visible = all.filter(t => currentGroup === 'all' || t.dataset.type === currentGroup);

  let prevPos = new Map();
  if (animate) {
    all.forEach(t => {
      const r = t.getBoundingClientRect();
      const gr = grid.getBoundingClientRect();
      prevPos.set(t, { x: r.left - gr.left, y: r.top - gr.top, w: r.width });
    });
  }

  const next = calcPositions(visible);

  if (animate) {
    all.forEach(t => {
      const p = prevPos.get(t);
      if (p && parseFloat(t.style.opacity) > 0) {
        t.style.transition = 'none';
        t.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
        t.style.width = p.w + 'px';
      }
    });
    grid.offsetHeight; // reflow
  }

  requestAnimationFrame(() => {
    visible.forEach((t, i) => {
      const p = next.get(t);
      if (p) {
        t.style.transition = animate
          ? `transform 0.7s var(--ease-out-expo), width 0.7s var(--ease-out-expo), height 0.7s var(--ease-out-expo), opacity 0.35s ease ${i * 0.03}s`
          : 'none';
        t.style.transform = `translate3d(${p.x}px,${p.y}px,0)`;
        t.style.width = p.w + 'px';
        t.style.height = p.h + 'px';
        t.style.opacity = '1';
        t.classList.remove('hidden');
      }
    });
    all.forEach(t => {
      if (!visible.includes(t)) {
        t.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
        t.classList.add('hidden');
      }
    });
  });

  const { h, gap, cols } = getTileDims();
  const rows = Math.ceil(visible.length / cols);
  grid.style.height = `${rows * h + (rows - 1) * gap}px`;
}

function initEventListeners() {
  document.querySelectorAll('.filter-row a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.filter-row a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      updateFilterPill();
      currentGroup = link.dataset.group;
      updateLayout(true);
    });
  });

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => { updateLayout(false); updateFilterPill(); }, 150);
  });
}

initPortfolio();
</script>
</body>
</html>
