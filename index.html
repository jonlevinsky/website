<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Portfolio Jana Levínského — cinematography & photography.">
<title>Jan Levínský — Cinematography & Photography</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --md-primary: #c4956a;
  --md-on-primary: #0c0c0c;
  --md-primary-container: rgba(196, 149, 106, 0.12);
  --md-secondary-container: rgba(196, 149, 106, 0.06);
  --md-surface: #faf8f5;
  --md-surface-variant: #f0ece6;
  --md-surface-container: #f5f2ee;
  --md-surface-container-high: #eae6e0;
  --md-surface-container-low: #fdfcfa;
  --md-outline: #d4cfc7;
  --md-outline-variant: #e8e4dd;
  --md-on-surface: #1c1917;
  --md-on-surface-variant: #6b6560;
  --md-inverse-surface: #1c1917;
  --md-inverse-on-surface: #faf8f5;
  --serif: 'Bricolage Grotesque', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  color-scheme: light;
}

html, body { height: 100%; color: var(--md-on-surface); font-family: var(--sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { background: var(--md-surface); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--md-outline); border-radius: var(--r-full); }

a:focus-visible,
button:focus-visible,
.tile:focus-visible {
  outline: 2px solid var(--md-primary);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

.wrap {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 40px;
  max-width: 1420px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
}

.brand {
  padding: 4px 0 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 24px;
  height: fit-content;
}

.kicker {
  font-size: 10px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 30px;
  opacity: 0;
  animation: fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 56px;
  line-height: 0.92;
  letter-spacing: -0.015em;
  color: var(--md-on-surface);
  opacity: 0;
  animation: fadeUp 0.8s 0.15s var(--ease-out-expo) forwards;
}

h1 span { display: block; }
h1 .last { font-style: italic; color: var(--md-primary); }

.divider {
  width: 28px;
  height: 1.5px;
  background: var(--md-primary);
  margin: 26px 0;
  opacity: 0;
  animation: fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}

.intro {
  color: var(--md-on-surface-variant);
  font-size: 13px;
  line-height: 1.75;
  font-weight: 300;
  opacity: 0;
  animation: fadeUp 0.7s 0.3s var(--ease-out-expo) forwards;
}

.greeting-row { display: flex; align-items: flex-start; gap: 9px; }
.greeting-row .emoji { font-size: 15px; margin-top: 3px; flex-shrink: 0; }

.links {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  opacity: 0;
  animation: fadeUp 0.7s 0.38s var(--ease-out-expo) forwards;
}

.links a {
  color: var(--md-on-surface-variant);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.3s ease, gap 0.4s var(--ease-out-expo);
  width: fit-content;
  padding: 2px 0;
}

.links a i {
  font-size: 14px;
  opacity: 0.55;
  transition: opacity 0.3s ease, color 0.3s ease, transform 0.4s var(--ease-out-expo);
  display: inline-block;
}

.links a:hover { color: var(--md-primary); gap: 10px; }
.links a:hover i { opacity: 1; color: var(--md-primary); transform: translate(1px, -1px); }

main {
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 0.9s 0.2s var(--ease-out-expo) forwards;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 20px;
  position: relative;
}

.filter-pill-bg {
  position: absolute;
  height: 30px;
  background: var(--md-primary-container);
  border: 1px solid rgba(196, 149, 106, 0.2);
  border-radius: 100px;
  transition: all 0.4s var(--ease-out-expo);
  pointer-events: none;
  z-index: 0;
}

.filter-row a {
  position: relative;
  z-index: 1;
  cursor: pointer;
  text-decoration: none;
  color: var(--md-on-surface-variant);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 100px;
  transition: color 0.3s ease;
  user-select: none;
  white-space: nowrap;
}

.filter-row a:first-child { padding-left: 8px; }
.filter-row a.active { color: var(--md-primary); }
.sep { color: var(--md-on-surface-variant); font-size: 12px; opacity: 0.3; padding: 0 2px; user-select: none; }

.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 220px;
  grid-auto-flow: dense;
  gap: 14px;
  width: 100%;
}

.tile {
  position: relative;
  background: var(--md-surface-variant);
  overflow: hidden;
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: opacity 0.6s ease, transform 0.6s var(--ease-out-expo), border-color 0.4s ease;
  will-change: transform;
  border: 1px solid var(--md-outline);
  min-height: 220px;
  opacity: 1;
  transform: translateY(0);
}

.tile.wide { grid-column: span 2; min-height: 220px; }
.tile.tall { grid-row: span 2; min-height: auto; }
.tile.large { grid-column: span 2; grid-row: span 2; min-height: auto; }

.tile:hover {
  transform: translateY(-4px) scale(1.015);
  border-color: var(--md-outline-variant);
  z-index: 2;
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.8s var(--ease-out-expo), opacity 0.6s ease, filter 0.6s ease;
  opacity: 0;
}

.tile:hover img {
  transform: scale(1.03);
  filter: brightness(0.92);
}

.tile img.loaded { opacity: 1; }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--md-surface-variant) 25%, var(--md-surface-container) 50%, var(--md-surface-variant) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  z-index: 0;
}

.tile img { position: relative; z-index: 1; }
.tile:hover::before { opacity: 0; }

.film-perf-h, .film-perf-v {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  opacity: 1;
  transition: opacity 0.3s ease, transform 0.5s var(--ease-out-expo);
}

.film-perf-h {
  left: 4%;
  right: 4%;
  height: calc(var(--perf-dot-height, 8%) + 2%);
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-h.top { top: 3%; }
.film-perf-h.bottom { bottom: 3%; }

.film-perf-h .perf-dot {
  width: var(--perf-dot-width, 1.2%);
  height: var(--perf-dot-height, 8%);
  border-radius: 999px;
  background: var(--md-surface);
  flex-shrink: 0;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), inset 0 -2px 4px rgba(255,255,255,0.08), 0 0 0 0.5px rgba(255,255,255,0.15);
  transition: transform 0.4s var(--ease-out-expo), box-shadow 0.4s ease;
}

.film-perf-v {
  top: 4%;
  bottom: 4%;
  width: calc(var(--perf-dot-width, 11%) + 2%);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-v.left { left: 3%; }
.film-perf-v.right { right: 3%; }

.film-perf-v .perf-dot {
  width: var(--perf-dot-width, 11%);
  height: var(--perf-dot-height, 1.2%);
  border-radius: 999px;
  background: var(--md-surface);
  flex-shrink: 0;
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.35), inset 0 -2px 4px rgba(255,255,255,0.08), 0 0 0 0.5px rgba(255,255,255,0.15);
  transition: transform 0.4s var(--ease-out-expo), box-shadow 0.4s ease;
}

.tile:hover .film-perf-h,
.tile:hover .film-perf-v {
  opacity: 0.85;
}

.tile:hover .perf-dot {
  box-shadow: inset 0 3px 8px rgba(0,0,0,0.45), inset 0 -2px 4px rgba(255,255,255,0.12), 0 0 0 0.5px rgba(255,255,255,0.2);
}

.film-shadow {
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  pointer-events: none;
  z-index: 1;
  opacity: 0.4;
  transition: opacity 0.5s ease;
}

.tile:hover .film-shadow {
  opacity: 0.65;
}

.tile.photo-tile .film-shadow {
  box-shadow: inset 0 80px 32px -32px rgba(0, 0, 0), inset 0 -80px 32px -32px rgba(0, 0, 0);
}

.tile.video-tile .film-shadow {
  box-shadow: inset 80px 0 32px -32px rgb(0, 0, 0), inset -80px 0 32px -32px rgba(0, 0, 0);
}

.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.25) 45%, transparent 75%);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
  pointer-events: none;
  z-index: 2;
}

.tile:hover::after { opacity: 1; }

.flyout {
  position: absolute;
  z-index: 5;
  color: #fff;
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
  text-shadow: 0 2px 10px rgba(0,0,0,0.55), 0 1px 3px rgba(0,0,0,0.4);
  opacity: 0;
  transition: opacity 0.45s var(--ease-in-out), transform 0.45s var(--ease-out-expo), left 0.45s ease, top 0.45s ease, right 0.45s ease, bottom 0.45s ease;
  pointer-events: none;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: 0.01em;
  max-width: 85%;
}

.from-left .flyout {
  left: 16px;
  bottom: 14px;
  transform: translateX(-120%) translateY(6px);
}

.from-right .flyout {
  right: 16px;
  bottom: 14px;
  left: auto;
  transform: translateX(120%) translateY(6px);
}

.tile:hover .flyout {
  opacity: 1;
  left: 50%;
  top: 50%;
  right: auto;
  bottom: auto;
  transform: translate(-50%, -50%);
}

.flyout-year {
  font-family: var(--sans);
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.06em;
  margin-top: 5px;
  font-weight: 500;
  text-shadow: 0 1px 4px rgba(0,0,0,0.45);
}

.grid-loading {
  position: relative;
  width: 100%;
  min-height: 400px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.6s var(--ease-out-expo), visibility 0s 0.6s, min-height 0.6s var(--ease-out-expo);
  visibility: visible;
}
.grid-loading.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  min-height: 0;
  padding: 0;
  margin: 0;
}
.gl-spinner {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--md-outline);
  border-top-color: var(--md-primary);
  animation: spin 0.85s linear infinite;
}
.gl-text {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  font-style: italic;
  color: var(--md-on-surface-variant);
  margin-top: 18px;
  letter-spacing: 0.01em;
  opacity: 0;
  animation: fadeUp 0.5s 0.2s var(--ease-out-expo) forwards;
}

.g-footer {
  padding: 60px 0 40px;
  border-top: 1px solid var(--md-outline);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  margin-top: 40px;
}

.g-footer::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 2px;
  background: var(--md-primary);
  border-radius: 2px;
  opacity: 0.5;
}

.f-name {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 400;
  color: var(--md-on-surface);
  text-wrap: balance;
}

.f-role {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--md-on-surface-variant);
  margin-top: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.f-contact {
  margin-top: 20px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: var(--md-on-surface-variant);
  text-decoration: none;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--md-outline);
  padding-bottom: 3px;
  transition: color 0.3s ease, border-color 0.3s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.f-contact:hover { color: var(--md-primary); border-color: var(--md-primary); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.film-key-wrap {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--md-outline);
  opacity: 0;
  animation: fadeUp 0.7s 0.5s var(--ease-out-expo) forwards;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.film-key-toggle {
  width: 28px;
  height: 28px;
  border-radius: var(--r-full);
  border: 1px solid var(--md-outline);
  background: var(--md-surface-variant);
  color: var(--md-on-surface-variant);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.3s var(--ease-out-expo);
  opacity: 0.5;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}

.film-key-toggle:hover {
  opacity: 1;
  border-color: var(--md-primary);
  color: var(--md-primary);
  transform: scale(1.08);
}

.film-key-toggle.active {
  opacity: 1;
  border-color: var(--md-primary);
  color: var(--md-primary);
  background: var(--md-primary-container);
}

.film-key {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-6px);
  transition: max-height 0.45s var(--ease-out-expo), opacity 0.35s ease, transform 0.35s var(--ease-out-expo), padding 0.35s ease;
  padding-top: 0;
}

.film-key.open {
  max-height: 120px;
  opacity: 1;
  transform: translateY(0);
  padding-top: 6px;
}

.film-key-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.film-key-strip {
  background: var(--md-surface-variant);
  border: 1px solid var(--md-outline);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
  flex-shrink: 0;
}

.film-key-strip-h {
  width: 26px;
  height: 9px;
  padding: 0 3px;
}

.film-key-strip-v {
  width: 9px;
  height: 26px;
  flex-direction: column;
  padding: 3px 0;
}

.film-key-strip .perf {
  display: block;
  background: var(--md-surface);
  border-radius: 999px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.35), inset 0 -1px 1px rgba(255,255,255,0.08);
  flex-shrink: 0;
}

.film-key-strip-h .perf {
  width: 4.5px;
  height: 3px;
}

.film-key-strip-v .perf {
  width: 3px;
  height: 4.5px;
}

.film-key-row span {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--md-on-surface-variant);
  opacity: 0.4;
}

@media (max-width: 880px) {
  .film-key-wrap {
    margin-top: 24px;
    border-top: none;
    padding-top: 0;
    margin-left: 2px;
  }
  .film-key.open {
    flex-direction: row;
    gap: 16px;
    padding-top: 6px;
  }
}

@media (max-width: 1024px) {
  .wrap { grid-template-columns: 210px 1fr; gap: 28px; }
  h1 { font-size: 48px; }
  .bento { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 880px) {
  .wrap { grid-template-columns: 1fr; gap: 24px; padding: 16px; }
  .brand { position: static; }
  h1 { font-size: 44px; }
  .bento { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  .tile.wide, .tile.large { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
}

@media (max-width: 640px) {
  .wrap { padding: 12px; }
  h1 { font-size: 36px; }
  .bento { grid-template-columns: 1fr; grid-auto-rows: 240px; }
  .tile.wide, .tile.tall, .tile.large { grid-column: span 1; grid-row: span 1; }
  .filter-row a { font-size: 11px; padding: 5px 10px; }
  .flyout { font-size: 18px; }
  .film-perf-h,
  .film-perf-v { display: none !important; }
  .tile .flyout {
    position: absolute;
    left: 12px;
    bottom: 12px;
    right: auto;
    top: auto;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: none;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    max-width: 90%;
  }
  .flyout-year { font-size: 11px; }
}

@media (max-width: 480px) {
  h1 { font-size: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>

<body>

<div class="wrap">
  <aside class="brand">
    <div class="kicker">Portfolio // 2025</div>
    <h1>
      <span>Jan</span>
      <span class="last">Levínský</span>
    </h1>
    <div class="divider"></div>
    <div class="intro">
      <div class="greeting-row">
        <span class="emoji">👋</span>
        <span>Filmař a fotograf z Opavy. Tvořím obrazy, které mluví.</span>
      </div>
    </div>
    <nav class="links">
      <a href="https://www.instagram.com/levinskyj.cine/" target="_blank" rel="noopener noreferrer"><i class="ph ph-instagram-logo"></i>Instagram</a>
      <a href="https://www.youtube.com/@LevinskyJ" target="_blank" rel="noopener noreferrer"><i class="ph ph-youtube-logo"></i>YouTube</a>
      <a href="mailto:levinskyj.cine@gmail.com"><i class="ph ph-envelope"></i>Email</a>
    </nav>

    <div class="film-key-wrap">
      <button class="film-key-toggle" id="filmKeyToggle" aria-label="Co znamenají perforace?" aria-expanded="false">
        <i class="ph ph-question"></i>
      </button>
      <div class="film-key" id="filmKeyPanel" aria-hidden="true">
        <div class="film-key-row">
          <div class="film-key-strip film-key-strip-h" aria-hidden="true">
            <span class="perf"></span><span class="perf"></span><span class="perf"></span>
          </div>
          <span>fotografie</span>
        </div>
        <div class="film-key-row">
          <div class="film-key-strip film-key-strip-v" aria-hidden="true">
            <span class="perf"></span><span class="perf"></span><span class="perf"></span>
          </div>
          <span>video</span>
        </div>
      </div>
    </div>
  </aside>

  <main>
    <div class="filter-row" id="filterRow">
      <div class="filter-pill-bg" id="filterPill"></div>
      <a data-group="all" class="active" role="button" tabindex="0">All</a>
      <span class="sep">/</span>
      <a data-group="photo" role="button" tabindex="0">Photo</a>
      <span class="sep">/</span>
      <a data-group="video" role="button" tabindex="0">Video</a>
    </div>

    <div style="position: relative; flex: 1; min-height: 400px;">
      <div class="grid-loading" id="gridLoading">
        <div class="gl-spinner"></div>
        <div class="gl-text">Načítání projektů</div>
      </div>
      <section class="bento" id="grid" role="list"></section>
    </div>

    <footer class="g-footer">
      <div class="f-name">Jan Levínský</div>
      <div class="f-role">Cinematography & Photography</div>
      <a class="f-contact" href="mailto:levinskyj.cine@gmail.com">
        <i class="ph ph-envelope" style="font-size: 14px;"></i>
        Kontakt
      </a>
    </footer>
  </main>
</div>

<script>
let currentGroup = 'all';

function updateFilterPill() {
  const row = document.getElementById('filterRow');
  const pill = document.getElementById('filterPill');
  const active = row.querySelector('a.active');
  if (!active) return;
  const rowRect = row.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  pill.style.width = aRect.width + 'px';
  pill.style.left = (aRect.left - rowRect.left) + 'px';
  pill.style.top = ((aRect.top - rowRect.top) + (aRect.height - 30) / 2) + 'px';
}

function loadImage(img) {
  return new Promise(resolve => {
    if (img.complete && img.naturalWidth) { resolve(true); return; }
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
  });
}

async function initPortfolio() {
  const grid = document.getElementById('grid');
  const gridLoading = document.getElementById('gridLoading');

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('JSON failed');
    const projects = await res.json();

    const imagePromises = [];

    for (const [idx, project] of projects.entries()) {
      let thumbnailSrc = project.thumbnail || '';
      if (!thumbnailSrc && project.media && project.media[0]) {
        const m = project.media[0];
        if (m.type === 'photo') thumbnailSrc = m.src;
      }

      const a = document.createElement('a');
      a.href = 'project.html?id=' + project.id;
      a.className = 'tile ' + (project.layout || 'normal') + ' ' + (project.type === 'video' ? 'video-tile' : 'photo-tile');
      a.dataset.type = project.type;
      a.dataset.id = project.id;
      a.setAttribute('role', 'listitem');
      a.setAttribute('aria-label', project.title + (project.year ? ' (' + project.year + ')' : ''));

      const isVideo = project.type === 'video';
      const layout = project.layout || 'normal';
      const filmSizes = {
        photo: {
          normal: { width: 36, height: 24 },
          wide: { width: 42.7, height: 24 },
          tall: { width: 13.5, height: 24 }
        },
        video: {
          normal: { width: 24, height: 18.6 },
          wide: { width: 24, height: 14 },
          tall: { width: 24, height: 44.2 }
        }
      };
      const hole = { width: 2.79, height: 1.98, pitch: 4.75 };
      const frame = filmSizes[isVideo ? 'video' : 'photo'][layout] || filmSizes[isVideo ? 'video' : 'photo'].normal;
      const edgeLength = isVideo ? frame.height : frame.width;
      const count = Math.max(2, Math.round(edgeLength / hole.pitch));

      a.dataset.perfType = isVideo ? 'video' : 'photo';
      a.dataset.perfFrameWidth = frame.width;
      a.dataset.perfFrameHeight = frame.height;
      a.dataset.perfHoleWidth = hole.width;
      a.dataset.perfHoleHeight = hole.height;
      a.dataset.perfCount = count;
      a.dataset.src = (project.media && project.media[0] && project.media[0].src) ? project.media[0].src : '';

      const perfHtml = isVideo 
        ? '<div class="film-perf-v left">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-v right">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>'
        : '<div class="film-perf-h top">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-h bottom">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>';

      a.innerHTML = '<div class="film-shadow"></div>' + perfHtml + 
        '<div class="flyout">' + project.title + '<div class="flyout-year">' + (project.year || '') + '</div></div>';
      grid.appendChild(a);

      const rect = a.getBoundingClientRect();
      const pitchPx = isVideo ? (hole.pitch / frame.height) * rect.height : (hole.pitch / frame.width) * rect.width;
      const dotWidthPx = (hole.width / frame.width) * rect.width;
      const dotHeightPx = (hole.height / frame.height) * rect.height;

      const gapForH = Math.max(1, pitchPx - dotWidthPx);
      const gapForV = Math.max(1, pitchPx - dotHeightPx);

      a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
      a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

      const perfHTop = a.querySelector('.film-perf-h.top');
      const perfHBottom = a.querySelector('.film-perf-h.bottom');
      const perfVLeft = a.querySelector('.film-perf-v.left');
      const perfVRight = a.querySelector('.film-perf-v.right');

      if (perfHTop || perfHBottom) {
        const containerW = (count * dotWidthPx) + ((count - 1) * gapForH);
        [perfHTop, perfHBottom].forEach(el => {
          if (!el) return;
          el.style.width = Math.round(containerW) + 'px';
          el.style.left = '50%';
          el.style.transform = 'translateX(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForH) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      if (perfVLeft || perfVRight) {
        const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
        [perfVLeft, perfVRight].forEach(el => {
          if (!el) return;
          el.style.height = Math.round(containerH) + 'px';
          el.style.top = '50%';
          el.style.transform = 'translateY(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForV) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      const centerX = rect.left + rect.width / 2;
      const sideClass = centerX < (window.innerWidth / 2) ? 'from-left' : 'from-right';
      a.classList.add(sideClass);

      const imgPromise = new Promise(resolve => {
        setTimeout(() => {
          const img = document.createElement('img');
          img.src = thumbnailSrc ? encodeURI(thumbnailSrc) : '';
          img.alt = project.title;
          img.loading = 'lazy';
          img.decoding = 'async';
          img.onload = () => {
            img.classList.add('loaded');
            resolve();
          };
          img.onerror = () => resolve();
          a.insertBefore(img, a.firstChild);
        }, idx * 70);
      });
      imagePromises.push(imgPromise);
    }

    await Promise.all(imagePromises);
    gridLoading.classList.add('hidden');

    const tiles = Array.from(document.querySelectorAll('.tile'));
    tiles.forEach((t, i) => {
      t.style.opacity = '0';
      t.style.transform = 'translateY(16px)';
      setTimeout(() => {
        t.style.opacity = '1';
        t.style.transform = 'translateY(0)';
      }, i * 70);
    });

    initEventListeners();
    setTimeout(() => { updateFilterPill(); recalcPerforations(); }, 50);

  } catch(err) {
    console.error(err);
    gridLoading.classList.add('hidden');
    grid.innerHTML = '<div style="padding:40px;color:var(--md-on-surface-variant);font-size:13px;">Failed to load projects.json</div>';
  }
}

// automatic thumbnail generation removed (disabled)

document.getElementById('filmKeyToggle').addEventListener('click', function() {
  const panel = document.getElementById('filmKeyPanel');
  const isOpen = panel.classList.toggle('open');
  this.classList.toggle('active', isOpen);
  this.setAttribute('aria-expanded', isOpen);
  panel.setAttribute('aria-hidden', !isOpen);
});

function initEventListeners() {
  document.querySelectorAll('.filter-row a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.filter-row a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      updateFilterPill();
      currentGroup = link.dataset.group;
      filterTiles();
    });
    link.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        link.click();
      }
    });
  });

  window.addEventListener('resize', () => {
    requestAnimationFrame(updateFilterPill);
    requestAnimationFrame(recalcPerforations);
  });
}

function recalcPerforations() {
  const tiles = Array.from(document.querySelectorAll('.tile'));
  tiles.forEach(a => {
    const type = a.dataset.perfType;
    if (!type) return;
    const frameW = parseFloat(a.dataset.perfFrameWidth);
    const frameH = parseFloat(a.dataset.perfFrameHeight);
    const holeW = parseFloat(a.dataset.perfHoleWidth);
    const holeH = parseFloat(a.dataset.perfHoleHeight);
    const count = parseInt(a.dataset.perfCount, 10) || 2;
    const rect = a.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const sideClass = centerX < (window.innerWidth / 2) ? 'from-left' : 'from-right';
    a.classList.toggle('from-left', sideClass === 'from-left');
    a.classList.toggle('from-right', sideClass === 'from-right');
    const isVideo = type === 'video';
    const pitchPx = isVideo ? (4.75 / frameH) * rect.height : (4.75 / frameW) * rect.width;
    const dotWidthPx = (holeW / frameW) * rect.width;
    const dotHeightPx = (holeH / frameH) * rect.height;
    const gapForH = Math.max(1, pitchPx - dotWidthPx);
    const gapForV = Math.max(1, pitchPx - dotHeightPx);
    a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
    a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

    const perfHTop = a.querySelector('.film-perf-h.top');
    const perfHBottom = a.querySelector('.film-perf-h.bottom');
    const perfVLeft = a.querySelector('.film-perf-v.left');
    const perfVRight = a.querySelector('.film-perf-v.right');
    if (perfHTop || perfHBottom) {
      const containerW = (count * dotWidthPx) + ((count - 1) * gapForH);
      [perfHTop, perfHBottom].forEach(el => {
        if (!el) return;
        el.style.width = Math.round(containerW) + 'px';
        el.style.left = '50%';
        el.style.transform = 'translateX(-50%)';
        el.style.justifyContent = 'flex-start';
        el.style.gap = Math.round(gapForH) + 'px';
        el.querySelectorAll('.perf-dot').forEach(d => {
          d.style.width = Math.round(dotWidthPx) + 'px';
          d.style.height = Math.round(dotHeightPx) + 'px';
          d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
        });
      });
    }
    if (perfVLeft || perfVRight) {
      const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
      [perfVLeft, perfVRight].forEach(el => {
        if (!el) return;
        el.style.height = Math.round(containerH) + 'px';
        el.style.top = '50%';
        el.style.transform = 'translateY(-50%)';
        el.style.justifyContent = 'flex-start';
        el.style.gap = Math.round(gapForV) + 'px';
        el.querySelectorAll('.perf-dot').forEach(d => {
          d.style.width = Math.round(dotWidthPx) + 'px';
          d.style.height = Math.round(dotHeightPx) + 'px';
          d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
        });
      });
    }
  });
}

function filterTiles() {
  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => {
    const type = t.dataset.type;
    if (currentGroup === 'all' || type === currentGroup) {
      t.style.display = '';
      requestAnimationFrame(() => {
        t.style.opacity = '1';
        t.style.transform = 'translateY(0)';
      });
    } else {
      t.style.opacity = '0';
      t.style.transform = 'translateY(16px)';
      setTimeout(() => { t.style.display = 'none'; }, 300);
    }
  });
}

initPortfolio();
</script>
</body>
</html>
