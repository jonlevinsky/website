<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --accent: #c4956a;
  --text-on-accent: #0c0c0c;
  --accent-subtle: #c4966b1f;
  --accent-subtle-2: #c4956a0f;
  --bg: #faf8f5;
  --surface: #f0ece6;
  --bg-raised: #f5f2ee;
  --surface-raised: #eae6e0;
  --bg-subtle: #fdfcfa;
  --border: #d4cfc7;
  --border-subtle: #e8e4dd;
  --text: #1c1917;
  --muted: #6b6560;
  --serif: 'Bricolage Grotesque', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
}

html, body { height: 100%; color: var(--text); font-family: var(--sans); font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body { background: var(--bg); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: var(--r-full); }

a:focus-visible, button:focus-visible, .tile:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: var(--r-sm);
}

.wrap {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 40px;
  max-width: 1420px;
  width: 100%;
  margin: 0 auto;
  padding: 24px;
  min-height: 100vh;
}

.brand {
  padding: 4px 0 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 24px;
  height: fit-content;
}

.kicker {
  font-size: 10px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 30px;
  opacity: 0;
  animation: fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 400;
  font-size: 56px;
  line-height: 0.92;
  letter-spacing: -0.015em;
  color: var(--text);
  opacity: 0;
  animation: fadeUp 0.8s 0.15s var(--ease-out-expo) forwards;
}

h1 span { display: block; }
h1 .last { font-style: italic; color: var(--accent); }

.h1-word { display: block; }
.h1-char { display: inline-block; will-change: transform; }
html.lib-anim h1 { animation: none; opacity: 1; }
html.lib-anim .h1-char { opacity: 0; }

.px-wrap {
  position: absolute;
  left: 0; right: 0; top: 0; bottom: 0;
  z-index: 1;
  pointer-events: none;
}
.px-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.divider {
  width: 28px;
  height: 1.5px;
  background: var(--accent);
  margin: 26px 0;
  opacity: 0;
  animation: fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}

.intro {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.75;
  font-weight: 300;
  opacity: 0;
  animation: fadeUp 0.7s 0.3s var(--ease-out-expo) forwards;
}

.greeting-row { display: flex; align-items: flex-start; gap: 9px; }
.greeting-row .emoji { font-size: 15px; margin-top: 3px; flex-shrink: 0; }

.links {
  margin-top: 32px;
  display: flex;
  flex-direction: column;
  gap: 9px;
  opacity: 0;
  animation: fadeUp 0.7s 0.38s var(--ease-out-expo) forwards;
}

.links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0.03em;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color 0.3s ease, gap 0.4s var(--ease-out-expo);
  width: fit-content;
  padding: 2px 0;
}

.links a i {
  font-size: 14px;
  opacity: 0.55;
  transition: opacity 0.3s ease, color 0.3s ease, transform 0.4s var(--ease-out-expo);
  display: inline-block;
}

.links a:hover { color: var(--accent); gap: 10px; }
.links a:hover i { opacity: 1; color: var(--accent); transform: translate(1px, -1px); }

main {
  display: flex;
  flex-direction: column;
  opacity: 0;
  animation: fadeIn 0.9s 0.2s var(--ease-out-expo) forwards;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-bottom: 20px;
  position: relative;
}

.filter-pill-bg {
  position: absolute;
  height: 30px;
  background: var(--accent-subtle);
  border: 1px solid rgba(196, 149, 106, 0.2);
  border-radius: 100px;
  pointer-events: none;
  z-index: 0;
}

.filter-row a {
  position: relative;
  z-index: 1;
  cursor: pointer;
  text-decoration: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 100px;
  transition: color 0.3s ease;
  user-select: none;
  white-space: nowrap;
}

.filter-row a:first-child { padding-left: 8px; }
.filter-row a.active { color: var(--accent); }
.sep { color: var(--muted); font-size: 12px; opacity: 0.3; padding: 0 2px; user-select: none; }

.bento { contain: layout;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 220px;
  grid-auto-flow: dense;
  gap: 14px;
  width: 100%;
}

.tile {
  position: relative;
  background: var(--surface);
  overflow: hidden;
  border-radius: var(--r-lg);
  cursor: pointer;
  transition: transform 0.6s var(--ease-out-expo), border-color 0.4s ease;
  will-change: transform;
  border: 1px solid var(--border);
  min-height: 220px;
}

.tile.wide { grid-column: span 2; min-height: 220px; }
.tile.tall { grid-row: span 2; min-height: auto; }
.tile.large { grid-column: span 2; grid-row: span 2; min-height: auto; }

.tile:hover {
  transform: translateY(-4px) scale(1.015);
  border-color: var(--border-subtle);
  z-index: 2;
}

.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: filter 0.8s var(--ease-out-expo), opacity 0.6s var(--ease-out-expo);
  opacity: 0;
}

.tile:hover img {
  filter: brightness(0.92);
}

.tile img.loaded { opacity: 1; }

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, var(--surface) 25%, var(--bg-raised) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  z-index: 0;
  opacity: 0;
  transition: opacity 0.5s ease;
}

.tile.skeleton::before { opacity: 1; }
.tile img { position: relative; z-index: 1; }

/* LQIP placeholder */
.tile .lqip-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  filter: blur(8px) saturate(0.8);
  transition: opacity 0.6s var(--ease-out-expo);
}
.tile img.loaded + .lqip-bg,
.tile .lqip-bg.hidden {
  opacity: 0;
}

/* ─── Unified hover overlay ─── */
.tile::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.45);
  opacity: 0;
  transition: opacity 0.5s var(--ease-in-out);
  pointer-events: none;
  z-index: 2;
}

.tile:hover::after { opacity: 1; }

/* ─── Film Perforations ─── */
.film-perf-h, .film-perf-v {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  opacity: 1;
  transition: opacity 0.3s ease;
}

.film-perf-h {
  left: 3.5%;
  right: 3.5%;
  height: calc(var(--perf-dot-height, 8%) + 2%);
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-h.top { top: 2.5%; }
.film-perf-h.bottom { bottom: 2.5%; }

.film-perf-h .perf-dot {
  width: var(--perf-dot-width, 1.2%);
  height: var(--perf-dot-height, 8%);
  border-radius: 999px;
  background: var(--bg);
  flex-shrink: 0;
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.6),
    1px 1px 3px rgba(0,0,0,0.25),
    inset 2px 2px 4px rgba(0,0,0,0.45),
    inset -1px -1px 2px rgba(255,255,255,0.15);
  transition: box-shadow 0.4s ease, transform 0.4s var(--ease-out-expo);
}

.film-perf-v {
  top: 3.5%;
  bottom: 3.5%;
  width: calc(var(--perf-dot-width, 11%) + 2%);
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  gap: 1.5%;
}

.film-perf-v.left { left: 2.5%; }
.film-perf-v.right { right: 2.5%; }

.film-perf-v .perf-dot {
  width: var(--perf-dot-width, 11%);
  height: var(--perf-dot-height, 1.2%);
  border-radius: 999px;
  background: var(--bg);
  flex-shrink: 0;
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.6),
    1px 1px 3px rgba(0,0,0,0.25),
    inset 2px 2px 4px rgba(0,0,0,0.45),
    inset -1px -1px 2px rgba(255,255,255,0.15);
  transition: box-shadow 0.4s ease, transform 0.4s var(--ease-out-expo);
}

.tile:hover .film-perf-h,
.tile:hover .film-perf-v {
  opacity: 0.9;
}

.tile:hover .perf-dot {
  box-shadow:
    -1px -1px 2px rgba(255,255,255,0.7),
    1px 1px 4px rgba(0,0,0,0.35),
    inset 2.5px 2.5px 5px rgba(0,0,0,0.55),
    inset -1px -1px 2px rgba(255,255,255,0.2);
}

/* ─── Film shadow (subtle vignette) ─── */
.film-shadow {
  position: absolute;
  inset: 0;
  border-radius: var(--r-lg);
  pointer-events: none;
  z-index: 1;
  opacity: 0.5;
  transition: opacity 0.5s ease;
}

.tile:hover .film-shadow {
  opacity: 0.75;
}

.tile.photo-tile .film-shadow {
  box-shadow:
    inset 0 60px 40px -30px rgba(0, 0, 0, 0.7),
    inset 0 -60px 40px -30px rgba(0, 0, 0, 0.7);
}

.tile.video-tile .film-shadow {
  box-shadow:
    inset 60px 0 40px -30px rgba(0, 0, 0, 0.7),
    inset -60px 0 40px -30px rgba(0, 0, 0, 0.7);
}

/* ─── Hover info ─── */
.tile-hover {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  opacity: 0;
  transition: opacity 0.45s var(--ease-in-out);
}

.tile:hover .tile-hover {
  opacity: 1;
}

.tile-hover-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  color: #fff;
  line-height: 1.25;
  text-align: center;
  text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 1px 4px rgba(0,0,0,0.6);
  letter-spacing: 0.01em;
  max-width: 75%;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s 0.05s var(--ease-in-out), transform 0.4s 0.05s var(--ease-out-expo);
}

.tile:hover .tile-hover-title {
  opacity: 1;
  transform: translateY(0);
}

.tile-hover-year {
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.85);
  letter-spacing: 0.08em;
  text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.35s 0.15s var(--ease-in-out), transform 0.35s 0.15s var(--ease-out-expo);
}

.tile:hover .tile-hover-year {
  opacity: 1;
  transform: translateY(0);
}

.g-footer { content-visibility: auto; contain-intrinsic-size: auto 200px;
  padding: 60px 0 40px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
  margin-top: 40px;
}

.g-footer::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 2px;
  background: var(--accent);
  border-radius: 2px;
  opacity: 0.5;
}

.f-name {
  font-family: var(--serif);
  font-size: 26px;
  font-weight: 400;
  color: var(--text);
  text-wrap: balance;
}

.f-role {
  font-family: var(--sans);
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  margin-top: 8px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.f-contact {
  margin-top: 20px;
  font-family: var(--sans);
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  text-decoration: none;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--border);
  padding-bottom: 3px;
  transition: color 0.3s ease, border-color 0.3s ease;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.f-contact:hover { color: var(--accent); border-color: var(--accent); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.film-key-wrap {
  margin-top: 36px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  opacity: 0;
  animation: fadeUp 0.7s 0.5s var(--ease-out-expo) forwards;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}

.film-key-toggle {
  width: 28px;
  height: 28px;
  border-radius: var(--r-full);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: opacity 0.3s ease, border-color 0.3s ease, color 0.3s ease, background 0.3s ease;
  opacity: 0.5;
  cursor: pointer;
  padding: 0;
  flex-shrink: 0;
}

.film-key-toggle:hover {
  opacity: 1;
  border-color: var(--accent);
  color: var(--accent);
}

.film-key-toggle.active {
  opacity: 1;
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-subtle);
}

.film-key {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transform: translateY(-6px);
  transition: max-height 0.45s var(--ease-out-expo), opacity 0.35s ease, transform 0.35s var(--ease-out-expo), padding 0.35s ease;
  padding-top: 0;
}

.film-key.open {
  max-height: 120px;
  opacity: 1;
  transform: translateY(0);
  padding-top: 6px;
}

.film-key-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.film-key-strip {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
  flex-shrink: 0;
}

.film-key-strip-h {
  width: 26px;
  height: 9px;
  padding: 0 3px;
}

.film-key-strip-v {
  width: 9px;
  height: 26px;
  flex-direction: column;
  padding: 3px 0;
}

.film-key-strip .perf {
  display: block;
  background: var(--bg);
  border-radius: 999px;
  box-shadow:
    -0.5px -0.5px 1px rgba(255,255,255,0.5),
    0.5px 0.5px 1.5px rgba(0,0,0,0.2),
    inset 1px 1px 2px rgba(0,0,0,0.35),
    inset -0.5px -0.5px 1px rgba(255,255,255,0.1);
  flex-shrink: 0;
}

.film-key-strip-h .perf {
  width: 4.5px;
  height: 3px;
}

.film-key-strip-v .perf {
  width: 3px;
  height: 4.5px;
}

.film-key-row span {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.4;
}

@media (max-width: 880px) {
  .film-key-wrap {
    margin-top: 24px;
    border-top: none;
    padding-top: 0;
    margin-left: 2px;
  }
  .film-key.open {
    flex-direction: row;
    gap: 16px;
    padding-top: 6px;
  }
}

@media (max-width: 1024px) {
  .wrap { grid-template-columns: 210px 1fr; gap: 28px; }
  h1 { font-size: 48px; }
  .bento { contain: layout; grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 880px) {
  .wrap { grid-template-columns: 1fr; gap: 24px; padding: 16px; }
  .brand { position: static; }
  h1 { font-size: 44px; }
  .bento { contain: layout; grid-template-columns: repeat(2, 1fr); grid-auto-rows: 200px; }
  .tile.wide, .tile.large { grid-column: span 2; }
  .tile.tall { grid-row: span 2; }
}

@media (max-width: 640px) {
  .wrap { padding: 12px; }
  h1 { font-size: 36px; }
  .bento { contain: layout; grid-template-columns: 1fr; grid-auto-rows: 240px; }
  .tile.wide, .tile.tall, .tile.large { grid-column: span 1; grid-row: span 1; }
  .filter-row a { font-size: 11px; padding: 5px 10px; }
  .tile-hover-title { font-size: 16px; }
  .film-perf-h, .film-perf-v { display: none !important; }
  .tile-hover {
    position: absolute;
    left: 12px;
    bottom: 12px;
    right: 12px;
    padding: 0;
    transform: none !important;
    opacity: 1 !important;
    pointer-events: none;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .tile-hover-title {
    font-size: 16px;
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    text-align: left;
    opacity: 1;
    transform: none;
  }
  .tile-hover-year {
    font-size: 10px;
    opacity: 1;
    transform: none;
  }
  .tile::after { opacity: 0.35; }
  .tile .film-shadow { display: none !important; }
}

@media (max-width: 480px) {
  h1 { font-size: 32px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

<body>

<div class="wrap">

<script>
const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer = window.matchMedia('(pointer: fine)').matches;
let currentGroup = 'all';
let heroChars = [];
let gsapReady = false;

function ensureGsap() {
  if (gsapReady) return typeof gsap !== 'undefined';
  if (typeof gsap === 'undefined') return false;
  if (typeof Flip !== 'undefined') gsap.registerPlugin(Flip);
  if (typeof ScrollTrigger !== 'undefined') gsap.registerPlugin(ScrollTrigger);
  gsapReady = true;
  return true;
}

function splitChars(root) {
  const chars = [];
  const pushChars = (text, parent) => {
    for (const ch of text) {
      const c = document.createElement('span');
      c.className = 'h1-char';
      c.textContent = ch === ' ' ? ' ' : ch;
      c.setAttribute('aria-hidden', 'true');
      parent.appendChild(c);
      chars.push(c);
    }
  };
  Array.from(root.childNodes).forEach(node => {
    if (node.nodeType === Node.TEXT_NODE) {
      if (!node.textContent.trim()) return;
      const wrap = document.createElement('span');
      wrap.className = 'h1-word';
      root.insertBefore(wrap, node);
      pushChars(node.textContent, wrap);
      root.removeChild(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName === 'BR') {
      root.removeChild(node);
    } else if (node.nodeType === Node.ELEMENT_NODE && node.tagName !== 'BR') {
      const text = node.textContent;
      node.setAttribute('aria-label', text);
      node.textContent = '';
      pushChars(text, node);
    }
  });
  return chars;
}

function prepareHero() {
  if (prefersReduced) return;
  const h1 = document.querySelector('h1');
  if (!h1) return;
  heroChars = splitChars(h1);
  if (heroChars.length) document.documentElement.classList.add('lib-anim');
}

function initHeroAnim() {
  if (!heroChars.length) return;
  if (!window.Motion) { document.documentElement.classList.remove('lib-anim'); return; }
  Motion.animate(
    heroChars,
    { opacity: [0, 1], y: ['0.6em', '0em'], rotate: [8, 0] },
    { delay: Motion.stagger(0.03, { start: 0.12 }), duration: 0.75, easing: [0.16, 1, 0.3, 1] }
  );
}

prepareHero();

document.addEventListener('DOMContentLoaded', () => {
  initHeroAnim();
  ensureGsap();
});

function updateFilterPill(animate = false) {
  const row = document.getElementById('filterRow');
  const pill = document.getElementById('filterPill');
  const active = row.querySelector('a.active');
  if (!active) return;
  const rowRect = row.getBoundingClientRect();
  const aRect = active.getBoundingClientRect();
  const targetLeft = aRect.left - rowRect.left;
  const targetWidth = aRect.width;
  const targetTop = ((aRect.top - rowRect.top) + (aRect.height - 30) / 2);

  if (animate && window.Motion && !prefersReduced) {
    Motion.animate(pill, {
      left: targetLeft,
      width: targetWidth,
      top: targetTop
    }, { type: 'spring', stiffness: 420, damping: 34, mass: 0.9 });
  } else {
    pill.style.width = targetWidth + 'px';
    pill.style.left = targetLeft + 'px';
    pill.style.top = targetTop + 'px';
  }
}

async function initPortfolio() {
  const grid = document.getElementById('grid');

  try {
    const res = await fetch('./projects.json');
    if (!res.ok) throw new Error('JSON failed');
    let projects = await res.json();

    const imagePromises = [];

    for (const [idx, project] of projects.entries()) {
      let thumbnailSrc = project.thumbnail || '';
      let lqipSrc = null;
      if (!thumbnailSrc && project.media && project.media[0]) {
        const m = project.media[0];
        if (m.type === 'photo') thumbnailSrc = m.thumbnail || m.src;
        if (m.lqip) lqipSrc = m.lqip;
      }
      // Prefer project-level thumbnail LQIP if available
      if (project.lqip) lqipSrc = project.lqip;

      const a = document.createElement('a');
      a.href = 'project.html?id=' + project.id;
      a.className = 'tile ' + (project.layout || 'normal') + ' ' + (project.type === 'video' ? 'video-tile' : 'photo-tile');
      a.dataset.type = project.type;
      a.dataset.id = project.id;
      a.setAttribute('role', 'listitem');
      a.setAttribute('aria-label', project.title + (project.year ? ' (' + project.year + ')' : ''));

      const isVideo = project.type === 'video';
      const layout = project.layout || 'normal';
      const filmSizes = {
        photo: {
          normal: { width: 36, height: 24 },
          wide: { width: 42.7, height: 24 },
          tall: { width: 13.5, height: 24 }
        },
        video: {
          normal: { width: 24, height: 18.6 },
          wide: { width: 24, height: 14 },
          tall: { width: 24, height: 44.2 }
        }
      };
      const hole = { width: 2.79, height: 1.98, pitch: 4.75 };
      const frame = filmSizes[isVideo ? 'video' : 'photo'][layout] || filmSizes[isVideo ? 'video' : 'photo'].normal;
      const edgeLength = isVideo ? frame.height : frame.width;
      const count = Math.max(2, Math.round(edgeLength / hole.pitch));

      a.dataset.perfType = isVideo ? 'video' : 'photo';
      a.dataset.perfFrameWidth = frame.width;
      a.dataset.perfFrameHeight = frame.height;
      a.dataset.perfHoleWidth = hole.width;
      a.dataset.perfHoleHeight = hole.height;
      a.dataset.perfCount = count;
      a.dataset.src = (project.media && project.media[0] && project.media[0].src) ? project.media[0].src : '';

      const perfHtml = isVideo 
        ? '<div class="film-perf-v left">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-v right">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>'
        : '<div class="film-perf-h top">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>' + 
          '<div class="film-perf-h bottom">' + Array(count).fill('<div class="perf-dot"></div>').join('') + '</div>';

      a.innerHTML = '<div class="film-shadow"></div>' + perfHtml + 
        '<div class="tile-hover">' + 
          '<div class="tile-hover-title">' + project.title + '</div>' +
          (project.year ? '<div class="tile-hover-year">' + project.year + '</div>' : '') +
        '</div>';

      a.classList.add('skeleton');
      a.style.opacity = '0';
      a.style.transform = 'translateY(16px)';
      grid.appendChild(a);

      const rect = a.getBoundingClientRect();
      const pitchPx = isVideo ? (hole.pitch / frame.height) * rect.height : (hole.pitch / frame.width) * rect.width;
      const dotWidthPx = (hole.width / frame.width) * rect.width;
      const dotHeightPx = (hole.height / frame.height) * rect.height;

      const gapForH = Math.max(1, pitchPx - dotWidthPx);
      const gapForV = Math.max(1, pitchPx - dotHeightPx);

      a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
      a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

      const perfHTop = a.querySelector('.film-perf-h.top');
      const perfHBottom = a.querySelector('.film-perf-h.bottom');
      const perfVLeft = a.querySelector('.film-perf-v.left');
      const perfVRight = a.querySelector('.film-perf-v.right');

      if (perfHTop || perfHBottom) {
        const containerW = (count * dotWidthPx) + ((count - 1) * gapForH);
        [perfHTop, perfHBottom].forEach(el => {
          if (!el) return;
          el.style.width = Math.round(containerW) + 'px';
          el.style.left = '50%';
          el.style.transform = 'translateX(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForH) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      if (perfVLeft || perfVRight) {
        const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
        [perfVLeft, perfVRight].forEach(el => {
          if (!el) return;
          el.style.height = Math.round(containerH) + 'px';
          el.style.top = '50%';
          el.style.transform = 'translateY(-50%)';
          el.style.justifyContent = 'flex-start';
          el.style.gap = Math.round(gapForV) + 'px';
          el.querySelectorAll('.perf-dot').forEach(d => {
            d.style.width = Math.round(dotWidthPx) + 'px';
            d.style.height = Math.round(dotHeightPx) + 'px';
            d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
          });
        });
      }

      const imgPromise = new Promise(resolve => {
        const pxWrap = document.createElement('div');
        pxWrap.className = 'px-wrap';
        pxWrap.setAttribute('string', 'parallax');
        pxWrap.setAttribute('string-parallax', '0.05');

        // LQIP placeholder background
        if (lqipSrc) {
          const lqipDiv = document.createElement('div');
          lqipDiv.className = 'lqip-bg';
          lqipDiv.style.backgroundImage = 'url(' + lqipSrc + ')';
          pxWrap.appendChild(lqipDiv);
        }

        const img = document.createElement('img');
        img.src = thumbnailSrc ? encodeURI(thumbnailSrc) : '';
        img.alt = project.title || '';
        img.loading = idx < 3 ? 'eager' : 'lazy';
        img.decoding = 'async';
        const tileRect = a.getBoundingClientRect();
        if (tileRect.width && tileRect.height) {
          img.width = Math.round(tileRect.width);
          img.height = Math.round(tileRect.height);
          img.style.aspectRatio = tileRect.width / tileRect.height;
        }
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = 'cover';
        img.style.opacity = '0';
        img.style.transition = 'opacity 0.6s var(--ease-out-expo)';

        img.onload = () => {
          img.classList.add('loaded');
          requestAnimationFrame(() => {
            img.style.opacity = '1';
            setTimeout(() => {
              a.classList.remove('skeleton');
            }, 600);
          });
          resolve();
        };
        img.onerror = () => {
          a.classList.remove('skeleton');
          resolve();
        };
        pxWrap.appendChild(img);
        a.insertBefore(pxWrap, a.firstChild);
      });
      imagePromises.push(imgPromise);
    }

    const tiles = Array.from(document.querySelectorAll('.tile'));
    if (window.Motion && !prefersReduced) {
      Motion.animate(
        tiles,
        { opacity: [0, 1], y: [16, 0] },
        { delay: Motion.stagger(0.06), duration: 0.6, easing: [0.16, 1, 0.3, 1] }
      ).finished.then(() => {
        tiles.forEach(t => { t.style.opacity = ''; t.style.transform = ''; });
      }).catch(() => {});
    } else {
      tiles.forEach((t, i) => {
        setTimeout(() => {
          t.style.opacity = '1';
          t.style.transform = 'translateY(0)';
          if (i === tiles.length - 1) {
            setTimeout(() => {
              tiles.forEach(tile => {
                tile.style.opacity = '';
                tile.style.transform = '';
              });
            }, 100);
          }
        }, prefersReduced ? 0 : i * 70);
      });
    }

    initEventListeners();
    initScrollAnimations();
    setTimeout(() => { updateFilterPill(); recalcPerforations(); }, 50);

  } catch(err) {
    console.error(err);
    grid.innerHTML = '<div style="padding:40px;color:var(--muted);font-size:13px;">Failed to load projects.json</div>';
  }
}

document.getElementById('filmKeyToggle').addEventListener('click', function() {
  const panel = document.getElementById('filmKeyPanel');
  const isOpen = panel.classList.toggle('open');
  this.classList.toggle('active', isOpen);
  this.setAttribute('aria-expanded', isOpen);
  panel.setAttribute('aria-hidden', !isOpen);

  if (window.Motion && !prefersReduced) {
    Motion.animate(this.querySelector('i'), { rotate: isOpen ? 90 : 0 }, { type: 'spring', stiffness: 320, damping: 22 });
    if (isOpen) {
      const rows = panel.querySelectorAll('.film-key-row');
      Motion.animate(
        rows,
        { opacity: [0, 1], x: [-8, 0] },
        { delay: Motion.stagger(0.09), duration: 0.45, easing: [0.16, 1, 0.3, 1] }
      );
    }
  }
});

function initEventListeners() {
  document.querySelectorAll('.filter-row a').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      document.querySelectorAll('.filter-row a').forEach(a => a.classList.remove('active'));
      link.classList.add('active');
      updateFilterPill(true);
      currentGroup = link.dataset.group;
      filterTiles();
    });
    link.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        link.click();
      }
    });
  });

  window.addEventListener('resize', () => {
    requestAnimationFrame(updateFilterPill);
    requestAnimationFrame(recalcPerforations);
  });
}

function recalcPerforations() {
  const tiles = Array.from(document.querySelectorAll('.tile'));
  tiles.forEach(a => {
    const type = a.dataset.perfType;
    if (!type) return;
    const frameW = parseFloat(a.dataset.perfFrameWidth);
    const frameH = parseFloat(a.dataset.perfFrameHeight);
    const holeW = parseFloat(a.dataset.perfHoleWidth);
    const holeH = parseFloat(a.dataset.perfHoleHeight);
    const count = parseInt(a.dataset.perfCount, 10) || 2;
    const rect = a.getBoundingClientRect();
    const isVideo = type === 'video';
    const pitchPx = isVideo ? (4.75 / frameH) * rect.height : (4.75 / frameW) * rect.width;
    const dotWidthPx = (holeW / frameW) * rect.width;
    const dotHeightPx = (holeH / frameH) * rect.height;
    const gapForH = Math.max(1, pitchPx - dotWidthPx);
    const gapForV = Math.max(1, pitchPx - dotHeightPx);
    a.style.setProperty('--perf-dot-width', Math.round(dotWidthPx) + 'px');
    a.style.setProperty('--perf-dot-height', Math.round(dotHeightPx) + 'px');

    const perfHTop = a.querySelector('.film-perf-h.top');
    const perfHBottom = a.querySelector('.film-perf-h.bottom');
    const perfVLeft = a.querySelector('.film-perf-v.left');
    const perfVRight = a.querySelector('.film-perf-v.right');
    if (perfHTop || perfHBottom) {
      const containerW = (count * dotWidthPx) + ((count - 1) * gapForH);
      [perfHTop, perfHBottom].forEach(el => {
        if (!el) return;
        el.style.width = Math.round(containerW) + 'px';
        el.style.left = '50%';
        el.style.transform = 'translateX(-50%)';
        el.style.justifyContent = 'flex-start';
        el.style.gap = Math.round(gapForH) + 'px';
        el.querySelectorAll('.perf-dot').forEach(d => {
          d.style.width = Math.round(dotWidthPx) + 'px';
          d.style.height = Math.round(dotHeightPx) + 'px';
          d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
        });
      });
    }
    if (perfVLeft || perfVRight) {
      const containerH = (count * dotHeightPx) + ((count - 1) * gapForV);
      [perfVLeft, perfVRight].forEach(el => {
        if (!el) return;
        el.style.height = Math.round(containerH) + 'px';
        el.style.top = '50%';
        el.style.transform = 'translateY(-50%)';
        el.style.justifyContent = 'flex-start';
        el.style.gap = Math.round(gapForV) + 'px';
        el.querySelectorAll('.perf-dot').forEach(d => {
          d.style.width = Math.round(dotWidthPx) + 'px';
          d.style.height = Math.round(dotHeightPx) + 'px';
          d.style.borderRadius = Math.max(2, Math.round(Math.min(dotWidthPx, dotHeightPx) / 4)) + 'px';
        });
      });
    }
  });
}

function filterTiles() {
  const tiles = Array.from(document.querySelectorAll('.tile'));

  const visible = [];
  const hidden = [];
  tiles.forEach(t => {
    const match = currentGroup === 'all' || t.dataset.type === currentGroup;
    (match ? visible : hidden).push(t);
  });

  const useFlip = ensureGsap() && typeof Flip !== 'undefined' && !prefersReduced;

  if (!useFlip) {
    tiles.forEach(t => {
      const match = visible.includes(t);
      t.style.display = match ? '' : 'none';
      t.style.opacity = match ? '1' : '0';
      t.style.transform = '';
    });
    recalcPerforations();
    return;
  }

  const previouslyVisible = tiles.filter(t => t.style.display !== 'none');
  const entering = visible.filter(t => t.style.display === 'none');
  const state = Flip.getState(previouslyVisible);

  hidden.forEach(t => { t.style.display = 'none'; t.style.opacity = '0'; });
  visible.forEach(t => { t.style.display = ''; });

  tiles.forEach(t => { t.style.transition = 'none'; t.style.willChange = 'transform, opacity'; });

  Flip.from(state, {
    duration: 0.5,
    ease: 'expo.out',
    scale: false,
    absolute: false,
    stagger: 0.02,
    onComplete: () => {
      tiles.forEach(t => {
        t.style.transition = '';
        t.style.transform = '';
        t.style.willChange = '';
        gsap.set(t, { clearProps: 'transform,opacity' });
      });
      recalcPerforations();
    }
  });

  if (entering.length) {
    gsap.fromTo(entering,
      { opacity: 0, y: 14, scale: 0.96 },
      {
        opacity: 1, y: 0, scale: 1,
        duration: 0.45,
        ease: 'expo.out',
        stagger: 0.035,
        delay: 0.5,
        onComplete: () => entering.forEach(t => gsap.set(t, { clearProps: 'transform,opacity' }))
      });
  }
}

function initScrollAnimations() {
  const footer = document.querySelector('.g-footer');
  if (!footer || prefersReduced) return;
  if (!ensureGsap() || typeof ScrollTrigger === 'undefined') return;
  const targets = footer.querySelectorAll('.f-name, .f-role, .f-contact');
  gsap.set(targets, { opacity: 0, y: 12 });
  gsap.to(targets, {
    opacity: 1,
    y: 0,
    duration: 0.6,
    ease: 'expo.out',
    stagger: 0.08,
    scrollTrigger: { trigger: footer, start: 'top 90%', once: true },
    onComplete: () => gsap.set(targets, { clearProps: 'transform' })
  });
}

initPortfolio();
</script>
