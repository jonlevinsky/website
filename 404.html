<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Stránka nenalezena — Jan Levínský, cinematography & photography.">
<meta name="theme-color" content="#2c3e50">

<meta property="og:title" content="404 — Jan Levínský">
<meta property="og:description" content="Stránka nenalezena.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://levinskyj.art/404.html">
<meta property="og:image" content="https://levinskyj.art/media/og-cover.webp">
<meta name="twitter:card" content="summary_large_image">

<title>Jan Levínský // 404</title>
<link rel="canonical" href="https://levinskyj.art/404.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Outfit:wght@300;400;500;600&display=swap"></noscript>
<link rel="stylesheet" href="style.css">
<style>
._404-page {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 80px 24px;
  min-height: calc(100vh - 48px);
}
._404-page h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 72px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--text);
  margin-bottom: 12px;
  opacity: 0;
  animation: fadeUp 0.7s 0.1s var(--ease-out-expo) forwards;
}
._404-page p {
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.75;
  max-width: 340px;
  margin-bottom: 32px;
  opacity: 0;
  animation: fadeUp 0.7s 0.25s var(--ease-out-expo) forwards;
}
._404-page a {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 22px;
  border-radius: var(--r-md);
  background: var(--accent);
  color: var(--text-on-accent);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  opacity: 0;
  animation: fadeUp 0.7s 0.4s var(--ease-out-expo) forwards;
  transition: opacity 0.25s ease, transform 0.25s var(--ease-out-expo);
}
._404-page a:hover { opacity: 0.88; transform: translateY(-1px); }
._404-page a i { font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <aside class="brand">
    <div class="brand-top">
      <div>
        <div class="kicker">Error 404</div>
        <div class="brand-title-row">
          <img src="./media/logo.png" alt="LJ" class="logo-mark">
          <h1>
            <span>Jan</span>
            <span class="last">Levínský</span>
          </h1>
        </div>
      </div>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="brand-panel" id="brandPanel" aria-hidden="true">
      <div class="divider"></div>
      <div class="intro">
        Kameraman, fotograf a student filmové tvorby.
      </div>
      <nav class="links">
        <a href="https://www.instagram.com/levinskyj.cine/" target="_blank" rel="noopener noreferrer"><i class="ph ph-instagram-logo"></i>Instagram</a>
        <a href="https://www.youtube.com/@LevinskyJ" target="_blank" rel="noopener noreferrer"><i class="ph ph-youtube-logo"></i>YouTube</a>
        <a href="mailto:levinskyj.cine@gmail.com"><i class="ph ph-envelope"></i>Email</a>
        <a href="./"><i class="ph ph-arrow-left"></i> Zpět na portfolio</a>
      </nav>
    </div>
  </aside>

  <main>
    <div class="_404-page">
      <div class="kicker" style="position:static;animation:fadeUp 0.7s 0.05s var(--ease-out-expo) forwards;margin-bottom:16px;color:var(--accent)">404</div>
      <h2>Stránka nenalezena</h2>
      <p>Možná byla přesunuta nebo jste zadali špatnou adresu.</p>
      <a href="./"><i class="ph ph-arrow-left"></i> Zpět na portfolio</a>
    </div>
  </main>
</div>

<script src="main.js"></script>
<script>
document.querySelector('.brand-title-row .logo-mark')?.addEventListener('animationend', function() { this.classList.add('anim-done'); });
</script>
</body>
</html>
