<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Base ─────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0a0a0a;
  --surface:      #111111;
  --surface-2:    #1a1a1a;
  --surface-3:    #222222;
  --border:       #2a2a2a;
  --border-hi:    #383838;
  --ink:          #e8e8e8;
  --ink-2:        #999999;
  --ink-3:        #555555;
  --accent:       #c8c8c8;
  --mono:         'Share Tech Mono', monospace;
  --sans:         'Inter', system-ui, sans-serif;
  --radius:       4px;
  --radius-lg:    8px;

  /* Anodized metal gradient */
  --metal-grad:   linear-gradient(160deg,
                    #2a2a2a 0%,
                    #1e1e1e 35%,
                    #242424 50%,
                    #1a1a1a 65%,
                    #202020 100%);
  --metal-border: linear-gradient(160deg, #3a3a3a, #1a1a1a, #303030);

  --z-lightbox:   100;
  --z-toast:      200;

  color-scheme: dark;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ─── Lock Screen ───────────────────────────────────────────────────────── */
#lock-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  z-index: 999;
  transition: opacity 0.4s ease, visibility 0.4s ease;
}
#lock-screen.hidden { opacity: 0; visibility: hidden; }

.lock-card {
  width: min(360px, 92vw);
  background: var(--metal-grad);
  border: 1px solid transparent;
  background-clip: padding-box;
  position: relative;
  border-radius: var(--radius-lg);
  padding: 40px 36px 36px;
  box-shadow:
    0 0 0 1px #2e2e2e,
    0 1px 0 0 #3a3a3a inset,
    0 -1px 0 0 #141414 inset,
    0 32px 80px rgba(0,0,0,0.8),
    0 8px 24px rgba(0,0,0,0.5);
}

/* Decorative milled groove top edge */
.lock-card::before {
  content: '';
  position: absolute;
  top: 0; left: 16px; right: 16px;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    #404040 20%,
    #505050 50%,
    #404040 80%,
    transparent 100%);
}

.lock-icon {
  width: 44px; height: 44px;
  margin: 0 auto 28px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 50%;
  box-shadow:
    0 2px 8px rgba(0,0,0,0.5),
    0 1px 0 #2e2e2e inset;
}
.lock-icon svg { width: 20px; height: 20px; color: var(--ink-2); }

.lock-title {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-3);
  text-align: center;
  margin-bottom: 6px;
}
.lock-subtitle {
  font-size: 18px;
  font-weight: 300;
  color: var(--ink);
  text-align: center;
  margin-bottom: 32px;
  letter-spacing: -0.01em;
}

.field-wrap {
  position: relative;
  margin-bottom: 12px;
}
.field-wrap label {
  display: block;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 7px;
}
.field-wrap input {
  width: 100%;
  background: #0d0d0d;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.4) inset;
  letter-spacing: 0.06em;
}
.field-wrap input:focus {
  border-color: var(--border-hi);
  box-shadow: 0 2px 8px rgba(0,0,0,0.4) inset, 0 0 0 2px rgba(200,200,200,0.05);
}
.field-wrap input::placeholder { color: var(--ink-3); letter-spacing: 0.04em; }

/* Metal button */
.btn-unlock {
  width: 100%;
  margin-top: 20px;
  padding: 11px 20px;
  background: linear-gradient(175deg, #2c2c2c 0%, #1c1c1c 100%);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: all 0.12s ease;
  box-shadow:
    0 1px 0 #3e3e3e inset,
    0 -1px 0 #121212 inset,
    0 4px 12px rgba(0,0,0,0.4);
}
.btn-unlock:hover {
  background: linear-gradient(175deg, #323232 0%, #222222 100%);
  border-color: #404040;
  transform: translateY(-1px);
  box-shadow:
    0 1px 0 #444 inset,
    0 -1px 0 #141414 inset,
    0 6px 16px rgba(0,0,0,0.5);
}
.btn-unlock:active {
  transform: translateY(1px);
  box-shadow:
    0 1px 0 #111 inset,
    0 -1px 0 #2a2a2a inset,
    0 2px 6px rgba(0,0,0,0.4);
}
.btn-unlock:disabled {
  opacity: 0.5;
  cursor: default;
  transform: none;
}

.lock-error {
  font-family: var(--mono);
  font-size: 11px;
  color: #e05050;
  text-align: center;
  margin-top: 14px;
  min-height: 16px;
  letter-spacing: 0.04em;
}

/* Progress bar inside lock card */
.unlock-progress {
  margin-top: 16px;
  display: none;
}
.unlock-progress.visible { display: block; }
.progress-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
}
.progress-track {
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.3s ease;
  border-radius: 1px;
}

/* Decorative corner screws */
.lock-card .screw {
  position: absolute;
  width: 8px; height: 8px;
  border: 1px solid #2e2e2e;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #2a2a2a, #141414);
  box-shadow: 0 1px 2px rgba(0,0,0,0.5);
}
.lock-card .screw::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(45deg);
  width: 60%; height: 1px;
  background: #333;
}
.screw.tl { top: 10px; left: 10px; }
.screw.tr { top: 10px; right: 10px; }
.screw.bl { bottom: 10px; left: 10px; }
.screw.br { bottom: 10px; right: 10px; }

/* ─── Gallery Shell ─────────────────────────────────────────────────────── */
#gallery-shell {
  min-height: 100vh;
  opacity: 0;
  transition: opacity 0.4s ease;
}
#gallery-shell.visible { opacity: 1; }

/* Header */
.g-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky; top: 0;
  z-index: 10;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.g-title {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.g-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
}
.g-lock-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 10px;
  cursor: pointer;
  transition: all 0.12s;
}
.g-lock-btn:hover { border-color: var(--border-hi); color: var(--ink-2); }

/* Filter bar */
.g-filters {
  display: flex;
  gap: 6px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.filter-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 10px;
  cursor: pointer;
  transition: all 0.12s;
}
.filter-btn:hover { border-color: var(--border-hi); color: var(--ink-2); }
.filter-btn.active {
  background: var(--surface-3);
  border-color: var(--accent);
  color: var(--accent);
}

/* Grid */
.g-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 2px;
  padding: 2px;
}

/* Grid Item */
.g-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--surface);
  cursor: pointer;
}
.g-item-inner {
  position: relative;
  width: 100%; height: 100%;
}
.g-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.g-item:hover img { transform: scale(1.04); }

/* Skeleton loader */
.g-item-skeleton {
  position: absolute; inset: 0;
  background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
}
.g-item-skeleton::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.04) 50%,
    transparent 100%);
  animation: shimmer 1.6s ease infinite;
  background-size: 200% 100%;
}
@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

/* Overlay on hover */
.g-item-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top,
    rgba(0,0,0,0.7) 0%,
    rgba(0,0,0,0) 50%);
  opacity: 0;
  transition: opacity 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px;
}
.g-item:hover .g-item-overlay { opacity: 1; }

.g-item-name {
  font-family: var(--mono);
  font-size: 10px;
  color: #e0e0e0;
  letter-spacing: 0.06em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.g-item-info {
  font-family: var(--mono);
  font-size: 9px;
  color: #888;
  margin-top: 2px;
  letter-spacing: 0.04em;
}

/* Video badge */
.video-badge {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: var(--radius);
  padding: 3px 7px;
  font-family: var(--mono);
  font-size: 9px;
  color: #ccc;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  backdrop-filter: blur(4px);
}

/* Decrypting indicator */
.g-item-dec {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.5);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
}

/* ─── Lightbox ──────────────────────────────────────────────────────────── */
#lightbox {
  position: fixed; inset: 0;
  z-index: var(--z-lightbox);
  display: none;
  flex-direction: column;
  background: rgba(0,0,0,0.96);
}
#lightbox.open { display: flex; }

.lb-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.lb-filename {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  letter-spacing: 0.08em;
}
.lb-actions { display: flex; gap: 8px; align-items: center; }

.lb-btn {
  display: flex; align-items: center; gap: 6px;
  background: linear-gradient(175deg, #242424 0%, #181818 100%);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 6px 12px;
  cursor: pointer;
  transition: all 0.12s;
  box-shadow: 0 1px 0 #2e2e2e inset, 0 -1px 0 #111 inset;
}
.lb-btn:hover {
  background: linear-gradient(175deg, #2e2e2e 0%, #1e1e1e 100%);
  border-color: #484848;
  color: var(--ink);
  transform: translateY(-1px);
}
.lb-btn:active { transform: translateY(1px); }
.lb-btn svg { width: 13px; height: 13px; }
.lb-btn.loading { opacity: 0.6; cursor: wait; pointer-events: none; }

.lb-close {
  background: none;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink-3);
  font-family: var(--mono);
  font-size: 13px;
  width: 30px; height: 30px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  margin-left: 4px;
}
.lb-close:hover { border-color: var(--border-hi); color: var(--ink); }

.lb-stage {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 20px;
  position: relative;
}
.lb-stage img,
.lb-stage video {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  display: block;
  border-radius: var(--radius);
}
.lb-stage video { background: #000; }

.lb-nav-btn {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink-2);
  width: 36px; height: 60px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  backdrop-filter: blur(4px);
}
.lb-nav-btn:hover { background: rgba(30,30,30,0.9); border-color: var(--border-hi); color: var(--ink); }
.lb-nav-btn.prev { left: 12px; }
.lb-nav-btn.next { right: 12px; }
.lb-nav-btn svg { width: 16px; height: 16px; }

/* LB download progress */
.lb-dl-progress {
  position: absolute;
  bottom: 16px; left: 50%; transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  display: none;
  align-items: center; gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  white-space: nowrap;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.lb-dl-progress.visible { display: flex; }
.lb-dl-track {
  width: 120px; height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.lb-dl-fill {
  height: 100%;
  background: var(--accent);
  width: 0%;
  transition: width 0.2s;
}

.lb-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 20px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.lb-counter {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
}

/* ─── Toast ─────────────────────────────────────────────────────────────── */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface-2);
  border: 1px solid var(--border-hi);
  border-radius: var(--radius);
  color: var(--ink-2);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  padding: 10px 16px;
  z-index: var(--z-toast);
  transform: translateY(100%) scale(0.95);
  opacity: 0;
  transition: all 0.2s ease;
  pointer-events: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
}
#toast.show { transform: translateY(0) scale(1); opacity: 1; }

/* ─── Empty / Error states ──────────────────────────────────────────────── */
.state-message {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 12px;
  padding: 40px;
  text-align: center;
}
.state-message .state-icon {
  font-size: 32px;
  margin-bottom: 8px;
  opacity: 0.4;
}
.state-message h2 {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 400;
}
.state-message p {
  font-size: 13px;
  color: var(--ink-3);
  max-width: 360px;
}

/* ─── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 600px) {
  .g-header { padding: 14px 16px; }
  .g-filters { padding: 10px 16px; }
  .g-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  .lb-header { padding: 10px 14px; }
  .lb-filename { font-size: 10px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-nav-btn { width: 28px; height: 48px; }
}

/* ─── Motion ────────────────────────────────────────────────────────────── */
.g-item { animation: fadeIn 0.3s ease both; }
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to   { opacity: 1; transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .g-item { animation: none; }
  .g-item img { transition: none; }
}
</style>
</head>
<body>

<!-- ─── Lock Screen ──────────────────────────────────────────────────────── -->
<div id="lock-screen">
  <div class="lock-card">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="lock-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <div class="lock-title">Secure Gallery</div>
    <div class="lock-subtitle" id="gallery-title-lock">Přístup chráněný heslem</div>

    <div class="field-wrap">
      <label>Heslo</label>
      <input type="password" id="password-input" placeholder="••••••••••••" autocomplete="current-password">
    </div>

    <button class="btn-unlock" id="unlock-btn" onclick="unlock()">
      Odemknout
    </button>

    <div class="unlock-progress" id="unlock-progress">
      <div class="progress-label">Odvozuji klíč…</div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div class="lock-error" id="lock-error"></div>
  </div>
</div>

<!-- ─── Gallery Shell ────────────────────────────────────────────────────── -->
<div id="gallery-shell">
  <header class="g-header">
    <div class="g-title" id="gallery-title">Gallery</div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="g-meta" id="gallery-meta"></div>
      <button class="g-lock-btn" onclick="lockGallery()">Zamknout</button>
    </div>
  </header>

  <div class="g-filters" id="filter-bar">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Vše</button>
    <button class="filter-btn" data-filter="image" onclick="setFilter('image',this)">Fotky</button>
    <button class="filter-btn" data-filter="video" onclick="setFilter('video',this)">Videa</button>
  </div>

  <div class="g-grid" id="grid"></div>
</div>

<!-- ─── Lightbox ─────────────────────────────────────────────────────────── -->
<div id="lightbox">
  <div class="lb-header">
    <div class="lb-filename" id="lb-filename">—</div>
    <div class="lb-actions">
      <button class="lb-btn" id="lb-dl-btn" onclick="downloadFull()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Full rozlišení
      </button>
      <button class="lb-close" onclick="closeLightbox()">✕</button>
    </div>
  </div>

  <div class="lb-stage">
    <button class="lb-nav-btn prev" onclick="navigate(-1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>

    <div id="lb-content"></div>

    <button class="lb-nav-btn next" onclick="navigate(1)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </button>

    <div class="lb-dl-progress" id="lb-dl-progress">
      <span id="lb-dl-label">Stahování…</span>
      <div class="lb-dl-track"><div class="lb-dl-fill" id="lb-dl-fill"></div></div>
    </div>
  </div>

  <div class="lb-footer">
    <span class="lb-counter" id="lb-counter"></span>
  </div>
</div>

<!-- ─── Toast ────────────────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
// ─── State ────────────────────────────────────────────────────────────────

let cryptoKey   = null;   // CryptoKey (AES-GCM)
let manifest    = null;   // Parsed manifest.json
let currentFilter = 'all';
let filteredItems = [];
let lbIndex     = -1;
let lbThumbURLs = new Map(); // id → blob URL of decrypted thumbnail

// ─── Crypto Utilities ─────────────────────────────────────────────────────

async function deriveKey(password, saltHex, iterations) {
  const enc = new TextEncoder();
  const salt = hexToBytes(saltHex);

  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

async function decryptBytes(encryptedBuf, key) {
  const nonce = encryptedBuf.slice(0, 12);
  const ct    = encryptedBuf.slice(12);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: nonce }, key, ct);
}

function hexToBytes(hex) {
  const arr = new Uint8Array(hex.length / 2);
  for (let i = 0; i < arr.length; i++)
    arr[i] = parseInt(hex.slice(i*2, i*2+2), 16);
  return arr;
}

// ─── Fetch + Decrypt ───────────────────────────────────────────────────────

async function fetchAndDecrypt(path, onProgress) {
  const resp = await fetch(path);
  if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${path}`);

  // Stream with progress
  const contentLength = +resp.headers.get('Content-Length') || 0;
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (onProgress && contentLength) onProgress(received / contentLength);
  }

  const combined = new Uint8Array(received);
  let offset = 0;
  for (const chunk of chunks) { combined.set(chunk, offset); offset += chunk.length; }

  return decryptBytes(combined.buffer, cryptoKey);
}

// ─── Lock / Unlock ────────────────────────────────────────────────────────

async function unlock() {
  const pw = document.getElementById('password-input').value;
  if (!pw) { showError('Zadej heslo'); return; }

  const btn  = document.getElementById('unlock-btn');
  const prog = document.getElementById('unlock-progress');
  const fill = document.getElementById('progress-fill');

  btn.disabled = true;
  showError('');
  prog.classList.add('visible');

  // Animate progress bar (PBKDF2 blocks the thread — fake it)
  let p = 0;
  const ticker = setInterval(() => {
    p = Math.min(p + Math.random() * 12, 90);
    fill.style.width = p + '%';
  }, 180);

  try {
    // Load manifest first
    if (!manifest) {
      const resp = await fetch('manifest.json');
      if (!resp.ok) throw new Error('manifest.json nenalezen');
      manifest = await resp.json();
      document.getElementById('gallery-title').textContent = manifest.title || 'Gallery';
      document.getElementById('gallery-title-lock').textContent = manifest.title || 'Galerie';
    }

    cryptoKey = await deriveKey(pw, manifest.salt, manifest.iterations || 600000);

    // Verify key by decrypting the first item's thumbnail
    if (manifest.items?.length) {
      await fetchAndDecrypt(manifest.items[0].thumb);
    }

    clearInterval(ticker);
    fill.style.width = '100%';
    await sleep(200);

    // Unlock!
    document.getElementById('lock-screen').classList.add('hidden');
    document.getElementById('gallery-shell').classList.add('visible');
    renderGallery();

  } catch (err) {
    clearInterval(ticker);
    fill.style.width = '0%';
    prog.classList.remove('visible');
    btn.disabled = false;

    if (err.name === 'OperationError' || err.message?.includes('decrypt')) {
      showError('Nesprávné heslo');
    } else {
      showError(err.message || 'Chyba při odemykání');
    }
  }
}

function lockGallery() {
  cryptoKey = null;
  lbThumbURLs.forEach(url => URL.revokeObjectURL(url));
  lbThumbURLs.clear();
  filteredItems = [];
  lbIndex = -1;
  document.getElementById('grid').innerHTML = '';
  document.getElementById('gallery-shell').classList.remove('visible');
  document.getElementById('lock-screen').classList.remove('hidden');
  document.getElementById('password-input').value = '';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('unlock-progress').classList.remove('visible');
  document.getElementById('unlock-btn').disabled = false;
  closeLightbox();
}

function showError(msg) {
  document.getElementById('lock-error').textContent = msg;
}

document.getElementById('password-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') unlock();
});

// ─── Gallery Rendering ────────────────────────────────────────────────────

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGallery();
}

function renderGallery() {
  const items = manifest?.items || [];
  filteredItems = currentFilter === 'all'
    ? items
    : items.filter(i => i.type === currentFilter);

  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  // Update meta
  const imgCount = items.filter(i => i.type === 'image').length;
  const vidCount = items.filter(i => i.type === 'video').length;
  const parts = [];
  if (imgCount) parts.push(`${imgCount} foto`);
  if (vidCount) parts.push(`${vidCount} video`);
  document.getElementById('gallery-meta').textContent = parts.join(' · ');

  // Hide/show filter bar
  const hasVideos = vidCount > 0;
  const hasImages = imgCount > 0;
  document.getElementById('filter-bar').style.display =
    (hasVideos && hasImages) ? 'flex' : 'none';

  if (!filteredItems.length) {
    grid.innerHTML = `
      <div class="state-message" style="grid-column:1/-1">
        <div class="state-icon">◻</div>
        <h2>Prázdná galerie</h2>
        <p>Žádné soubory nebyly nalezeny.</p>
      </div>`;
    return;
  }

  filteredItems.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'g-item';
    el.style.animationDelay = Math.min(idx * 30, 300) + 'ms';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="g-item-inner">
        <div class="g-item-skeleton" id="skel-${item.id}"></div>
        ${item.type === 'video' ? `<div class="video-badge">▶ VIDEO</div>` : ''}
        <div class="g-item-overlay">
          <div class="g-item-name">${escapeHtml(item.name)}</div>
          <div class="g-item-info">${formatSize(item.size)}${item.width ? ` · ${item.width}×${item.height}` : ''}${item.duration ? ` · ${formatDuration(item.duration)}` : ''}</div>
        </div>
      </div>`;
    el.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(el);

    // Lazy-load thumbnail
    loadThumb(item, el);
  });
}

async function loadThumb(item, el) {
  try {
    let blobUrl = lbThumbURLs.get(item.id);
    if (!blobUrl) {
      const decrypted = await fetchAndDecrypt(item.thumb);
      const mimeType = item.type === 'video' ? 'image/jpeg' : `image/${item.ext === 'jpg' ? 'jpeg' : (item.ext || 'jpeg')}`;
      const blob = new Blob([decrypted], { type: mimeType });
      blobUrl = URL.createObjectURL(blob);
      lbThumbURLs.set(item.id, blobUrl);
    }

    const skel = el.querySelector(`#skel-${item.id}`);
    const img = document.createElement('img');
    img.src = blobUrl;
    img.alt = item.name;
    img.loading = 'lazy';
    img.addEventListener('load', () => skel?.remove());
    el.querySelector('.g-item-inner').insertBefore(img, el.querySelector('.g-item-overlay'));
  } catch (err) {
    const skel = el.querySelector(`#skel-${item.id}`);
    if (skel) skel.innerHTML = `<span style="font-family:var(--mono);font-size:9px;color:#555;letter-spacing:.08em">ERR</span>`;
  }
}

// ─── Lightbox ─────────────────────────────────────────────────────────────

function openLightbox(idx) {
  lbIndex = idx;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
  showLightboxItem(idx);
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  const content = document.getElementById('lb-content');
  const video = content.querySelector('video');
  if (video) video.pause();
  content.innerHTML = '';
}

function navigate(dir) {
  lbIndex = (lbIndex + dir + filteredItems.length) % filteredItems.length;
  showLightboxItem(lbIndex);
}

async function showLightboxItem(idx) {
  const item = filteredItems[idx];
  if (!item) return;

  const content = document.getElementById('lb-content');
  // Pause any existing video
  const oldVideo = content.querySelector('video');
  if (oldVideo) oldVideo.pause();

  document.getElementById('lb-filename').textContent = item.name;
  document.getElementById('lb-counter').textContent =
    `${idx + 1} / ${filteredItems.length}`;

  // Show thumbnail first
  let blobUrl = lbThumbURLs.get(item.id);
  if (!blobUrl) {
    content.innerHTML = `<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em">Dešifruji náhled…</div>`;
    try {
      const dec = await fetchAndDecrypt(item.thumb);
      const blob = new Blob([dec], { type: 'image/jpeg' });
      blobUrl = URL.createObjectURL(blob);
      lbThumbURLs.set(item.id, blobUrl);
    } catch (e) {
      content.innerHTML = `<div style="font-family:var(--mono);font-size:11px;color:#e05050">Chyba načítání</div>`;
      return;
    }
  }

  if (item.type === 'video') {
    content.innerHTML = `<img src="${blobUrl}" alt="${escapeHtml(item.name)}" style="max-width:100%;max-height:70vh;object-fit:contain;border-radius:4px;opacity:.7">
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.1em;text-align:center;pointer-events:none">
        ▶ Klikni "Full rozlišení" pro přehrání videa
      </div>`;
  } else {
    content.innerHTML = `<img src="${blobUrl}" alt="${escapeHtml(item.name)}" style="max-width:100%;max-height:80vh;object-fit:contain;border-radius:4px">`;
  }
}

// ─── Download Full Resolution ─────────────────────────────────────────────

async function downloadFull() {
  const item = filteredItems[lbIndex];
  if (!item) return;

  const btn  = document.getElementById('lb-dl-btn');
  const prog = document.getElementById('lb-dl-progress');
  const fill = document.getElementById('lb-dl-fill');
  const label = document.getElementById('lb-dl-label');

  btn.classList.add('loading');
  btn.textContent = 'Stahování…';
  prog.classList.add('visible');
  fill.style.width = '0%';
  label.textContent = 'Stahování…';

  try {
    const decrypted = await fetchAndDecrypt(item.full, (pct) => {
      fill.style.width = (pct * 85) + '%';
      label.textContent = `${Math.round(pct * 100)}%`;
    });

    fill.style.width = '95%';
    label.textContent = 'Dešifruji…';
    await sleep(100);

    const mimeTypes = {
      jpg: 'image/jpeg', jpeg: 'image/jpeg',
      png: 'image/png', webp: 'image/webp',
      gif: 'image/gif', tiff: 'image/tiff',
      mp4: 'video/mp4', mov: 'video/quicktime',
      webm: 'video/webm', mkv: 'video/x-matroska',
      avi: 'video/x-msvideo', m4v: 'video/mp4',
    };
    const mime = mimeTypes[item.ext] || 'application/octet-stream';
    const blob = new Blob([decrypted], { type: mime });
    const url  = URL.createObjectURL(blob);

    // If video, show in lightbox
    if (item.type === 'video') {
      const content = document.getElementById('lb-content');
      const oldVideo = content.querySelector('video');
      if (oldVideo) oldVideo.pause();
      content.innerHTML = `<video controls autoplay src="${url}" style="max-width:100%;max-height:80vh;border-radius:4px"></video>`;
      // Revoke after a bit
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else {
      // Download image
      const a = document.createElement('a');
      a.href = url;
      a.download = item.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    fill.style.width = '100%';
    showToast(item.type === 'video' ? '▶ Video připraveno' : '↓ Staženo: ' + item.name);

  } catch (err) {
    showToast('Chyba stahování: ' + err.message);
  } finally {
    await sleep(400);
    prog.classList.remove('visible');
    btn.classList.remove('loading');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Full rozlišení`;
  }
}

// ─── Keyboard Navigation ──────────────────────────────────────────────────

document.addEventListener('keydown', e => {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft')  navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
});

// ─── Helpers ──────────────────────────────────────────────────────────────

function formatSize(bytes) {
  if (!bytes) return '';
  if (bytes < 1024)       return bytes + ' B';
  if (bytes < 1024*1024)  return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/(1024*1024)).toFixed(1) + ' MB';
}

function formatDuration(s) {
  const m = Math.floor(s / 60);
  const sec = Math.round(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
</body>
</html>
