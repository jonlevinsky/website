<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Added glassmorphism and liquid glass effects */
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .progress-track {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        .video-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex items-center justify-center p-8">
    <!-- Simplified to single video player with glassmorphism design -->
    <div class="w-full max-w-4xl">
        <!-- Video Player Container -->
        <div class="liquid-glass rounded-3xl overflow-hidden shadow-2xl">
            <!-- Video Display -->
            <div class="relative video-container">
                <video 
                    id="videoPlayer" 
                    class="w-full aspect-video object-cover"
                    poster="/placeholder.svg?height=720&width=1280"
                >
                    <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
                    Váš prohlížeč nepodporuje video element.
                </video>
                
                <!-- Play/Pause Overlay -->
                <div id="playOverlay" class="absolute inset-0 flex items-center justify-center cursor-pointer group">
                    <div class="control-btn rounded-full p-6 group-hover:scale-110 transition-transform duration-300">
                        <svg id="overlayPlayIcon" class="w-16 h-16 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Controls Panel -->
            <div class="p-6 space-y-4">
                <!-- Progress Bar -->
                <div class="relative">
                    <div class="progress-track h-2 rounded-full overflow-hidden">
                        <div id="progressFill" class="progress-fill h-full w-0 transition-all duration-150 rounded-full"></div>
                    </div>
                    <input 
                        type="range" 
                        id="progressBar" 
                        class="absolute inset-0 w-full h-2 opacity-0 cursor-pointer"
                        min="0" 
                        max="100" 
                        value="0"
                    >
                </div>
                
                <!-- Time Display -->
                <div class="flex justify-between text-white text-sm font-medium">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                
                <!-- Control Buttons -->
                <div class="flex items-center justify-center space-x-6">
                    <!-- Play/Pause Button -->
                    <button id="playPauseBtn" class="control-btn rounded-full p-4 hover:scale-110 transition-all duration-300">
                        <svg id="playPauseIcon" class="w-8 h-8 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </button>
                    
                    <!-- Volume Control -->
                    <div class="flex items-center space-x-3">
                        <button id="muteBtn" class="control-btn rounded-full p-3 hover:scale-110 transition-all duration-300">
                            <svg id="volumeIcon" class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                            </svg>
                        </button>
                        
                        <div class="relative w-24">
                            <div class="progress-track h-1 rounded-full">
                                <div id="volumeFill" class="progress-fill h-full w-1/2 rounded-full"></div>
                            </div>
                            <input 
                                type="range" 
                                id="volumeSlider" 
                                class="absolute inset-0 w-full h-1 opacity-0 cursor-pointer"
                                min="0" 
                                max="100" 
                                value="50"
                            >
                        </div>
                    </div>
                    
                    <!-- Fullscreen Button -->
                    <button id="fullscreenBtn" class="control-btn rounded-full p-3 hover:scale-110 transition-all duration-300">
                        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const playPauseIcon = document.getElementById('playPauseIcon');
        const overlayPlayIcon = document.getElementById('overlayPlayIcon');
        const playOverlay = document.getElementById('playOverlay');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationSpan = document.getElementById('duration');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeFill = document.getElementById('volumeFill');
        const muteBtn = document.getElementById('muteBtn');
        const volumeIcon = document.getElementById('volumeIcon');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        let isPlaying = false;
        let isMuted = false;

        // Format time helper
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // Play/Pause functionality
        function togglePlayPause() {
            if (isPlaying) {
                video.pause();
                playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                overlayPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                playOverlay.style.opacity = '1';
                playOverlay.style.pointerEvents = 'auto';
            } else {
                video.play();
                playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                overlayPlayIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                playOverlay.style.opacity = '0';
                playOverlay.style.pointerEvents = 'none';
            }
            isPlaying = !isPlaying;
        }

        // Event listeners
        playPauseBtn.addEventListener('click', togglePlayPause);
        playOverlay.addEventListener('click', togglePlayPause);

        // Update progress
        video.addEventListener('timeupdate', () => {
            const progress = (video.currentTime / video.duration) * 100;
            progressBar.value = progress || 0;
            progressFill.style.width = `${progress || 0}%`;
            currentTimeSpan.textContent = formatTime(video.currentTime);
        });

        // Update duration
        video.addEventListener('loadedmetadata', () => {
            durationSpan.textContent = formatTime(video.duration);
        });

        // Seek functionality
        progressBar.addEventListener('input', () => {
            const seekTime = (progressBar.value / 100) * video.duration;
            video.currentTime = seekTime;
            progressFill.style.width = `${progressBar.value}%`;
        });

        // Volume control
        volumeSlider.addEventListener('input', () => {
            video.volume = volumeSlider.value / 100;
            volumeFill.style.width = `${volumeSlider.value}%`;
            updateVolumeIcon();
        });

        // Mute functionality
        muteBtn.addEventListener('click', () => {
            if (isMuted) {
                video.muted = false;
                volumeSlider.value = video.volume * 100;
                volumeFill.style.width = `${video.volume * 100}%`;
            } else {
                video.muted = true;
            }
            isMuted = !isMuted;
            updateVolumeIcon();
        });

        // Update volume icon
        function updateVolumeIcon() {
            if (video.muted || video.volume === 0) {
                volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
            } else if (video.volume < 0.5) {
                volumeIcon.innerHTML = '<path d="M18.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM5 9v6h4l5 5V4L9 9H5z"/>';
            } else {
                volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>';
            }
        }

        // Fullscreen functionality
        fullscreenBtn.addEventListener('click', () => {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }
        });

        // Initialize
        video.volume = 0.5;
        volumeFill.style.width = '50%';
        updateVolumeIcon();

        // Video ended event
        video.addEventListener('ended', () => {
            isPlaying = false;
            playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            overlayPlayIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
            playOverlay.style.opacity = '1';
            playOverlay.style.pointerEvents = 'auto';
            progressFill.style.width = '0%';
        });

        // Hide overlay on video start
        playOverlay.style.transition = 'opacity 0.3s ease';
    </script>
</body>
</html>
