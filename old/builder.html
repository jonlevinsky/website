<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Panel — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --bg-sidebar: #0f0f12;
            --bg-card: #131316;
            --bg-input: #18181b;
            --bg-hover: #1c1c20;
            --border: #27272a;
            --border-active: #3f3f46;
            --text: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --accent-glow: rgba(99,102,241,0.15);
            --danger: #ef4444;
            --danger-soft: rgba(239,68,68,0.1);
            --success: #22c55e;
            --success-soft: rgba(34,197,94,0.1);
            --warning: #f59e0b;
            --radius: 12px;
            --radius-sm: 8px;
            --radius-xs: 6px;
            --font: 'Inter', system-ui, -apple-system, sans-serif;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
            --sidebar-w: 280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            display: flex;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ═══════════════ SCROLLBAR ═══════════════ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--border-active); }

        /* ═══════════════ SIDEBAR ═══════════════ */
        .sidebar {
            width: var(--sidebar-w);
            min-width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .sidebar-brand {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-brand h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-brand h1 .logo-dot {
            width: 8px; height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent);
        }

        .sidebar-brand p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .sidebar-actions {
            padding: 16px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-projects-header {
            padding: 12px 20px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-projects-header span {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .sidebar-projects-header .count {
            font-size: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 100px;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 16px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            user-select: none;
            position: relative;
        }

        .sidebar-item:hover { background: var(--bg-hover); color: var(--text); }
        .sidebar-item.active {
            background: var(--accent-glow);
            color: var(--text);
            border: 1px solid rgba(99,102,241,0.2);
        }

        .sidebar-item .item-thumb {
            width: 36px; height: 36px;
            border-radius: var(--radius-xs);
            background: var(--bg-input);
            border: 1px solid var(--border);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-item .item-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }

        .sidebar-item .item-thumb svg {
            width: 16px; height: 16px; color: var(--text-muted);
        }

        .sidebar-item .item-info { flex: 1; min-width: 0; }

        .sidebar-item .item-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
        }

        .sidebar-item .item-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .sidebar-item .drag-handle {
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.15s;
            cursor: grab;
        }

        .sidebar-item:hover .drag-handle { opacity: 0.6; }
        .sidebar-item .drag-handle:hover { opacity: 1; }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ═══════════════ MAIN CONTENT ═══════════════ */
        .main {
            flex: 1;
            height: 100vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .main-topbar {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(9,9,11,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 64px;
        }

        .main-topbar h2 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            max-width: 900px;
        }

        /* Empty state */
        .empty-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            gap: 16px;
            padding: 40px;
        }

        .empty-main svg { opacity: 0.3; }
        .empty-main h3 { font-size: 18px; color: var(--text-secondary); font-weight: 500; }
        .empty-main p { font-size: 13px; max-width: 360px; text-align: center; line-height: 1.6; }

        /* ═══════════════ BUTTONS ═══════════════ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-xs);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            background: var(--bg-input);
            color: var(--text-secondary);
            text-decoration: none;
            white-space: nowrap;
            line-height: 1;
        }

        .btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-active); }
        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

        .btn-danger {
            background: var(--danger-soft);
            color: var(--danger);
            border-color: rgba(239,68,68,0.2);
        }
        .btn-danger:hover { background: rgba(239,68,68,0.2); border-color: rgba(239,68,68,0.3); }

        .btn-success {
            background: var(--success);
            color: #0a2612;
            border-color: var(--success);
            font-weight: 600;
        }
        .btn-success:hover { filter: brightness(1.1); }

        .btn-ghost { background: transparent; border-color: transparent; }
        .btn-ghost:hover { background: var(--bg-hover); border-color: var(--border); }

        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-icon { padding: 7px; width: 32px; height: 32px; }

        .btn-full { width: 100%; justify-content: center; }

        .btn svg { flex-shrink: 0; }

        /* ═══════════════ FORM ELEMENTS ═══════════════ */
        .section {
            margin-bottom: 32px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .field {
            margin-bottom: 20px;
        }

        .field-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }

        .field-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        input[type="text"], input[type="number"], select, textarea {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: var(--radius-xs);
            font-family: var(--font);
            font-size: 13px;
            transition: border-color 0.15s, box-shadow 0.15s;
            line-height: 1.5;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        textarea { resize: vertical; min-height: 100px; }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml,%3Csvg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 32px;
            cursor: pointer;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ═══════════════ THUMBNAIL PREVIEW ═══════════════ */
        .thumb-preview {
            width: 100%;
            aspect-ratio: 16/9;
            background: var(--bg-input);
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 10px;
            position: relative;
        }

        .thumb-preview img {
            width: 100%; height: 100%; object-fit: cover;
            position: absolute; inset: 0;
        }

        .thumb-preview .placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* ═══════════════ MEDIA GRID ═══════════════ */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .media-card {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            transition: border-color 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .media-card:hover { border-color: var(--border-active); }

        .media-card-thumb {
            aspect-ratio: 16/10;
            background: #000;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-card-thumb img, .media-card-thumb video {
            width: 100%; height: 100%; object-fit: cover;
        }

        .media-card-thumb .no-src {
            color: var(--text-muted);
            font-size: 11px;
        }

        .media-card-type {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 8px;
            border-radius: 4px;
        }

        .media-card-actions {
            position: absolute;
            top: 8px; right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .media-card:hover .media-card-actions { opacity: 1; }

        .media-card-actions .btn-icon {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            padding: 4px;
        }

        .media-card-actions .btn-icon:hover { background: var(--danger); }

        .media-card-body {
            padding: 10px 12px;
            display: grid;
            gap: 6px;
        }

        .media-card-body input {
            padding: 6px 8px;
            font-size: 12px;
        }

        .media-src-row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .media-src-row input { flex: 1; }
        .media-src-row select { width: 80px; flex-shrink: 0; padding: 6px 24px 6px 8px; font-size: 12px; }

        /* Add media card */
        .media-card-add {
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            transition: all 0.15s;
            min-height: 180px;
            background: transparent;
        }

        .media-card-add:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-glow);
        }

        /* ═══════════════ TOAST ═══════════════ */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
        }

        .toast {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 500;
            transform: translateX(120%);
            transition: transform 0.4s var(--ease);
        }

        .toast.show { transform: translateX(0); }
        .toast.success { border-left: 3px solid var(--success); }
        .toast.error { border-left: 3px solid var(--danger); }
        .toast.info { border-left: 3px solid var(--accent); }

        /* ═══════════════ DIALOG OVERLAY ═══════════════ */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0s 0.2s;
        }

        .dialog-overlay.open {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.2s, visibility 0s;
        }

        .dialog {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform: scale(0.95) translateY(10px);
            transition: transform 0.3s var(--ease);
        }

        .dialog-overlay.open .dialog {
            transform: scale(1) translateY(0);
        }

        .dialog h3 { font-size: 16px; margin-bottom: 8px; }
        .dialog p { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.6; }
        .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }

        /* ═══════════════ STATUS BAR ═══════════════ */
        .status-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }

        .unsaved-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--warning);
            font-weight: 500;
        }

        .unsaved-indicator.show { display: flex; }

        /* ═══════════════ RESPONSIVE ═══════════════ */
        @media (max-width: 768px) {
            .sidebar { width: 100%; min-width: 100%; position: fixed; left: -100%; transition: left 0.3s var(--ease); z-index: 50; }
            .sidebar.open { left: 0; }
            .field-row { grid-template-columns: 1fr; }
            .main-content { padding: 20px; }
            .media-grid { grid-template-columns: 1fr 1fr; }
        }

        /* Disable transitions on load */
        .preload * { transition: none !important; }

        /* ═══════════════ KEY ANIMATIONS ═══════════════ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.3s var(--ease) forwards; }
    </style>
</head>
<body class="preload">

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <h1><span class="logo-dot"></span> Portfolio Admin</h1>
        <p>Správa projektů a médií</p>
    </div>

    <div class="sidebar-actions">
        <button class="btn btn-primary btn-full" onclick="addProject()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
            Nový projekt
        </button>
    </div>

    <div class="sidebar-projects-header">
        <span>Projekty</span>
        <span class="count" id="project-count">0</span>
    </div>

    <div class="sidebar-list" id="sidebar-list">
        <!-- Project list items rendered here -->
    </div>

    <div class="sidebar-footer">
        <button class="btn btn-success btn-full" id="saveBtn" onclick="saveData()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Stáhnout JSON
        </button>
        <div class="unsaved-indicator" id="unsaved">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Máte neuložené změny
        </div>
        <a href="index.html" class="btn btn-ghost btn-full btn-sm" style="margin-top:4px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Zpět na portfolio
        </a>
    </div>
</aside>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main" id="main">
    <!-- Rendered dynamically -->
</div>

<!-- Toast -->
<div id="toastContainer" class="toast-container"></div>

<!-- Delete dialog -->
<div class="dialog-overlay" id="deleteDialog">
    <div class="dialog">
        <h3 id="dialogTitle">Smazat projekt?</h3>
        <p id="dialogMsg">Tato akce je nevratná. Projekt bude odstraněn ze seznamu.</p>
        <div class="dialog-actions">
            <button class="btn" onclick="closeDialog()">Zrušit</button>
            <button class="btn btn-danger" id="dialogConfirm" onclick="confirmDelete()">Smazat</button>
        </div>
    </div>
</div>

<script>
// ═══════════════ STATE ═══════════════
let projects = [];
let activeProjectIdx = -1;
let hasUnsavedChanges = false;
let pendingDelete = null;

// ═══════════════ INIT ═══════════════
async function loadData() {
    try {
        const res = await fetch('projects.json?v=' + Date.now());
        if (!res.ok) throw new Error('Nelze načíst data');
        projects = await res.json();
        if (!Array.isArray(projects)) projects = [];
    } catch (err) {
        console.warn('Načítání:', err);
        projects = [];
    }
    renderSidebar();
    if (projects.length > 0) selectProject(0);
    else renderEmptyMain();
}

// ═══════════════ TOAST ═══════════════
function showToast(msg, type = 'info') {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
        t.classList.remove('show');
        setTimeout(() => t.remove(), 400);
    }, 3000);
}

// ═══════════════ UNSAVED ═══════════════
function markUnsaved() {
    hasUnsavedChanges = true;
    document.getElementById('unsaved').classList.add('show');
}

// ═══════════════ SIDEBAR ═══════════════
function renderSidebar() {
    const list = document.getElementById('sidebar-list');
    document.getElementById('project-count').textContent = projects.length;

    if (!projects.length) {
        list.innerHTML = '<div style="padding:24px 12px;text-align:center;color:var(--text-muted);font-size:12px;">Žádné projekty</div>';
        return;
    }

    list.innerHTML = projects.map((p, i) => {
        const isActive = i === activeProjectIdx;
        const mediaCount = (p.media || []).length;
        const typeIcon = p.type === 'video'
            ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21"/></svg>'
            : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>';

        let thumbHtml = typeIcon;
        const thumbSrc = p.thumbnail || ((p.media || [])[0]?.src || '');
        if (thumbSrc && !thumbSrc.match(/\.(mp4|webm|mov)$/i)) {
            thumbHtml = `<img src="${esc(thumbSrc)}" alt="">`;
        }

        return `
            <div class="sidebar-item ${isActive ? 'active' : ''}" onclick="selectProject(${i})" draggable="true" data-idx="${i}"
                 ondragstart="onDragStart(event,${i})" ondragover="onDragOver(event)" ondrop="onDrop(event,${i})">
                <div class="item-thumb">${thumbHtml}</div>
                <div class="item-info">
                    <div class="item-title">${esc(p.title) || 'Bez názvu'}</div>
                    <div class="item-meta">${p.type === 'video' ? 'Video' : 'Foto'} · ${mediaCount} médií</div>
                </div>
            </div>`;
    }).join('');
}

// ═══════════════ PROJECT EDITOR ═══════════════
function selectProject(idx) {
    if (idx < 0 || idx >= projects.length) return;
    activeProjectIdx = idx;
    renderSidebar();
    renderProjectEditor();
}

function renderEmptyMain() {
    document.getElementById('main').innerHTML = `
        <div class="empty-main">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>
                <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            <h3>Vyberte nebo vytvořte projekt</h3>
            <p>Vyberte projekt ze seznamu vlevo, nebo vytvořte nový kliknutím na tlačítko výše.</p>
        </div>`;
}

function renderProjectEditor() {
    const p = projects[activeProjectIdx];
    if (!p) return renderEmptyMain();

    const main = document.getElementById('main');
    const mediaHtml = renderMediaGrid(p.media || [], activeProjectIdx);

    main.innerHTML = `
        <div class="main-topbar">
            <h2>${esc(p.title) || 'Bez názvu'}</h2>
            <div class="topbar-actions">
                <button class="btn btn-sm btn-danger" onclick="requestDeleteProject(${activeProjectIdx})">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Smazat projekt
                </button>
            </div>
        </div>
        <div class="main-content fade-in">
            <div class="section">
                <div class="section-label">Základní informace</div>

                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Název projektu</label>
                        <input type="text" value="${escAttr(p.title)}" placeholder="Např. Zlatý Ámos 2025"
                               oninput="updateField(${activeProjectIdx}, 'title', this.value)">
                    </div>
                    <div class="field">
                        <label class="field-label">Typ projektu</label>
                        <select onchange="updateField(${activeProjectIdx}, 'type', this.value)">
                            <option value="photo" ${p.type === 'photo' ? 'selected' : ''}>📷 Fotografie</option>
                            <option value="video" ${p.type === 'video' ? 'selected' : ''}>🎬 Video</option>
                        </select>
                    </div>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label class="field-label">Rok</label>
                        <input type="text" value="${escAttr(p.year || '')}" placeholder="2025"
                               oninput="updateField(${activeProjectIdx}, 'year', this.value)">
                    </div>
                    <div class="field">
                        <label class="field-label">ID (automatické)</label>
                        <input type="number" value="${p.id || ''}" disabled style="opacity:0.5;cursor:not-allowed;">
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Popis projektu</label>
                    <textarea placeholder="Popište tento projekt..."
                              oninput="updateField(${activeProjectIdx}, 'bio', this.value)">${esc(p.bio || '')}</textarea>
                    <div class="field-hint">Zobrazí se na stránce projektu pod nadpisem.</div>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Hlavní náhled</div>

                <div class="thumb-preview" id="thumbPreview">
                    ${p.thumbnail
                        ? `<img src="${esc(p.thumbnail)}" alt="Náhled">`
                        : `<div class="placeholder">
                               <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                               <span>Žádný náhled</span>
                           </div>`
                    }
                </div>
                <div style="display:flex;gap:8px;align-items:stretch;">
                    <input type="text" value="${escAttr(p.thumbnail || '')}" placeholder="./photo/projekt/thumb.jpg"
                           oninput="updateField(${activeProjectIdx}, 'thumbnail', this.value)" style="flex:1;">
                    <label class="btn" style="cursor:pointer;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Upload
                        <input type="file" accept="image/*" style="display:none;" onchange="handleThumbUpload(event, ${activeProjectIdx})">
                    </label>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Média (${(p.media||[]).length})</div>

                <div style="display:flex;gap:8px;margin-bottom:16px;">
                    <button class="btn btn-sm" onclick="addMedia(${activeProjectIdx})">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                        Přidat médium
                    </button>
                    <label class="btn btn-sm" style="cursor:pointer;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        Nahrát soubory
                        <input type="file" multiple style="display:none;" onchange="handleMediaUpload(event, ${activeProjectIdx})">
                    </label>
                </div>

                <div class="media-grid" id="mediaGrid">
                    ${mediaHtml}
                </div>
            </div>
        </div>`;
}

function renderMediaGrid(mediaArr, pIdx) {
    if (!mediaArr.length) {
        return `<div style="grid-column:1/-1;text-align:center;padding:40px;border:1px dashed var(--border);border-radius:var(--radius-sm);color:var(--text-muted);font-size:13px;">
            Žádná média. Přidejte soubory tlačítkem výše.
        </div>`;
    }

    return mediaArr.map((m, mIdx) => {
        let preview = '<span class="no-src">Bez zdroje</span>';
        if (m.src) {
            if (m.type === 'video' || m.src.match(/\.(mp4|webm|mov)$/i)) {
                preview = `<video src="${esc(m.src)}" muted preload="metadata"></video>`;
            } else {
                preview = `<img src="${esc(m.src)}" loading="lazy">`;
            }
        }

        return `
            <div class="media-card" draggable="true" data-pidx="${pIdx}" data-midx="${mIdx}"
                 ondragstart="onMediaDragStart(event,${pIdx},${mIdx})"
                 ondragover="onDragOver(event)"
                 ondrop="onMediaDrop(event,${pIdx},${mIdx})">
                <div class="media-card-thumb">
                    ${preview}
                    <span class="media-card-type">${m.type === 'video' ? '🎬 Video' : '📷 Foto'}</span>
                    <div class="media-card-actions">
                        <button class="btn btn-icon" onclick="event.stopPropagation();removeMedia(${pIdx},${mIdx})" title="Smazat">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
                <div class="media-card-body">
                    <div class="media-src-row">
                        <select onchange="updateMediaField(${pIdx},${mIdx},'type',this.value)">
                            <option value="photo" ${m.type==='photo'?'selected':''}>Foto</option>
                            <option value="video" ${m.type==='video'?'selected':''}>Video</option>
                        </select>
                        <input type="text" placeholder="Cesta k souboru" value="${escAttr(m.src||'')}"
                               onchange="updateMediaField(${pIdx},${mIdx},'src',this.value)">
                    </div>
                    <input type="text" placeholder="Titulek" value="${escAttr(m.title||'')}"
                           onchange="updateMediaField(${pIdx},${mIdx},'title',this.value)">
                </div>
            </div>`;
    }).join('');
}

// ═══════════════ PROJECT ACTIONS ═══════════════
function addProject() {
    const nextId = projects.length ? Math.max(...projects.map(p => p.id || 0)) + 1 : 1;
    projects.unshift({
        id: nextId,
        title: '',
        type: 'photo',
        thumbnail: '',
        bio: '',
        year: new Date().getFullYear().toString(),
        media: []
    });
    markUnsaved();
    activeProjectIdx = 0;
    renderSidebar();
    renderProjectEditor();
    // Focus title input
    setTimeout(() => {
        const titleInput = document.querySelector('.main-content input[type="text"]');
        if (titleInput) titleInput.focus();
    }, 100);
}

function requestDeleteProject(idx) {
    pendingDelete = { type: 'project', idx };
    const name = projects[idx]?.title || 'Bez názvu';
    document.getElementById('dialogTitle').textContent = `Smazat „${name}"?`;
    document.getElementById('dialogMsg').textContent = 'Projekt bude odstraněn ze seznamu. Soubory na disku zůstanou.';
    document.getElementById('deleteDialog').classList.add('open');
}

function closeDialog() {
    document.getElementById('deleteDialog').classList.remove('open');
    pendingDelete = null;
}

function confirmDelete() {
    if (!pendingDelete) return;

    if (pendingDelete.type === 'project') {
        projects.splice(pendingDelete.idx, 1);
        markUnsaved();
        if (activeProjectIdx >= projects.length) activeProjectIdx = projects.length - 1;
        renderSidebar();
        if (projects.length > 0) selectProject(Math.max(0, activeProjectIdx));
        else renderEmptyMain();
        showToast('Projekt smazán', 'success');
    }

    closeDialog();
}

function updateField(pIdx, field, val) {
    projects[pIdx][field] = val;
    markUnsaved();

    // Update sidebar title in real time
    if (field === 'title') {
        const topbar = document.querySelector('.main-topbar h2');
        if (topbar) topbar.textContent = val || 'Bez názvu';

        const sidebarItem = document.querySelectorAll('.sidebar-item')[pIdx];
        if (sidebarItem) {
            const titleEl = sidebarItem.querySelector('.item-title');
            if (titleEl) titleEl.textContent = val || 'Bez názvu';
        }
    }

    if (field === 'thumbnail') {
        const preview = document.getElementById('thumbPreview');
        if (preview) {
            preview.innerHTML = val
                ? `<img src="${esc(val)}" alt="Náhled">`
                : `<div class="placeholder"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>Žádný náhled</span></div>`;
        }
    }
}

// ═══════════════ MEDIA ACTIONS ═══════════════
function addMedia(pIdx) {
    if (!projects[pIdx].media) projects[pIdx].media = [];
    const type = projects[pIdx].type === 'video' ? 'video' : 'photo';
    projects[pIdx].media.push({ type, src: '', title: '', caption: '' });
    markUnsaved();
    renderProjectEditor();
}

function removeMedia(pIdx, mIdx) {
    projects[pIdx].media.splice(mIdx, 1);
    markUnsaved();
    renderProjectEditor();
}

function updateMediaField(pIdx, mIdx, field, val) {
    projects[pIdx].media[mIdx][field] = val;
    markUnsaved();
    if (field === 'src' || field === 'type') {
        renderProjectEditor();
    }
}

// ═══════════════ UPLOAD (Local server) ═══════════════
async function uploadFiles(files, basePath, folder) {
    const convertToBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve({ name: file.name, data: reader.result });
        reader.onerror = error => reject(error);
    });

    const fileArray = [];
    for (const f of files) {
        fileArray.push(await convertToBase64(f));
    }

    const res = await fetch('api.php?action=upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ base: basePath, folder, files: fileArray })
    });
    return res.json();
}

async function handleThumbUpload(e, pIdx) {
    const file = e.target.files[0];
    if (!file) return;
    const proj = projects[pIdx];
    const folder = proj.title || 'Novy';
    const basePath = proj.type === 'photo' ? 'photo' : 'video';

    showToast('Nahrávám náhled...', 'info');
    try {
        const res = await uploadFiles([file], basePath, folder);
        if (res.success && res.uploaded.length > 0) {
            proj.thumbnail = res.uploaded[0].path;
            markUnsaved();
            renderProjectEditor();
            showToast('Náhled nahrán', 'success');
        } else {
            showToast('Chyba nahrávání', 'error');
        }
    } catch (err) {
        showToast('Chyba sítě', 'error');
    }
}

async function handleMediaUpload(e, pIdx) {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    const proj = projects[pIdx];
    const folder = proj.title || 'Novy';
    const basePath = proj.type === 'photo' ? 'photo' : 'video';

    showToast(`Nahrávám ${files.length} souborů...`, 'info');
    try {
        const res = await uploadFiles(files, basePath, folder);
        if (res.success) {
            if (!proj.media) proj.media = [];
            res.uploaded.forEach(info => {
                const isVid = info.name.toLowerCase().match(/\.(mp4|webm|mov)$/);
                proj.media.push({
                    type: isVid ? 'video' : 'photo',
                    src: info.path,
                    title: '',
                    caption: ''
                });
            });
            markUnsaved();
            renderProjectEditor();
            showToast(`${res.uploaded.length} souborů nahráno`, 'success');
        }
    } catch (err) {
        showToast('Chyba nahrávání', 'error');
    }
}

// ═══════════════ SAVE (GitHub Pages compatible) ═══════════════
async function saveData() {
    const json = JSON.stringify(projects, null, 2);

    // Try server first (local dev)
    try {
        const res = await fetch('api.php?action=save_json', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: json
        });
        const data = await res.json();
        if (data.success) {
            hasUnsavedChanges = false;
            document.getElementById('unsaved').classList.remove('show');
            showToast('Uloženo na server ✓', 'success');
            return;
        }
    } catch (e) {
        // Server not available — fallback to download
    }

    // Fallback: download JSON file
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'projects.json';
    a.click();
    URL.revokeObjectURL(url);

    hasUnsavedChanges = false;
    document.getElementById('unsaved').classList.remove('show');
    showToast('JSON stažen — nahraďte soubor v repozitáři', 'info');
}

// ═══════════════ DRAG & DROP (Projects) ═══════════════
let dragProjectIdx = -1;

function onDragStart(e, idx) {
    dragProjectIdx = idx;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'project');
    e.target.style.opacity = '0.4';
}

function onDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
}

function onDrop(e, targetIdx) {
    e.preventDefault();
    e.target.style.opacity = '1';
    if (e.dataTransfer.getData('text/plain') !== 'project') return;
    if (dragProjectIdx === targetIdx || dragProjectIdx < 0) return;

    const [moved] = projects.splice(dragProjectIdx, 1);
    projects.splice(targetIdx, 0, moved);

    if (activeProjectIdx === dragProjectIdx) activeProjectIdx = targetIdx;
    else if (dragProjectIdx < activeProjectIdx && targetIdx >= activeProjectIdx) activeProjectIdx--;
    else if (dragProjectIdx > activeProjectIdx && targetIdx <= activeProjectIdx) activeProjectIdx++;

    markUnsaved();
    renderSidebar();
    dragProjectIdx = -1;
}

// ═══════════════ DRAG & DROP (Media) ═══════════════
let dragMediaInfo = null;

function onMediaDragStart(e, pIdx, mIdx) {
    dragMediaInfo = { pIdx, mIdx };
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', 'media');
    e.target.style.opacity = '0.4';
}

function onMediaDrop(e, pIdx, targetMIdx) {
    e.preventDefault();
    e.target.style.opacity = '1';
    if (e.dataTransfer.getData('text/plain') !== 'media') return;
    if (!dragMediaInfo || dragMediaInfo.pIdx !== pIdx) return;

    const srcIdx = dragMediaInfo.mIdx;
    if (srcIdx === targetMIdx) return;

    const arr = projects[pIdx].media;
    const [moved] = arr.splice(srcIdx, 1);
    arr.splice(targetMIdx, 0, moved);

    markUnsaved();
    renderProjectEditor();
    dragMediaInfo = null;
}

// ═══════════════ UTILS ═══════════════
function esc(str) {
    if (!str && str !== 0) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}
function escAttr(v) { return esc(v).replace(/\n/g, ' '); }

// ═══════════════ WARN ON LEAVE ═══════════════
window.addEventListener('beforeunload', e => {
    if (hasUnsavedChanges) {
        e.preventDefault();
        e.returnValue = '';
    }
});

// Remove preload class after paint
requestAnimationFrame(() => {
    requestAnimationFrame(() => {
        document.body.classList.remove('preload');
    });
});

// Start
loadData();
</script>
